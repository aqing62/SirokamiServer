<!doctype html>
<!--
  duel.html —— 「决斗客户端」入口页（**生成产物**）
  ⚠ 由 tools/sync-duel-client.mjs 从 tools/duel-page.template.html + ygopro-web 的 play.html 组装
     要改入口 UI / 样式：改 tools/duel-page.template.html；要改客户端：改上游再重跑同步脚本
  流程（对照官方交接文档 §0）：
     未登录 → 登录（账号/密码）→ 已登录 → 显示当前卡组 + 「开始匹配」
     → 点开始匹配 → duel.html?auto=1 → 客户端自动进房/自动准备/自动开局 → 猜拳时切到对局界面
-->
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开始匹配 · 白神服</title>
<!-- 顺序不能变：先官网回放样式（场地/日志），再客户端样式 -->
<link rel="stylesheet" href="css/replay-viewer.css?v=20261004i">
<link rel="stylesheet" href="css/duel-client.css?v=20261017n">
<script>
/* 决斗客户端的 WebSocket 端点：由站点统一定（客户端启动时读 URL 里的 ?ws=）。
   放在 <head> 且用 replaceState 打补丁 —— 客户端脚本读的是 location.search，
   必须**在它加载之前**改好；用 replaceState 而不是跳转，避免丢掉"点击手势"。
   nginx: api.ygopro3.cn/ws → srvpro2 wsPort（TLS 回源） */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (!q.get('ws')) {
      q.set('ws', 'wss://api.ygopro3.cn/ws');
      history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
    }
  } catch (e) {}
})();
</script>
<style>
/* ── 入口层（本站自己的 UI；不动客户端产物） ── */

.de-title { font-size: 1.15rem; font-weight: 800; letter-spacing: 1px; margin-bottom: 4px;
  background: linear-gradient(135deg,#D4AF37,#FFD700); -webkit-background-clip: text; background-clip: text; color: transparent; }
.de-sub { font-size: .78rem; color: #8d8d96; margin-bottom: 18px; }
.de-field { margin-bottom: 12px; }
.de-field label { display: block; font-size: .78rem; color: #a9a9b3; margin-bottom: 5px; }

  border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.05); color: #f2eee6; font-size: .92rem; }
.de-field input:focus { outline: none; border-color: rgba(212,175,55,.6); }

  background: linear-gradient(135deg,#D4AF37,#FFD700); color: #1a1a2e; }
.de-btn:disabled { opacity: .5; cursor: not-allowed; }
.de-btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.18); color: #cfc8bd; font-weight: 500; }

</style>





<style>
/* ── 决斗界面布局（只作用于 duel.html）──
   用户要求：**中间（场地）最大、固定比例、不要自适应**。
   老站是 flex + width: min(100%, calc((100vh-210px)*4/3)) 的自适应算法，手机上会算歪。
   这里直接改成固定三栏 grid，中间 1fr 吃掉剩余空间。 */
/* 手机横屏：原来决斗区只占屏高一部分，下面一大片空白 —— 撑满视口 */
#replayModal { height: 100vh !important; max-height: none !important; }
#replayModal .replay-main { height: auto !important; flex: 1 1 auto !important; min-height: 0 !important; }
#replayModal .replay-main {
  display: grid !important;
  grid-template-columns: 15% minmax(0, 1fr) 18% !important;   /* 左信息 / 中场地 / 右日志 */
  gap: 8px !important;
  width: 100% !important;
  height: 100% !important;
  aspect-ratio: auto !important;
  align-items: stretch !important;
}
#replayModal #ypCardInfo { width: auto !important; height: auto !important; min-width: 0 !important; }
#replayModal .replay-field { width: auto !important; height: auto !important; min-width: 0 !important; }
#replayModal .replay-log { width: auto !important; max-width: none !important; min-width: 0 !important; }
/* 手卡放大 + 发动/盖放按钮放大（禁止竖排） */
#replayModal .rp-hand .rp-card { width: 62px; height: 89px; }
#replayModal .rp-hand { gap: 4px; }
#ypCardMenu .yp-menu-item {
  padding: 12px 18px !important; font-size: 15px !important;
  white-space: nowrap !important; min-width: 0 !important;
}
#replayModal .replay-log-body { padding: 8px 10px !important; }
#replayModal .rp-log-line { font-size: .78rem; line-height: 1.6; }

@media (orientation: landscape) and (max-height: 620px) {
  /* ── 手机横屏：把对局区**钉满整个视口** ──
     用户实测：19.5:9 手机上场地左右各一大片空白、整体下方还有约 1/3 空白。
     原因是 #replayModal 的高度链没真正撑开（被上层布局和它自己的 display 阶段切换影响），
     所以这里直接 fixed + inset:0，不再依赖任何相对高度。 */
  html, body { height: 100% !important; overflow: hidden !important; }
  #replayModal {
    position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important;
    max-height: none !important; margin: 0 !important; padding: 4px !important;
    display: flex !important; flex-direction: column !important; background: #0a0a0c !important;
  }
  /* 主区用**绝对定位**硬钉在顶栏下面 —— 模态框和它之间还有包装层，flex 作用不到（实测只长到 282/432 ✗）
     用户反馈"上下变黑底、像锁了比例"，就是这个原因。 */
  #replayModal .replay-main {
    /* ⚠ 有祖先带 transform（客户端的阶段切换动画）→ fixed 会"退化成 absolute"（实测 top:74 变成 y=137、高度缩到 228）
       所以不靠定位，改成在正常流里用 vh 撑高度：最省事也最稳。 */
    position: static !important;
    /* 移动端要用 dvh（动态视口高度 = 真正看得见的高度，不含浏览器地址栏）；
       vh 在手机上会被浏览器的工具栏"吃掉"一截（实测模拟环境里 100vh=364 而可见高度=432 → 算出 282 ✗）。
       两个都写：支持 dvh 的用 dvh，不支持的退回 vh。 */
    height: calc(100vh - 78px) !important;
    height: calc(100dvh - 78px) !important;
    min-height: 0 !important; max-height: none !important; aspect-ratio: auto !important;
    width: 100% !important; margin: 0 !important;
    grid-template-columns: 7% minmax(0, 1fr) 15% !important; gap: 6px !important;
  }
  #replayModal #ypCardInfo { max-width: none !important; width: auto !important; overflow: hidden !important; font-size: 10px !important; }
  #replayModal .replay-log { max-width: none !important; width: auto !important; min-width: 0 !important; flex: 0 0 auto !important; }
  #replayModal .replay-field, #replayModal #replayField { flex: 1 1 auto !important; min-width: 0 !important; height: 100% !important; }
  #replayModal { box-sizing: border-box !important; }
  /* 手机横屏：左右再缩一档，把宽度全给中间；手卡/按钮仍保持够大 */
  #replayModal .replay-main { grid-template-columns: 11% minmax(0, 1fr) 15% !important; gap: 5px !important; }
  #replayModal .rp-hand .rp-card { width: 54px; height: 78px; }
  #replayModal .rp-hand { gap: 3px; }
  #ypCardMenu .yp-menu-item { padding: 10px 16px !important; font-size: 14px !important; white-space: nowrap !important; }
  #replayModal .replay-log-body { padding: 6px 8px !important; }
  #replayModal .rp-log-line { font-size: .72rem; line-height: 1.5; }
  #replayModal .replay-log-title { font-size: .78rem; }
  #replayModal #ypCardInfo { font-size: 11px !important; }
}
</style>

<style>
/* ══ 竖屏（手机主打）：按用户画的四段式 —— 日志 / 卡图+卡片效果 / 选择列表 / 对局 ══
   对局放最下面并占满剩余空间（最大）；上面三段各自限高，避免把场地挤没。 */
@media (orientation: portrait) {
  html, body { height: 100% !important; overflow: hidden !important; }
  #replayModal {
    position: fixed !important; inset: 0 !important; width: 100% !important;
    height: 100dvh !important; max-height: none !important; margin: 0 !important; padding: 4px !important;
    display: flex !important; flex-direction: column !important; background: #0a0a0c !important; box-sizing: border-box !important;
  }
  #replayModal .replay-main {
    display: flex !important; flex-direction: column !important; gap: 5px !important;
    width: 100% !important; height: auto !important; flex: 1 1 auto !important; min-height: 0 !important;
    max-height: none !important; aspect-ratio: auto !important;
    grid-template-columns: none !important;
  }
  /* ① 日志（最上，占 18%） */
  #replayModal .replay-log {
    order: 1 !important; width: 100% !important; max-width: none !important;
    height: 18dvh !important; max-height: 18dvh !important; flex: 0 0 auto !important;
  }
  #replayModal .replay-log-body { padding: 6px 8px !important; }
  #replayModal .rp-log-line { font-size: 11.5px !important; line-height: 1.5 !important; }
  /* ② 卡图 | 卡片效果（并排，占 22%） */
  #replayModal #ypCardInfo {
    order: 2 !important; width: 100% !important; max-width: none !important;
    height: 22dvh !important; max-height: 22dvh !important; flex: 0 0 auto !important;
    display: flex !important; flex-direction: row !important; gap: 8px !important; overflow: hidden !important;
  }
  #replayModal #ypCardInfo img { max-height: 21dvh !important; width: auto !important; flex: 0 0 auto !important; }
  /* ③ 选择列表（选择盘）—— 竖屏时固定在第 40%~62% 那一条，别盖住场地 */
  #ypChooser {
    position: fixed !important; left: 4px !important; right: 4px !important;
    top: 41dvh !important; bottom: auto !important; max-height: 21dvh !important; overflow: auto !important;
    z-index: 87 !important;
  }
  #ypChooser .yp-chooser-grid img { max-height: 12dvh !important; width: auto !important; }
  /* ④ 对局（最下，占满剩余 —— 最大的一块） */
  #replayModal .replay-field, #replayModal #replayField {
    order: 4 !important; width: 100% !important; flex: 1 1 auto !important; min-height: 0 !important; height: auto !important;
  }
  /* 投降按钮和时点别叠在一起：竖屏投降挪到右上、时点放左上 */
  #ypSurrender { top: 6px !important; right: 6px !important; padding: 7px 13px !important; }
  #ypTimeLeft { top: 6px !important; right: auto !important; left: 6px !important; }
}
</style>
</head>

  <div class="de-card" id="deCard">

<script src="js/ygopro-web-browser.js?v=20261016a"></script>
<script src="js/viewer-live.js?v=20261016w"></script>
<script src="js/duel-client.js?v=20261017j"></script>
<script>
/* 入口层逻辑：登录 / 显示当前卡组 / 开始匹配（不改客户端产物） */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var entry = document.getElementById('duelEntry');
  var title = document.getElementById('deTitle');
  var sub = document.getElementById('deSub');
  var body = document.getElementById('deBody');
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function show(html) { body.innerHTML = html; }
  function msg(t) { var m = document.getElementById('deMsg'); if (m) m.textContent = t || ''; }

  // ?auto=1 = 已点过「开始匹配」→ 隐藏入口层，交给客户端自动进房
  // ?bare=1 = 直接裸奔客户端界面（自动化测试 / 别的页面嵌 iframe 时用）
  if (q.get('auto') === '1' || q.get('bare') === '1') { entry.classList.add('hidden'); return; }

  fetch('/api/duel/whoami?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.loggedIn) return renderLogin();
    renderMatch(d);
  }).catch(function () { renderLogin(); });

  function renderLogin(notice) {
    title.textContent = '登录';
    sub.textContent = '用白神服账号登录后即可开始匹配';
    show(
      '<div class="de-field"><label>账号</label><input id="deUser" autocomplete="username"></div>' +
      '<div class="de-field"><label>密码</label><input id="dePass" type="password" autocomplete="current-password"></div>' +
      '<button class="de-btn" id="deLogin">登录</button>' +
      '<div class="de-msg" id="deMsg"></div>' +
      '<div class="de-foot">还没有账号？<a href="#" id="deToReg">注册一个</a></div>'
    );
    if (notice) { var m = document.getElementById('deMsg'); if (m) { m.style.color = '#8ee6a8'; m.textContent = notice; } }
    var go = function () {
      var u = document.getElementById('deUser').value.trim();
      var p = document.getElementById('dePass').value;
      if (!u || !p) return msg('请输入账号和密码');
      msg('登录中…');
      fetch('/api/forum/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (r) {
          if (!r.ok || !r.j || r.j.ok === false) return msg((r.j && r.j.error) || '账号或密码错误');
          location.reload();
        }).catch(function (e) { msg('登录失败：' + e.message); });
    };
    document.getElementById('deLogin').onclick = go;
    document.getElementById('dePass').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    var toReg = document.getElementById('deToReg');
    if (toReg) toReg.onclick = function (e) { e.preventDefault(); renderRegister(); };
  }

  function renderRegister() {
    title.textContent = '注册';
    sub.textContent = '注册后回到登录页 · 账号与密码都支持中文';
    show(
      '<div class="de-field"><label>名称（游戏里显示的名字，可留空=账号）</label><input id="deName" maxlength="64"></div>' +
      '<div class="de-field"><label>账号（2~24 个字符，支持中文）</label><input id="deUser" autocomplete="username" maxlength="24"></div>' +
      '<div class="de-field"><label>密码（6~64 个字符，支持中文）</label><input id="dePass" type="password" autocomplete="new-password"></div>' +
      '<div class="de-field"><label>再次输入密码</label><input id="dePass2" type="password" autocomplete="new-password"></div>' +
      '<button class="de-btn" id="deReg">注册</button>' +
      '<div class="de-msg" id="deMsg"></div>' +
      '<div class="de-foot">已有账号？<a href="#" id="deToLogin">去登录</a></div>'
    );
    var go = function () {
      var u = document.getElementById('deUser').value.trim();
      var p = document.getElementById('dePass').value;
      var p2 = document.getElementById('dePass2').value;
      var nm = document.getElementById('deName').value.trim();
      if (!u || !p) return msg('请填写账号和密码');
      if (p !== p2) return msg('两次输入的密码不一致');
      msg('注册中…');
      fetch('/api/forum/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p, password2: p2, displayName: nm }),
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (r) {
          if (!r.ok || !r.j || r.j.ok === false) return msg((r.j && r.j.error) || '注册失败');
          renderLogin('注册成功！账号 ' + u + '，请登录');
        }).catch(function (e) { msg('注册失败：' + e.message); });
    };
    document.getElementById('deReg').onclick = go;
    document.getElementById('dePass2').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    var toLogin = document.getElementById('deToLogin');
    if (toLogin) toLogin.onclick = function (e) { e.preventDefault(); renderLogin(); };
  }

  function renderMatch(d) {
    title.textContent = '开始匹配';
    sub.textContent = '天梯随机匹配 · 无需输入房间号';
    show(
      '<div class="de-line"><span>当前卡组</span><b id="deDeck">读取中…</b></div>' +
      '<button class="de-btn" id="deStart">开始匹配</button>' +
      '<div class="de-msg" id="deMsg"></div>' +
      '<div class="de-foot">已登录：' + esc(d.name || d.account) + ' · 匹配成功后自动准备、自动开局</div>'
    );
    document.getElementById('deStart').onclick = function () { location.href = 'duel.html?auto=1'; };
    fetch('/api/duel/deck?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var el = document.getElementById('deDeck');
      if (j && j.name) el.textContent = j.name + '（主' + (j.main || []).length + '）';
      else el.textContent = '未设置（进入后可用「导入卡组」按钮导入 .ydk）';
    }).catch(function () {
      var el = document.getElementById('deDeck');
      if (el) el.textContent = '未设置';
    });
  }
})();
</script>
</body>
</html>
