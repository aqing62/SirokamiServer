<!doctype html>
<!--
  duel.html —— 「决斗客户端」入口页（**生成产物**）
  ⚠ 由 tools/sync-duel-client.mjs 从 tools/duel-page.template.html + ygopro-web 的 play.html 组装
     要改入口 UI / 样式：改 tools/duel-page.template.html；要改客户端：改上游再重跑同步脚本
  流程（对照官方交接文档 §0）：
     未登录 → 登录（账号/密码）→ 已登录 → 显示当前卡组 + 「开始匹配」
     → 点开始匹配 → duel.html?auto=1 → 客户端自动进房/自动准备/自动开局 → 猜拳时切到对局界面
-->
<html lang="zh-CN">

<title>开始匹配 · 白神服</title>
<!-- 顺序不能变：先官网回放样式（场地/日志），再客户端样式 -->
<link rel="stylesheet" href="css/replay-viewer.css?v=20261118c42">
<link rel="stylesheet" href="css/duel-client.css?v=20261117s">
<script>
/* 决斗客户端的 WebSocket 端点：由站点统一定（客户端启动时读 URL 里的 ?ws=）。
   放在 <head> 且用 replaceState 打补丁 —— 客户端脚本读的是 location.search，
   必须**在它加载之前**改好；用 replaceState 而不是跳转，避免丢掉"点击手势"。
   nginx: api.ygopro3.cn/ws → srvpro2 wsPort（TLS 回源） */
(function () {
  try {
    var q = new URLSearchParams(location.search);
    if (!q.get('ws')) {
      q.set('ws', 'wss://api.ygopro3.cn/ws');
      history.replaceState(null, '', location.pathname + '?' + q.toString() + location.hash);
    }
  } catch (e) {}
})();
</script>

<style>
/* ── 决斗界面布局（只作用于 duel.html）──
   用户要求：**中间（场地）最大、固定比例、不要自适应**。
   老站是 flex + width: min(100%, calc((100vh-210px)*4/3)) 的自适应算法，手机上会算歪。
   这里直接改成固定三栏 grid，中间 1fr 吃掉剩余空间。 */
/* 手机横屏：原来决斗区只占屏高一部分，下面一大片空白 —— 撑满视口 */
#replayModal { height: 100vh !important; max-height: none !important; }
#replayModal .replay-main { height: auto !important; flex: 1 1 auto !important; min-height: 0 !important; }
#replayModal .replay-main {
  display: grid !important;
  grid-template-columns: 15% minmax(0, 1fr) 18% !important;   /* 左信息 / 中场地 / 右日志 */
  gap: 8px !important;
  width: 100% !important;
  height: 100% !important;
  aspect-ratio: auto !important;
  align-items: stretch !important;
}
#replayModal #ypCardInfo { width: auto !important; height: auto !important; min-width: 0 !important; }
#replayModal .replay-field { width: auto !important; height: auto !important; min-width: 0 !important; }
#replayModal .replay-log { width: auto !important; max-width: none !important; min-width: 0 !important; }
/* 手卡放大 + 发动/盖放按钮放大（禁止竖排） */
#replayModal .rp-hand .rp-card { width: 62px; height: 89px; }
#replayModal .rp-hand { gap: 4px; }
#ypCardMenu .yp-menu-item {
  padding: 12px 18px !important; font-size: 15px !important;
  white-space: nowrap !important; min-width: 0 !important;
}
#replayModal .replay-log-body { padding: 8px 10px !important; }
#replayModal .rp-log-line { font-size: .78rem; line-height: 1.6; }

@media (orientation: landscape) and (max-height: 620px) {
  /* ── 手机横屏：把对局区**钉满整个视口** ──
     用户实测：19.5:9 手机上场地左右各一大片空白、整体下方还有约 1/3 空白。
     原因是 #replayModal 的高度链没真正撑开（被上层布局和它自己的 display 阶段切换影响），
     所以这里直接 fixed + inset:0，不再依赖任何相对高度。 */
  html, body { height: 100% !important; overflow: hidden !important; }
  #replayModal {
    position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important;
    max-height: none !important; margin: 0 !important; padding: 4px !important;
    display: flex !important; flex-direction: column !important; background: #0a0a0c !important;
  }
  /* 主区用**绝对定位**硬钉在顶栏下面 —— 模态框和它之间还有包装层，flex 作用不到（实测只长到 282/432 ✗）
     用户反馈"上下变黑底、像锁了比例"，就是这个原因。 */
  #replayModal .replay-main {
    /* ⚠ 有祖先带 transform（客户端的阶段切换动画）→ fixed 会"退化成 absolute"（实测 top:74 变成 y=137、高度缩到 228）
       所以不靠定位，改成在正常流里用 vh 撑高度：最省事也最稳。 */
    position: static !important;
    /* 移动端要用 dvh（动态视口高度 = 真正看得见的高度，不含浏览器地址栏）；
       vh 在手机上会被浏览器的工具栏"吃掉"一截（实测模拟环境里 100vh=364 而可见高度=432 → 算出 282 ✗）。
       两个都写：支持 dvh 的用 dvh，不支持的退回 vh。 */
    height: calc(100vh - 78px) !important;
    height: calc(100dvh - 78px) !important;
    min-height: 0 !important; max-height: none !important; aspect-ratio: auto !important;
    width: 100% !important; margin: 0 !important;
    grid-template-columns: 7% minmax(0, 1fr) 15% !important; gap: 6px !important;
  }
  #replayModal #ypCardInfo { max-width: none !important; width: auto !important; overflow: hidden !important; font-size: 10px !important; }
  #replayModal .replay-log { max-width: none !important; width: auto !important; min-width: 0 !important; flex: 0 0 auto !important; }
  #replayModal .replay-field, #replayModal #replayField { flex: 1 1 auto !important; min-width: 0 !important; height: 100% !important; }
  #replayModal { box-sizing: border-box !important; }
  /* 手机横屏：左右再缩一档，把宽度全给中间；手卡/按钮仍保持够大 */
  #replayModal .replay-main { grid-template-columns: 11% minmax(0, 1fr) 15% !important; gap: 5px !important; }
  /* PATCH(白神服) 2026-11-05: 手机竖屏手牌太小 → 放大（原来 54x78），并按张数自适应 */
  /* 手牌：放大一档，但**用高度**兜住（原来只放大宽度，手牌行变高把名字/LP 挤出屏幕 ✗） */
  #replayModal .rp-hand { max-height: 13.5vh !important; align-items: flex-end !important; }
  #replayModal .rp-hand .rp-card { height: 12.6vh !important; width: auto !important;
    max-width: 19vw !important; min-width: 44px !important; aspect-ratio: 59 / 86; }
  :root { --yp-hand-h: 14vh; }

  /* 名字/LP 固定在场地角落，手牌再高也不会被挤出去 */
  #replayModal .rp-nametag { z-index: 30 !important; }
  #replayModal .rp-nametag-opp { top: 2px !important; right: 4px !important; }
  #replayModal .rp-nametag-self { bottom: 2px !important; left: 4px !important; }
  #replayModal .rp-lp { font-size: 1.15rem !important; }
  #replayModal .rp-player-name { font-size: .72rem !important; }
  #replayModal .rp-hand { gap: 4px !important; overflow-x: auto !important; overflow-y: hidden !important;
    scrollbar-width: none; -ms-overflow-style: none; }
  #replayModal .rp-hand::-webkit-scrollbar { width: 0; height: 0; }
  #replayModal .rp-hand { gap: 3px; }
  #ypCardMenu .yp-menu-item { padding: 10px 16px !important; font-size: 14px !important; white-space: nowrap !important; }
  #replayModal .replay-log-body { padding: 6px 8px !important; }
  #replayModal .rp-log-line { font-size: .72rem; line-height: 1.5; }
  #replayModal .replay-log-title { font-size: .78rem; }
  #replayModal #ypCardInfo { font-size: 11px !important; }
}
</style>

<style>

  /* ② 卡图 | 卡片效果（并排，占 22%） */
  #replayModal #ypCardInfo {

  }
  #replayModal #ypCardInfo img { max-height: 21dvh !important; width: auto !important; flex: 0 0 auto !important; }
  /* ③ 选择列表（选择盘）—— 竖屏时固定在第 40%~62% 那一条，别盖住场地 */
  #ypChooser {

  }

  /* ④ 对局（最下，占满剩余 —— 最大的一块） */
  #replayModal .replay-field, #replayModal #replayField {
    order: 4 !important; width: 100% !important; flex: 1 1 auto !important; min-height: 0 !important; height: auto !important;
  }
  /* 投降按钮和时点别叠在一起：竖屏投降挪到右上、时点放左上 */
  #ypSurrender { top: 6px !important; right: 6px !important; padding: 7px 13px !important; }
  #ypTimeLeft { top: 6px !important; right: auto !important; left: 6px !important; }

<style>
/* ── 提示弹层（猜拳/连锁/宣告…）必须盖在钉满全屏的对局区之上 ──
   实测：把 #replayModal 改成 position:fixed 占满全屏之后，猜拳弹窗被它盖住 → 手机上"看不到猜拳"(用户反馈) */

#ypCardMenu { z-index: 199 !important; }

/* ── 卡图加载提示不能挡住操作（命中测试实测：它盖在猜拳按钮上面 ✗）──

.rp-loading-tip, #rpLoadingTip, .replay-loading-tip {
  pointer-events: none !important; z-index: 5 !important; opacity: .85 !important;
}
</style>
</style>
<style>

<style>
/* ── 竖屏：卡片选择改成"一行往右滑"（用户反馈竖着滑违反习惯 + 卡片太小）── */

</style>


<style>
/* ── ③ 阶段按钮（切洗手牌/进战阶/结束回合）挪到右侧黑边，别挡额外格子 ── */

/* ── 回合与阶段分成两行：原来挤成"自己回合1 主一"一整条，太长挡场地 ── */

<style>

   （备牌界面 85 / 亮牌 88 / 时点 72 / 数量条 71 / 投降 70 / 宣告 90 全被盖住过） */

<style>
/* siro-cardinfo-layout */

<style>

<script>
/* 入口层逻辑：登录 / 显示当前卡组 / 开始匹配（不改客户端产物） */
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var entry = document.getElementById('duelEntry');
  var title = document.getElementById('deTitle');
  var sub = document.getElementById('deSub');
  var body = document.getElementById('deBody');
  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
  function show(html) { body.innerHTML = html; }
  function msg(t) { var m = document.getElementById('deMsg'); if (m) m.textContent = t || ''; }

  // ?auto=1 = 已点过「开始匹配」→ 隐藏入口层，交给客户端自动进房
  // ?bare=1 = 直接裸奔客户端界面（自动化测试 / 别的页面嵌 iframe 时用）
  if (q.get('watch') === '1') {

    document.body.classList.add('watch-mode');
    entry.classList.add('hidden');
    var wb = document.createElement('div');
    wb.id = 'watchBadge';
    wb.innerHTML = '<span>👁 观战中</span><b>房间：' + (q.get('room') || '-') + '</b>' +
      '<span id="watchCount" style="color:#ffd76a;font-weight:700"></span>' +
      '<button id="watchSwap" title="双方位置对调（自动对齐没生效时手动用）">⇅</button>' +
      '<button id="watchExit">退出观战</button>';
    // 放进右侧日志栏的顶部；没有日志容器时退回 body
    var _logCol = document.querySelector('#replayModal .replay-log') || document.querySelector('.replay-log');
    if (_logCol) _logCol.insertBefore(wb, _logCol.firstChild);
    else document.body.appendChild(wb);
    try {
      var _wc0 = document.getElementById('watchCount');
      if (_wc0 && window.__ypWatchCount) _wc0.textContent = ' · ' + window.__ypWatchCount + ' 人观战';
    } catch (e) {}
  }
  if (q.get('auto') === '1' || q.get('bare') === '1' || q.get('watch') === '1') { entry.classList.add('hidden'); return; }

  fetch('/api/duel/whoami?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    // 从大厅来的登录入口：已登录就直接回大厅
    try {
      var _qq = new URLSearchParams(location.search);
      if (_qq.get('from') === 'lobby' && d && d.loggedIn) { location.href = 'lobby.html'; return; }
    } catch (e) {}
    if (!d || !d.loggedIn) return renderLogin();
    renderMatch(d);
  }).catch(function () { renderLogin(); });

  function renderLogin(notice) {
    title.textContent = '登录';
    sub.textContent = '用白神服账号登录后即可开始匹配';
    show(
      '<div class="de-field"><label>账号</label><input id="deUser" autocomplete="username"></div>' +
      '<div class="de-field"><label>密码</label><input id="dePass" type="password" autocomplete="current-password"></div>' +
      '<button class="de-btn" id="deLogin">登录</button>' +
      '<div class="de-msg" id="deMsg"></div>' +
      '<div class="de-foot">还没有账号？<a href="#" id="deToReg">注册一个</a></div>'
    );
    if (notice) { var m = document.getElementById('deMsg'); if (m) { m.style.color = '#8ee6a8'; m.textContent = notice; } }
    var go = function () {
      var u = document.getElementById('deUser').value.trim();
      var p = document.getElementById('dePass').value;
      if (!u || !p) return msg('请输入账号和密码');
      msg('登录中…');
      fetch('/api/forum/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (r) {
          if (!r.ok || !r.j || r.j.ok === false) return msg((r.j && r.j.error) || '账号或密码错误');
          // PATCH(白神服) 2026-11-08: 从大厅进来登录的 → 登录成功后回大厅（不要停在入口页）
          try {
            var _q = new URLSearchParams(location.search);
            if (_q.get('from') === 'lobby') { location.href = 'lobby.html'; return; }
          } catch (e) {}
          location.reload();
        }).catch(function (e) { msg('登录失败：' + e.message); });
    };
    document.getElementById('deLogin').onclick = go;
    document.getElementById('dePass').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    var toReg = document.getElementById('deToReg');
    if (toReg) toReg.onclick = function (e) { e.preventDefault(); renderRegister(); };
  }

  function renderRegister() {
    title.textContent = '注册';
    sub.textContent = '注册后回到登录页 · 账号与密码都支持中文';
    show(
      '<div class="de-field"><label>名称（游戏里显示的名字，可留空=账号）</label><input id="deName" maxlength="64"></div>' +
      '<div class="de-field"><label>账号（2~24 个字符，支持中文）</label><input id="deUser" autocomplete="username" maxlength="24"></div>' +
      '<div class="de-field"><label>密码（6~64 个字符，支持中文）</label><input id="dePass" type="password" autocomplete="new-password"></div>' +
      '<div class="de-field"><label>再次输入密码</label><input id="dePass2" type="password" autocomplete="new-password"></div>' +
      '<button class="de-btn" id="deReg">注册</button>' +
      '<div class="de-msg" id="deMsg"></div>' +
      '<div class="de-foot">已有账号？<a href="#" id="deToLogin">去登录</a></div>'
    );
    var go = function () {
      var u = document.getElementById('deUser').value.trim();
      var p = document.getElementById('dePass').value;
      var p2 = document.getElementById('dePass2').value;
      var nm = document.getElementById('deName').value.trim();
      if (!u || !p) return msg('请填写账号和密码');
      if (p !== p2) return msg('两次输入的密码不一致');
      msg('注册中…');
      fetch('/api/forum/register', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p, password2: p2, displayName: nm }),
      }).then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (r) {
          if (!r.ok || !r.j || r.j.ok === false) return msg((r.j && r.j.error) || '注册失败');
          renderLogin('注册成功！账号 ' + u + '，请登录');
        }).catch(function (e) { msg('注册失败：' + e.message); });
    };
    document.getElementById('deReg').onclick = go;
    document.getElementById('dePass2').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    var toLogin = document.getElementById('deToLogin');
    if (toLogin) toLogin.onclick = function (e) { e.preventDefault(); renderLogin(); };
  }

  function renderMatch(d) {
    title.textContent = '开始匹配';
    sub.textContent = '天梯随机匹配 · 无需输入房间号';
    show(
      '<div class="de-line"><span>当前卡组</span><b id="deDeck">读取中…</b></div>' +
      '<button class="de-btn" id="deStart">开始匹配</button>' +
      '<div class="de-msg" id="deMsg"></div>' +
      '<div class="de-foot">已登录：' + esc(d.name || d.account) + ' · 匹配成功后自动准备、自动开局</div>'
    );
    document.getElementById('deStart').onclick = function () { location.href = 'duel.html?auto=1'; };
    fetch('/api/duel/deck?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var el = document.getElementById('deDeck');
      if (j && j.name) el.textContent = j.name + '（主' + (j.main || []).length + '）';
      else el.textContent = '未设置（进入后可用「导入卡组」按钮导入 .ydk）';
    }).catch(function () {
      var el = document.getElementById('deDeck');
      if (el) el.textContent = '未设置';
    });
  }
})();
</script>

<script>
(function () {
  var b = document.getElementById('watchExit');
  if (b) b.onclick = function () { location.href = 'lobby.html'; };
  // ── 「具体信息」：NS/SP/EF/ATK 统计 ──
  //   PATCH(白神服) 2026-11-16: 按钮/面板放到 body 上（fixed 定位），
  //   原来挂在 #replayField 里，场地重建(createFieldDOM)一次就被清掉 → "出现一会就消失"
  (function () {
    function boot() {
      if (document.getElementById('ypStatsBtn')) return;
      var btn = document.createElement('button');
      btn.id = 'ypStatsBtn';
      btn.textContent = '具体信息';
      btn.title = 'NS 通常召唤 · SP 特殊召唤 · EF 效果发动 · ATK 攻击表示攻击力合计';
      document.body.appendChild(btn);
      function mk(cls) {
        var d = document.createElement('div');
        d.className = 'yp-dstats ' + cls;
        document.body.appendChild(d);
        return d;
      }
      var top = mk('yp-dstats-top');
      var bottom = mk('yp-dstats-bottom');
      var open = false, timer = 0;

      function field() { return document.getElementById('replayField'); }
      // 面板只显示四行：NS / SP / EF / ATK（用户要求：不要分类明细，越简单越好）
      function line(st) {
        st = st || {};
        return 'NS: <b>' + (st.ns || 0) + '</b><br>SP: <b>' + (st.sp || 0) + '</b><br>EF: <b>'
          + (st.ef || 0) + '</b><br>ATK: <b>' + (st.atk || 0) + '</b>';
      }
      function place() {
        var f = field();
        var ready = !!(f && f.querySelector('.rp-board'));
        if (!ready) {
          btn.style.display = 'none';
          top.style.display = bottom.style.display = 'none';
          return;
        }
        btn.style.display = 'block';
        top.style.display = '';
        bottom.style.display = '';

        var fr = f.getBoundingClientRect();
        var opp = f.querySelector('.rp-nametag-opp');
        var slf = f.querySelector('.rp-nametag-self');
        var or = opp ? opp.getBoundingClientRect() : null;
        var sr = slf ? slf.getBoundingClientRect() : null;

        // 按钮：贴场地左边缘，放在回合/阶段标签下方（没有标签时退回竖直居中）
        var tl = f.querySelector('.rp-turn-label');
        var tr = tl ? tl.getBoundingClientRect() : null;
        btn.style.left = Math.round(fr.left + 6) + 'px';
        btn.style.top = Math.round((tr && tr.height ? tr.bottom : (fr.top + fr.height / 2 - 14)) + 8) + 'px';

        // 对方统计：场地右上角，紧贴对方名字下方（用 right 锚定，和面板宽度无关）
        var tRight = Math.round(Math.min(window.innerWidth - 8, fr.right - 4));
        top.style.left = 'auto';
        top.style.right = (window.innerWidth - tRight) + 'px';
        top.style.top = Math.round((or ? or.bottom : fr.top + 26) + 4) + 'px';

        // 自己统计：贴**自己名字左侧**（在场地内，不要跑到左边的卡片信息栏上 —— 用户实测 ✗）
        bottom.style.left = Math.round((sr ? sr.left : (fr.left + 8))) + 'px';
        bottom.style.right = 'auto';
        bottom.style.bottom = Math.round(window.innerHeight - (sr ? sr.top : fr.bottom - 26) + 4) + 'px';
        bottom.style.top = 'auto';
        // 贴边：不再往内推（用户要求贴着自己的名字/场地左边缘）
      }
      function refresh() {
        var s2 = (window.__live && window.__live.duelStats) ? window.__live.duelStats() : null;
        if (s2) { top.innerHTML = line(s2[1]); bottom.innerHTML = line(s2[0]); }
        place();
      }
      function toggle() {
        open = !open;
        btn.classList.toggle('on', open);
        top.classList.toggle('show', open);
        bottom.classList.toggle('show', open);
        refresh();
        if (open) { timer = setInterval(refresh, 1000); }
        else { clearInterval(timer); timer = 0; }
      }
      btn.onclick = function (e) { e.stopPropagation(); toggle(); };
      window.addEventListener('resize', place);
      // 场地重建后位置会变 → 低频校正（按钮/面板本身不在场地里，不会消失）
      setInterval(function () { place(); }, 1500);
      place();
    }
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 600); });
    else setTimeout(boot, 600);
  })();

  var sw = document.getElementById('watchSwap');
  if (sw) sw.onclick = function () {
    try {
      if (window.__live && window.__live.swapSides) window.__live.swapSides();
      var c = window.__live.debugCounts ? window.__live.debugCounts() : null;
      if (c && c.meta && c.meta.players) {
        var names = c.meta.players.map(function (x) { return x.name + ':' + x.pos; }).join('  ');
        var lg = document.getElementById('replayLog');
        if (lg) {
          var d = document.createElement('div');
          d.className = 'rp-log-line';
          d.textContent = '⇅ 已手动换边：' + names;
          lg.appendChild(d); lg.scrollTop = lg.scrollHeight;
        }
      }
    } catch (e) {}
  };
})();
</script>
<script>
// YGOPro 风格：F 切换全屏（输入框内不拦截）
document.addEventListener('keydown', function (e) {
  var t = e.target;
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable)) {
    if (e.key === 'Escape' && t.id === 'ypChatInput') t.blur();
    return;
  }
  if (e.key === '/') {
    var ci = document.getElementById('ypChatInput');
    if (ci) { e.preventDefault(); ci.focus(); }
    return;
  }
  if (e.key === 'f' || e.key === 'F') {
    e.preventDefault();
    try {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen();
    } catch (err) {}
  }
});

// 站内聊天：决斗/观战都可用；输入条挂在对局日志栏底部
(function () {
  function ensureChatBar() {
    if (!window.__yp || !window.__yp.chat) return;
    if (document.getElementById('ypChatBar')) return;
    var col = document.querySelector('#replayModal .replay-log') || document.querySelector('.replay-log');
    if (!col) return;
    var bar = document.createElement('div');
    bar.id = 'ypChatBar';
    bar.style.cssText = 'position:sticky;bottom:0;z-index:20;display:flex;gap:5px;padding:5px 6px;border-top:1px solid rgba(212,175,55,.25);background:rgba(12,10,16,.92);flex:0 0 auto;';
    var inp = document.createElement('input');
    inp.id = 'ypChatInput';
    inp.maxLength = 200;
    inp.placeholder = '输入聊天…';
    inp.style.cssText = 'flex:1 1 auto;min-width:0;background:#1a171e;border:1px solid #3a3340;color:#e8e3da;border-radius:5px;padding:4px 7px;font:12px "Microsoft YaHei",system-ui,sans-serif;outline:none;';
    var btn = document.createElement('button');
    btn.textContent = '发送';
    btn.style.cssText = 'flex:0 0 auto;background:#3a2d16;border:1px solid #d4af37;color:#ffd76a;border-radius:5px;padding:3px 9px;font:600 12px "Microsoft YaHei",system-ui,sans-serif;cursor:pointer;';
    function doSend() {
      var txt = inp.value;
      if (!txt) return;
      if (window.__yp.chat(txt)) inp.value = '';
      inp.focus();
    }
    btn.onclick = doSend;
    inp.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { ev.preventDefault(); ev.stopPropagation(); doSend(); }
    });
    bar.appendChild(inp); bar.appendChild(btn);
    col.appendChild(bar);
  }
  setInterval(ensureChatBar, 800);
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(ensureChatBar, 500); });
  else setTimeout(ensureChatBar, 500);
})();
</script>
