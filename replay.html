<!DOCTYPE html>
<html lang="zh-CN">
<head>

<title>对局回放 · 白神服</title>
<!--
  新版回放器：直接**复用决斗客户端的查看器**（js/viewer-live.js）✓ 用户要求
  —— 所以回放里能看到和实战一模一样的：召唤演出（融合/同调/超量/连接/灵摆）、
     超量素材叠放、盖卡卡背、里侧翻面、发光提示、阶段横幅…… 老回放器只有静态盘面 ✗
  数据：/api/forum/replay/<R#> 返回 { roomName, players, messages:[{name,hex,len,f}] }
      —— 每条消息正好是查看器 __live.push() 需要的格式 ✓ 不需要再解码 ✓
-->
<link rel="stylesheet" href="css/replay-viewer.css?v=20261020r">
<link rel="stylesheet" href="css/duel-client.css?v=20261020r">
<style>
  html, body { margin: 0; height: 100%; background: #08070b; color: #ece9e4;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif; }
  #rpTop { position: fixed; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; gap: 10px;
    padding: 0 14px; background: rgba(12,10,16,.94); border-bottom: 1px solid rgba(212,175,55,.3); z-index: 99999; }
  #rpTop a { color: #9ec4f0; text-decoration: none; font-size: 13px; }
  #rpInput { width: 190px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,.16);
    background: rgba(255,255,255,.06); color: #f2eee6; font-size: 14px; }
  #rpLoad { padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; font-weight: 700;
    background: linear-gradient(135deg,#D4AF37,#FFD700); color: #1a1a2e; }
  #rpBar { display: flex; align-items: center; gap: 8px; margin-left: auto; }
  .rp-ctl { padding: 7px 14px; border-radius: 8px; border: 1px solid rgba(255,255,255,.18); cursor: pointer;
    background: rgba(255,255,255,.06); color: #ece9e4; font-size: 13px; }
  .rp-ctl.gold { background: linear-gradient(135deg,#D4AF37,#FFD700); color: #1a1a2e; border: none; font-weight: 700; }
  #rpInfo { font-size: 12px; color: #9b97a1; }
  #rpStage { position: absolute; top: 56px; left: 0; right: 0; bottom: 0; overflow: auto; }

  /* ── 卡片效果栏（左栏，常驻 ✓ 用户要求）── */
  #rpCardInfo { scrollbar-width: none; -ms-overflow-style: none; position: fixed; left: 0; top: 56px; bottom: 0; width: 268px; z-index: 50;
    background: rgba(14,12,18,.97); border-right: 1px solid rgba(212,175,55,.28);
    padding: 12px; overflow: auto; font-size: 12.5px; line-height: 1.6; }
  #rpCardInfo .rp-ci-empty { color: #7d7d86; font-size: 12px; padding: 10px 2px; }
  #rpCardInfo .rp-ci-img { width: 100%; aspect-ratio: 59 / 86; border-radius: 8px; overflow: hidden;
    margin-bottom: 8px; background: linear-gradient(160deg,#15131a,#0b0a0e);
    border: 1px solid rgba(212,175,55,.25); display: flex; align-items: center; justify-content: center; }
  #rpCardInfo .rp-ci-img::before { content: '@'; color: #3d3947; font-size: 22px; }
  #rpCardInfo .rp-ci-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  #rpCardInfo .rp-ci-img img { width: 100%; display: block; }
  #rpCardInfo .rp-ci-name { font-size: 15px; font-weight: 800; color: #F0E68C; margin-bottom: 4px; }
  #rpCardInfo .rp-ci-code { font-size: 11px; color: #6f6f78; font-weight: 400; }
  #rpCardInfo .rp-ci-type { font-size: 12px; color: #9ec4f0; margin-bottom: 8px; }
  #rpCardInfo .rp-ci-text { font-size: 12px; color: #d8d3ca; white-space: pre-wrap; }

  /* ── 查看列表（点牌堆弹出）── */
  #rpList { position: fixed; left: 278px; top: 66px; bottom: 0; width: 420px; z-index: 60;
    background: rgba(16,14,20,.98); border: 1px solid rgba(212,175,55,.35); border-radius: 10px;
    padding: 12px; overflow: auto; display: none; box-shadow: 0 18px 50px rgba(0,0,0,.6); }
  #rpList .rp-li-title { font-size: 13px; font-weight: 700; color: #FFD700; margin-bottom: 8px; }
  #rpList .rp-li-empty { color: #7d7d86; font-size: 12px; }
  #rpList .rp-li-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(74px, 1fr)); gap: 8px; }
  #rpList .rp-li-item { cursor: pointer; text-align: center; }
  #rpList .rp-li-item img { width: 100%; border-radius: 5px; display: block; background: #0b0a0e; }
  #rpList .rp-li-item span { display: block; font-size: 10px; color: #b9b4ab; margin-top: 3px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 场地往右让出左栏（信息栏 268px ✓）*/
  #rpStage { left: 268px !important; }
  #rpStage #replayModal { height: calc(100dvh - 56px) !important; }

  #rpMsg { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); z-index: 9999;
    background: rgba(20,18,26,.96); border: 1px solid rgba(212,175,55,.4); border-radius: 12px;
    padding: 22px 26px; text-align: center; font-size: 14px; line-height: 1.9; max-width: 78vw; }
  @media (orientation: portrait), (max-width: 860px) {
    #rpCardInfo { display: none; }                 /* 手机上信息栏收起，靠点卡看（列表仍可用 ✓） */
    #rpStage { left: 0 !important; }
    #rpList { left: 8px; right: 8px; width: auto; top: 66px; }
  }

  /* ── 场地尺寸修正（用户反馈：顶部有"神秘占位符"把场地挤下去 ✗）
     实测：#replayField 高 868 > 容器 824 → 查看器把盘面**居中** → 顶部空 35px ✗ 底部被挤出屏幕 ✗
     修法：把场地高度压到视口内 → 查看器 fitBoard 会自己缩放 → 盘面正好铺满 ✓ */
  /* siro-replay-fit */
  #rpStage #replayModal { height: calc(100dvh - 56px) !important; overflow: hidden !important; }
  #rpStage #replayField { height: calc(100dvh - 76px) !important; max-height: calc(100dvh - 76px) !important; }
  #rpStage .rp-modal-box { height: 100% !important; }
  #rpStage .rp-modal-body { height: 100% !important; padding: 0 !important; }
  #rpStage .replay-main { height: 100% !important; }
  /* 手机竖屏：顶栏更矮，场地贴边 ✓ */
  @media (orientation: portrait), (max-width: 860px) {
    #rpStage #replayField, #rpStage #replayModal { height: calc(100dvh - 56px) !important; max-height: calc(100dvh - 56px) !important; }
  }

  /* ── embed 模式（被旧回放弹窗用 iframe 嵌进来时 ✓）── */
  /* siro-replay-embed */
  /* 控制条保留 ✓（用户要的 播放/暂停/倍速/进度 ✓ 都在这里）
     只隐藏旧框里已有的：返回主页 / 回放码输入 / 载入按钮 ✓ */
  body.rp-embed #rpTop { display: flex !important; position: static !important; height: auto !important; padding: 4px 8px !important; margin: 0 !important; flex-wrap: wrap; }
  /* siro-replay-ctlfix */
  body.rp-embed #rpTop > a,
  body.rp-embed #rpInput,
  body.rp-embed #rpLoad { display: none !important; }
  body.rp-embed #rpTop #rpBar { margin-left: 0; flex: 1; }
  body.rp-embed #rpStage { position: static !important; top: auto !important; height: auto !important; }
  body.rp-embed #rpStage #replayModal { height: calc(100dvh - 92px) !important; }
  body.rp-embed #rpStage #replayModal { height: 100dvh !important; }
  body.rp-embed #rpStage #replayField { height: calc(100dvh - 20px) !important; max-height: calc(100dvh - 20px) !important; }
  body.rp-embed #rpCardInfo { top: 0 !important; }
  #rpCardInfo::-webkit-scrollbar { width: 0 !important; height: 0 !important; }

  /* siro-layout-3col —— 三分区严格不重叠 ✓（用户反馈：信息栏挡住场地 ✗）
     左：卡片效果栏（固定 268）  中：场地（自适应）  右：对局日志（查看器自带 ✓ 在 modal 内） */
  #rpStage { left: 276px !important; right: 0 !important; overflow: hidden !important; }
  body.rp-embed #rpStage { left: 276px !important; }
  #rpStage #replayModal { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important; }
  #rpStage .rp-modal-box { width: 100% !important; max-width: 100% !important; box-sizing: border-box !important;
    display: flex !important; flex-direction: column !important; }
  #rpStage .rp-modal-body { flex: 1 1 auto !important; min-height: 0 !important; overflow: hidden !important; }
  #rpStage .replay-main { width: 100% !important; height: 100% !important; display: flex !important; }
  #rpStage #replayField { flex: 1 1 auto !important; min-width: 0 !important; }
  #rpStage .replay-side { flex: 0 0 clamp(220px, 22vw, 320px) !important; min-width: 0 !important; }
  #rpCardInfo { left: 0 !important; width: 268px !important; }

  /* siro-ctl-right-align —— 控制栏（进度/按钮/倍速）**右对齐** ✓（用户要求） */
  #rpTop { justify-content: flex-end !important; }
  #rpTop #rpBar { margin-left: auto !important; display: flex !important; align-items: center !important; gap: 8px !important; }
  #rpTop #rpInfo { order: 2 !important; }
  #rpTop #rpSeek { order: 1 !important; }
  #rpTop #rpPrev { order: 3 !important; }
  #rpTop #rpPlay { order: 4 !important; }
  #rpTop #rpNext { order: 5 !important; }
  #rpTop #rpFast { order: 6 !important; }

  /* siro-polish-3col —— 三块区域**框风格统一** + 消除互压 + 手卡不被裁 ✓ */
  :root {
    --rp-zone-bg: rgba(14,12,18,.96);
    --rp-zone-border: 1px solid rgba(212,175,55,.30);
    --rp-zone-radius: 10px;
  }
  /* ① 查看器自带的 modal 外壳去掉边框/背景（它之前会压住左边效果栏的框 ✗）
        → 只留下 场地 / 日志 / 效果栏 三块**各自的框** ✓ 视觉统一 ✓ */
  #rpStage #replayModal,
  #rpStage .rp-modal-box,
  #rpStage .rp-modal-body,
  #rpStage .rp-modal-head {
    background: transparent !important;
    border: 0 !important;
    box-shadow: none !important;
    border-radius: 0 !important;
    padding: 0 !important;
    margin: 0 !important;
  }
  /* ② 三块区域统一样式 ✓ */
  #rpCardInfo {
    background: var(--rp-zone-bg) !important;
    border: var(--rp-zone-border) !important;
    border-radius: var(--rp-zone-radius) !important;
    padding: 10px 12px !important;
    box-sizing: border-box !important;
    left: 6px !important;              /* 留一点外边距，框线不贴边 ✓ */
    width: 262px !important;
    top: 6px !important; bottom: 6px !important;
  }
  #rpStage .replay-side {
    background: var(--rp-zone-bg) !important;
    border: var(--rp-zone-border) !important;
    border-radius: var(--rp-zone-radius) !important;
    padding: 10px 12px !important;
    box-sizing: border-box !important;
    margin: 6px 6px 6px 6px !important;
  }
  #rpStage #replayField {
    background: var(--rp-zone-bg) !important;
    border: var(--rp-zone-border) !important;
    border-radius: var(--rp-zone-radius) !important;
    padding: 6px !important;
    box-sizing: border-box !important;
    margin: 6px 0 !important;
  }
  /* ③ 场地起点让出左栏（6 外边距 + 262 宽 + 8 间隙 = 276）✓ 彻底不压 ✓ */
  #rpStage { left: 276px !important; top: 0 !important; right: 6px !important; bottom: 6px !important; }
  body.rp-embed #rpStage { left: 276px !important; }
  /* ④ 手卡被裁 ✗ → 给盘面留足高度（去掉固定 92px 折扣，改按内容区自适应）✓ */
  body.rp-embed #rpStage #replayModal { height: calc(100dvh - 60px) !important; max-height: none !important; }
  #rpStage #replayField { height: calc(100dvh - 84px) !important; max-height: none !important; }

  /* siro-fix-align-close —— ① 左栏与场地框上下对齐、等高 ✓（之前左栏从顶开始、场地被控制条推低 ✗） */
  #rpCardInfo { top: 52px !important; bottom: 6px !important; }
  body.rp-embed #rpCardInfo { top: 52px !important; }
  /* 场地那块也从同一水平线开始 ✓ */
  #rpStage #replayField { margin-top: 0 !important; }
  #rpStage { top: 52px !important; bottom: 6px !important; }
  body.rp-embed #rpStage { top: 52px !important; }

  /* siro-hand-fix2 —— 底部手卡被裁 ✗（用户截图确认）
     原因：场地高度设成 calc(100dvh - 84px)，而手卡画在场地**最底部** → 正好压在裁切线上 ✓
     修法：再留出一整排手卡的高度（约 90px）+ 内边距 ✓ 让手卡完整落在可视区内 ✓ */
  #rpStage #replayField {
    height: calc(100dvh - 200px) !important;
    max-height: calc(100dvh - 200px) !important;
    padding-bottom: 96px !important;      /* 手卡专用下边距 ✓ */
    box-sizing: border-box !important;
    overflow: hidden !important;
  }
  body.rp-embed #rpStage #replayField { height: calc(100dvh - 200px) !important; }
  #rpStage #replayModal { height: calc(100dvh - 90px) !important; }
  /* 手卡区自身不要再有额外外边距（避免又被顶出去 ✓） */
  #rpStage #replayField .rp-hand { margin-bottom: 0 !important; }

  /* siro-bridge —— 用户图2 的构图：控制栏并入旧框那一行，三块面板占满下方、等高、不留空 */
  body.rp-embed #rpTop { display: none !important; }        /* ★ 控制栏交给旧页面渲染 ✓ */
  #rpStage { top: 0 !important; bottom: 0 !important; left: 276px !important; right: 6px !important; }
  body.rp-embed #rpStage { top: 0 !important; }
  #rpStage #replayModal { height: 100% !important; }
  body.rp-embed #rpStage #replayModal { height: 100% !important; }
  #rpStage #replayField {
    height: 100% !important; max-height: none !important;
    padding-bottom: 0 !important;                            /* 不再手动留边 ✓ 交给查看器缩放 ✓ */
  }
  #rpStage .replay-main { height: 100% !important; }
  #rpStage .rp-modal-body { height: 100% !important; }
  #rpCardInfo { top: 6px !important; bottom: 6px !important; }

  /* siro-field-fill —— 场地框要**占满容器高度** ✓（实测：容器 674，场地只有 502 ✗ 因为查看器按宽度缩放 ✗）
     做法：用**最高优先级**的规则把 #replayField 的高度撑满 ✓ 并把盘面在里面垂直居中 ✓
     这样三块框真的等高 ✓ 下方不再空出那 172px（你圈的 ? ? ?）✓ */
  #replayField, #rpStage #replayField, body.rp-embed #replayField {
    height: 100% !important;
    min-height: 100% !important;
    max-height: 100% !important;
    display: flex !important;
    flex-direction: column !important;
    justify-content: center !important;     /* 盘面在框内垂直居中 ✓ 上下留白均分 ✓ */
    align-items: center !important;
    box-sizing: border-box !important;
  }
  /* 盘面本身（查看器里的两层包裹）保持原尺寸、不拉伸 ✓ */
  #replayField > * { flex: 0 0 auto !important; }
</style>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var msgs = [], idx = -1, playing = false, timer = 0, speed = 1, info = null;

  /* siro-replay-controls: 进度条（用户要求：要能拖 ✓）*/
  function syncSeek() {
    try {
      var sk = $('rpSeek');
      if (!sk) return;
      sk.max = String(Math.max(0, msgs.length - 1));
      if (document.activeElement !== sk) sk.value = String(Math.max(0, idx));
    } catch (e) {}
  }
  function setInfo(t) {
    $('rpInfo').textContent = t;
    syncSeek();
    // siro-bridge: 把状态发给父页面（旧框里的控制栏要显示进度/按钮状态 ✓）
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'rp-state', idx: idx, total: msgs.length, playing: !!playing, info: t }, '*');
      }
    } catch (e) {}
  }
  function showMsg(html) { $('rpMsg').style.display = ''; $('rpMsg').innerHTML = html; }
  function hideMsg() { $('rpMsg').style.display = 'none'; }

  /** 把一条回放消息喂给查看器（格式：{name, hex, len, f} ✓）
      ⚠ 回放接口里 **f 是空的**（实测 f: {} ✗）→ 查看器只能靠 hex 硬解 ✗
        而回放的 hex 解析起点与实战不一致 → 解出的卡号变成"对象" ✗
        → picChain(对象) 取不到图 → 全退成 cover2 卡背 ✗
        → 表现：**场上所有格子都显示卡背**（用户实测，连有真卡的格子也是 ✓）
      修法：按 ygopro 标准布局把 f 补出来（查看器内部也是这个布局 ✓）
        byte0 = 消息 id · 1..4 = code(u32 LE) · 5 = controller · 6 = location · 7 = sequence */
  function hexU8(hex, off) {
    if (hex === undefined || hex === null) return undefined;
    var s = String(hex).replace(/[^0-9a-fA-F]/g, '');
    if (s.length < (off + 1) * 2) return undefined;
    var v = parseInt(s.substr(off * 2, 2), 16);
    return isNaN(v) ? undefined : v;
  }
  function hexU32(hex, off) {
    var b = [hexU8(hex, off), hexU8(hex, off + 1), hexU8(hex, off + 2), hexU8(hex, off + 3)];
    for (var i = 0; i < 4; i++) { if (b[i] === undefined) return undefined; }
    return ((b[0] | (b[1] << 8) | (b[2] << 16) | (b[3] << 24)) >>> 0);
  }
  /** 只有**确实**用 {code,controller,location,sequence} 布局的消息才补 ✓
      其它消息（抽卡/阶段/胜负/提示…）布局不同 ✗ 乱补会把 player/count 等字段顶掉 ✗
      → 之前实测：日志变成「Pundefined 抽卡 0 张」「阶段undefined」✗ ✓ */
  var CODE_LAYOUT_MSGS = {
    Move: 1, Set: 1, UpdateCard: 1, Summoning: 1, SpSummoning: 1, Summoned: 1,
    PosChange: 1, Chaining: 1, Chained: 1, ChainSolving: 1, ChainEnd: 1,
    Flip: 1, Equip: 1, Draw: 0
  };
  function fillFields(m) {
    var f = m.f || {};
    if (f.code !== undefined && typeof f.code !== 'object') return f;   // 已有合法字段 → 不动 ✓
    if (!CODE_LAYOUT_MSGS[m.name]) return f;                           // 不在白名单 → 原样返回（空）✓
    var o = {};
    var code = hexU32(m.hex, 1);
    if (code !== undefined && code > 0) o.code = code;
    var ctl = hexU8(m.hex, 5), loc = hexU8(m.hex, 6), seq = hexU8(m.hex, 7);
    if (ctl !== undefined) o.controller = ctl;
    if (loc !== undefined) o.location = loc;
    if (seq !== undefined) o.sequence = seq;
    return o;
  }
  /** 回放里**跳过** UpdateData 消息（用户实测定位 ✓）
      回放里 UpdateData 有 400+ 条（占一半）✗ 而它的卡号解不出来 → 全画成 cover2 卡背 ✗
      表现：**刚刷新是空场，过一会冒出一堆卡背** ✓✓
      场上的卡改由 Move / Summoning / Set / PosChange 这些**带卡号**的消息来建 ✓
      （实测：这样能出来真卡面 ✓） */
  var SKIP_MSGS = { ShuffleDeck: 1, ShuffleHand: 1 };
  /** UpdateData 的布局和 Move 不同：[id][玩家][区域]...（不是 [id][code×4][ctl][loc][seq] ✗）
      它负责**卡组/额外张数** ✓ 所以不能整条丢掉 ✗
      但也**不能**带上 cards（会把场上塞满卡 → 卡背 ✗）
      → 只补 { player, location }：数量角标会更新 ✓ 场上不会多出卡 ✓ */
  function fillUpdateData(m) {
    var o = {};
    var p = hexU8(m.hex, 1), loc = hexU8(m.hex, 2);
    if (p !== undefined && p <= 1) o.player = p;
    if (loc !== undefined) o.location = loc;
    return o;
  }
  function feed(m) {
    if (!m || !m.name) return;
    if (SKIP_MSGS[m.name]) return;                       // 只跳过洗牌类 ✓
    if (m.name === 'UpdateData') {
      try { window.__live.push({ name: 'UpdateData', hex: m.hex, len: m.len, f: fillUpdateData(m) }); window.__live.flush(); } catch (e) {}
      return;
    }
    try {
      window.__live.push({ name: m.name, hex: m.hex, len: m.len, f: fillFields(m) });
      window.__live.flush();
    } catch (e) {}
  }

  /** 从第 0 条重放到 idx（改步骤/拖动进度时用） */
  function replayTo(target) {
    if (!info) return;
    clearInterval(timer); timer = 0;
    $('replayModal').style.display = '';
    hideMsg();
    window.__live.reset({ roomName: info.roomName, players: info.players || [] });
    for (var i = 0; i <= target && i < msgs.length; i++) feed(msgs[i]);
    idx = Math.min(target, msgs.length - 1);
    setInfo((idx + 1) + ' / ' + msgs.length + (playing ? ' · 播放中' : ' · 已暂停'));
  }

  function step(n) {
    if (!msgs.length) return;
    var t = Math.max(-1, Math.min(msgs.length - 1, idx + n));
    if (t <= idx) { replayTo(t); return; }
    // 前进：直接喂，动画更连贯 ✓
    for (var i = idx + 1; i <= t; i++) feed(msgs[i]);
    idx = t;
    setInfo((idx + 1) + ' / ' + msgs.length + (playing ? ' · 播放中' : ' · 已暂停'));
  }

  function play() {
    if (!msgs.length) return;
    if (playing) { playing = false; clearInterval(timer); timer = 0; $('rpPlay').textContent = '▶ 播放'; setInfo((idx + 1) + ' / ' + msgs.length + ' · 已暂停'); return; }
    playing = true; $('rpPlay').textContent = '⏸ 暂停';
    if (idx >= msgs.length - 1) replayTo(-1);
    timer = setInterval(function () {
      if (idx >= msgs.length - 1) { playing = false; clearInterval(timer); timer = 0; $('rpPlay').textContent = '▶ 播放'; setInfo('播放完毕（' + msgs.length + ' 条）· 点「‹ 上一步」可回看'); return; }
      step(1);
    }, Math.max(120, 420 / speed));
  }

  function load(id) {
    id = String(id || '').trim().replace(/^[Rr#]+/, '');
    if (!id) { showMsg('请输入回放 R#（例如 R123，或直接输数字）'); return; }
    showMsg('正在载入回放 ' + id + ' …');
    fetch('/api/forum/replay/' + encodeURIComponent(id) + '?t=' + Date.now())
      .then(function (r) { return r.json(); })
      .then(function (d) {
        // siro-preload-pics —— 老机制：**先把这局涉及的卡图全部预加载进缓存 ✓ 再开始播放** ✓
        //   （否则卡图一张张慢慢加载，观感很烂 ✗ 用户明确要求这个机制 ✓）
        if (d && d.messages && d.messages.length) {
          var _codes = {}, _arr = [];
          d.messages.forEach(function (mm) {
            var cc = (mm.f && mm.f.code) || 0;
            if (cc && !_codes[cc]) { _codes[cc] = 1; _arr.push(cc); }
          });
          if (_arr.length) {
            showMsg('正在预加载卡图 0 / ' + _arr.length + ' …<br><span style="font-size:12px;color:#9b97a1">加载完会自动开始播放 ✓</span>');
            var _done = 0, _total = _arr.length, _tick = setInterval(function () {
              var pct = Math.round(_done * 100 / _total);
              showMsg('正在预加载卡图 ' + _done + ' / ' + _total + ' （' + pct + '%）…<br>'
                + '<span style="font-size:12px;color:#9b97a1">加载完会自动开始播放 ✓</span>');
            }, 200);
            var _finish = function () {
              clearInterval(_tick);
              showMsg('正在预加载卡图 ' + _total + ' / ' + _total + ' （100%）…');
              window._siroPreloaded = true;
            };
            _arr.forEach(function (code) {
              var im = new Image();
              im.onload = im.onerror = function () {
                _done++;
                if (_done >= _total) _finish();
              };
              im.src = 'https://api.ygopro3.cn/pics/siro/' + code + '.jpg';
            });
          }
        }
        if (!d || !d.messages || !d.messages.length) { showMsg('这个回放不存在或没有消息记录 ✗<br><span style="font-size:12px;color:#9b97a1">R# 请从对局记录里复制</span>'); return; }
        info = d; msgs = d.messages;
        try { window.__live.loadCards && window.__live.loadCards(); } catch (e) {}
        var _waitPre = 0;
        var _startPlay = function () {
          replayTo(-1);   // 先建场地（reset 后把第 0 条 Start 喂进去）
          setInfo(d.roomName + ' · ' + msgs.length + ' 条 · 点「▶ 播放」');
          try { if (window.parent && window.parent !== window) window.parent.postMessage({ type: 'rp-ready' }, '*'); } catch (e) {}
          $('replayModal').style.display = '';
          hideMsg();
          // 自动开播 ✓（用户进来就是想看 ✓）
          playing = false; $('rpPlay').textContent = '▶ 播放';
          play();
        };
        (function _poll() {
          if (window._siroPreloaded || _waitPre++ > 40) { _startPlay(); return; }   // 最多等 8 秒 ✓
          setTimeout(_poll, 200);
        })();
      })
      .catch(function (e) { showMsg('载入失败：' + e.message); });
  }

  $('rpLoad').onclick = function () { load($('rpInput').value); };
  $('rpInput').onkeydown = function (e) { if (e.key === 'Enter') load($('rpInput').value); };
  $('rpPlay').onclick = play;
  $('rpPrev').onclick = function () { if (playing) play(); step(-1); };
  $('rpNext').onclick = function () { if (playing) play(); step(1); };
  (function () {
    var sk = $('rpSeek');
    if (!sk) return;
    sk.oninput = function () { setInfo((Number(sk.value) + 1) + ' / ' + msgs.length + ' · 拖动中…'); };
    sk.onchange = function () {
      if (!msgs.length) return;
      var target = Number(sk.value);
      if (playing) { playing = false; clearInterval(timer); timer = 0; $('rpPlay').textContent = '▶ 播放'; }
      replayTo(target);          // 从头重放到目标（保证盘面正确 ✓）
    };
  })();
  $('rpFast').onclick = function () {
    speed = speed === 1 ? 2 : (speed === 2 ? 4 : 1);
    $('rpFast').textContent = '加速 ' + speed + '×';
    if (playing) { playing = false; play(); }
  };

  // embed=1：被旧回放弹窗用 iframe 嵌进来 → 隐藏自己的顶栏 ✓
  try { if (new URLSearchParams(location.search).get('embed') === '1') document.body.classList.add('rp-embed'); } catch (e) {}
  // siro-bridge: 监听父页面（旧框控制栏）的指令 ✓
  try {
    window.addEventListener('message', function (ev) {
      var d = ev.data || {};
      if (d.type !== 'rp-cmd') return;
      try {
        if (d.cmd === 'play') { play(); }
        else if (d.cmd === 'prev') { if (playing) play(); step(-1); }
        else if (d.cmd === 'next') { if (playing) play(); step(1); }
        else if (d.cmd === 'speed') { while (speed !== (d.value || 1)) { $('rpFast').click(); } }
        else if (d.cmd === 'seek') {
          if (playing) { playing = false; clearInterval(timer); timer = 0; $('rpPlay').textContent = '▶ 播放'; }
          replayTo(Math.max(0, Math.min(msgs.length - 1, d.value | 0)));
        }
      } catch (e) {}
    });
  } catch (e) {}

  // URL 参数：?r=R123 直接载入 ✓
  try {
    var q = new URLSearchParams(location.search);
    var r = q.get('r') || q.get('id') || '';
    if (r) { $('rpInput').value = r; setTimeout(function () { load(r); }, 800); }
  } catch (e) {}
})();

/* ═══════════ 卡片效果栏 + 查看列表（用户要求：回放里也要有 ✓）═══════════
   数据来源：
     · 卡名/文本：站点的 /api/cards（{id:{name,…}}）+ /api/cardtext（{id:{d:效果,s:系列,…}}）
     · 区域里的卡：查看器已经暴露的 __live.cardsAt(视角座位, 区域) ✓（实时/回放同一份模型 ✓）
   交互：
     · 悬停/点击场上的卡 → 左侧信息栏显示 卡名 / 类型攻守 / 效果文本 ✓
     · 点牌堆（卡组/额外/墓地/除外）→ 弹列表，列出该区域所有卡 ✓，点某项也显示详情 ✓ */
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  var cards = null, texts = null;

  var LOC = { DECK: 1, HAND: 2, MZONE: 4, SZONE: 8, GRAVE: 16, REMOVED: 32, EXTRA: 64 };
  var PILE_LOC = { deck: LOC.DECK, extra: LOC.EXTRA, grave: LOC.GRAVE, removed: LOC.REMOVED };

  function loadCardsDB() {
    if (cards) return Promise.resolve();
    return Promise.all([
      fetch('/api/cards?t=' + Date.now()).then(function (r) { return r.json(); }).catch(function () { return {}; }),
      fetch('/api/cardtext?t=' + Date.now()).then(function (r) { return r.json(); }).catch(function () { return {}; }),
    ]).then(function (a) { cards = a[0] || {}; texts = a[1] || {}; });
  }
  function nameOf(code) {
    // ★ 优先用查看器的卡名 —— 它内部有完整卡表（含 DIY/先行 ✓），/api/cards 只有 OCG 卡 ✗
    try {
      if (window.__live && window.__live.cardName) {
        var n = window.__live.cardName(code);
        if (n && String(n).indexOf('#') !== 0) return n;
      }
    } catch (e) {}
    var c = cards && (cards[code] || cards[String(code)]);
    return (c && (c.name || c.cn_name)) || ('#' + code);
  }
  function textOf(code) {
    var t = texts && (texts[code] || texts[String(code)]);
    return t || null;
  }

  /** 卡片效果栏（左侧常驻） */
  function showInfo(code) {
    var box = $('rpCardInfo');
    if (!box) return;
    if (!code) { box.innerHTML = '<div class="rp-ci-empty">把鼠标移到场上的卡上（或点牌堆里的卡）查看详情</div>'; return; }
    box.innerHTML = '<div class="rp-ci-img"><img src="https://api.ygopro3.cn/pics/siro/' + code + '.jpg"'
      + ' onerror="this.onerror=null;this.src=\'https://cdn.233.momobako.com/ygopro/pics/' + code + '.jpg\'"></div>'
      + '<div class="rp-ci-main">'
      + '<div class="rp-ci-name">' + escapeHtml(nameOf(code)) + ' <span class="rp-ci-code">[' + code + ']</span></div>'
      + '<div class="rp-ci-type">' + escapeHtml(typeLineOf(code)) + '</div>'
      + '<div class="rp-ci-text">' + escapeHtml(descOf(code)) + '</div>'
      + '</div>';
  }
  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; });
  }
  function typeLineOf(code) {
    var t = textOf(code);
    var c = cards && (cards[code] || cards[String(code)]);
    var parts = [];
    // ⚠ t.t 是位掩码（数字）✗ 直接显示会很怪（实测出现 "33" ✗）→ 不显示它 ✓
    if (c && c.level) parts.push('★' + c.level);
    if (c && c.race) parts.push('种族 ' + c.race);
    if (c && c.atk !== undefined) parts.push('ATK ' + c.atk + ' / DEF ' + (c.def === undefined ? '?' : c.def));
    if (t && t.s) { var sets = setNamesOf(t.s); if (sets.length) parts.push('系列：' + sets.join('、')); }
    return parts.join('　·　') || '（无基础信息）';
  }
  function setNamesOf(mask) {
    // 系列位掩码 → 名字：站点 /api/strings 里有；拿不到就不显示 ✓
    var out = [];
    try {
      var st = window.__rpStrings;
      if (!st || !st.setcode) return out;
      (st.setcode || []).forEach(function (e) { if (mask & e.bits) out.push(e.name); });
    } catch (e) {}
    return out;
  }
  function descOf(code) {
    var t = textOf(code);
    if (!t) return '（正在加载效果文本…）';
    return String(t.d || '（无效果文本）').replace(/\r/g, '');
  }

  /** 查看列表：点牌堆弹列表（卡组/额外/墓地/除外/手牌） */
  function showList(pileKey) {
    var parts = String(pileKey).split(':');
    var kind = parts[0], seat = Number(parts[1] || 0);
    var loc = PILE_LOC[kind];
    if (!loc && kind !== 'hand') { showInfo(0); return; }
    var arr = [];
    try {
      var cardsAt = (window.__live && window.__live.cardsAt) ? window.__live.cardsAt(seat, loc) : [];
      arr = cardsAt || [];
    } catch (e) { arr = []; }
    var box = $('rpList');
    if (!box) return;
    if (!arr.length) { showInfo(0); box.innerHTML = '<div class="rp-li-empty">这个区域现在是空的</div>'; return; }
    var title = { deck: '卡组', extra: '额外卡组', grave: '墓地', removed: '除外' }[kind] || '列表';
    box.innerHTML = '<div class="rp-li-title">' + title + '（' + arr.length + ' 张）· 点一张看详情'
      + '<button id="rpListClose" title="关闭（Esc）" style="float:right;margin-top:-2px;width:24px;height:24px;'
      + 'border-radius:6px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);'
      + 'color:#cfc8bd;cursor:pointer;font-size:13px;line-height:1">✕</button></div>'
      + '<div class="rp-li-grid">' + arr.map(function (c) {
        var code = c.code || 0;
        return '<div class="rp-li-item" data-code="' + code + '">'
          + '<img loading="lazy" src="https://api.ygopro3.cn/pics/siro/' + code + '.jpg"'
          + ' onerror="this.onerror=null;this.src=\'https://cdn.233.momobako.com/ygopro/pics/' + code + '.jpg\'">'
          + '<span>' + escapeHtml(nameOf(code)) + '</span></div>';
      }).join('') + '</div>';
    box.style.display = 'block';   // ★ 必须显式设置（CSS 默认是 none ✗）
    showInfo(arr[0] ? (arr[0].code || 0) : 0);
  }

  /* siro-fix-align-close: 关闭查看列表的三种方式 ✓（✕ / 点外面 / Esc） */
  function closeList() {
    try {
      var L = $('rpList');
      if (L) { L.style.display = 'none'; L.innerHTML = ''; }
    } catch (e) {}
  }
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    if (t.closest('#rpListClose')) { closeList(); return; }
    if (t.closest('[data-pile]')) return;              // 点牌堆由下面的逻辑处理 ✓
    if (t.closest('.rp-li-item')) return;               // 点列表项看详情 ✓
    if (!t.closest('#rpList')) closeList();             // **点列表外面 → 关闭** ✓
  }, true);
  document.addEventListener('keydown', function (ev) {
    if (ev.key === 'Escape') closeList();
  });

  // 事件委托：悬停看卡、点牌堆看列表、点列表项看详情
  document.addEventListener('mouseover', function (ev) {
    var im = ev.target && ev.target.closest ? ev.target.closest('#replayField img') : null;
    if (!im) return;
    var m = String(im.src || '').match(/(\d{1,9})\.jpg/);
    if (m) showInfo(Number(m[1]));
  }, true);
  document.addEventListener('click', function (ev) {
    var t = ev.target;
    if (!t || !t.closest) return;
    var pile = t.closest('[data-pile]');
    if (pile) { showList(pile.getAttribute('data-pile')); return; }
    var item = t.closest('.rp-li-item');
    if (item) { showInfo(Number(item.getAttribute('data-code') || 0)); return; }
    var im2 = t.closest('#replayField img');
    if (im2) { var m2 = String(im2.src || '').match(/(\d{1,9})\.jpg/); if (m2) showInfo(Number(m2[1])); }
  }, true);

  loadCardsDB().then(function () { showInfo(0); });
})();
</script>
