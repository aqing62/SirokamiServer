<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>决斗大厅 · 白神服</title>
<!-- 大厅页：照 MDPro3 房间面板的排版，但**只有两个模式**（天梯 M# / 比赛 D#）
     选卡组 = 打开本地文件夹挑 .ydk 上传存到账号 → 开始匹配时自动注入给客户端 -->
<style>
:root { --gold:#D4AF37; --gold2:#FFD700; --line:rgba(212,175,55,.3); --panel:rgba(20,18,26,.9); }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color:#e8e2d8; background: radial-gradient(1200px 600px at 50% 0%, #1a1420 0%, #0d0b12 60%, #08070b 100%); }
a { color:#9ec4f0; text-decoration:none; }
.wrap { max-width: 920px; margin: 0 auto; padding: 22px 16px 60px; }
.top { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.avatar { flex:0 0 84px; width:84px; height:84px; border-radius:12px; overflow:hidden;
  border:2px solid var(--gold); background:linear-gradient(135deg,#1b2430,#0e141c 60%,#1b2430);
  display:flex; align-items:center; justify-content:center; }
.avatar img { width:100%; height:100%; object-fit:cover; display:block; }
.avatar span { font-size:1.6rem; opacity:.55; }
.title { font-size:1.25rem; font-weight:800; letter-spacing:1px;
  background:linear-gradient(135deg,var(--gold),var(--gold2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.who { font-size:.82rem; color:#9a9aa4; margin-top:4px; }
.card { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:18px 20px; margin-bottom:16px; }
.row { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.row:last-child { margin-bottom:0; }
.row .k { flex:0 0 62px; font-size:.86rem; color:#a9a9b3; }
.modes { display:flex; gap:10px; flex-wrap:wrap; }
.mode { padding:9px 18px; border-radius:8px; border:1px solid rgba(255,255,255,.16); background:transparent;
  color:#cfc8bd; font-size:.92rem; cursor:pointer; font-weight:600; }
.mode.on { background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1a1a2e; border-color:transparent; }
.mode:disabled { opacity:.45; cursor:not-allowed; }
select, input[type=text] { padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05); color:#f2eee6; font-size:.9rem; min-width:180px; }
select:focus, input:focus { outline:none; border-color:rgba(212,175,55,.6); }
.btn { padding:9px 16px; border-radius:8px; border:none; cursor:pointer; font-size:.9rem; font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1a1a2e; }
.btn.ghost { background:transparent; border:1px solid rgba(255,255,255,.18); color:#cfc8bd; font-weight:500; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.start { width:100%; margin-top:6px; padding:14px; font-size:1.05rem; letter-spacing:2px; }
.hint { font-size:.78rem; color:#7d7d86; }
.deck-line { display:flex; align-items:baseline; justify-content:space-between; gap:12px; padding:12px 14px;
  border:1px solid rgba(255,255,255,.1); border-radius:8px; margin-top:4px; }
.deck-line b { color:var(--gold2); font-weight:700; }
.msg { min-height:18px; font-size:.8rem; color:#ff9aa8; margin-top:10px; }
.msg.ok { color:#8ee6a8; }
.stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
.stat div { border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:10px 12px; font-size:.8rem; color:#9a9aa4; }
.stat b { display:block; font-size:1.05rem; color:#ddd6cd; margin-top:4px; font-weight:700; }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="avatar" id="avatarBox"><span>⚔️</span></div>
    <div>
      <div class="title">决斗大厅</div>
      <div class="who" id="who">…</div>
    </div>
  </div>

  <div class="card">
    <div class="row"><span class="k">环境</span><span class="hint">白神服 · Genesys-Ext（服务器默认禁限卡表）</span></div>
    <div class="row"><span class="k">模式</span>
      <div class="modes">
        <button class="mode on" id="mLadder">竞技匹配（天梯）</button>
        <button class="mode" id="mTour" disabled title="开赛后公布对阵即可用">比赛模式</button>
      </div>
    </div>
    <div class="row"><span class="k">卡组</span>
      <select id="deckSel"><option value="">（还没有卡组，先上传一个）</option></select>
      <button class="btn ghost" id="btnUpload">上传 / 编辑卡组(.ydk)</button>
      <input type="file" id="ydkFile" accept=".ydk,text/plain" style="display:none">
    </div>
    <div class="deck-line">
      <span class="hint">当前使用卡组</span>
      <b id="deckNow">读取中…</b>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="card">
    <button class="btn start" id="btnStart">开始匹配</button>
    <div class="hint" style="margin-top:10px;text-align:center">
      点开始匹配 → 自动进房 → 自动准备 → 人齐自动开局（进去后不用再操作）
    </div>
  </div>

  <div class="card">
    <div class="hint" style="margin-bottom:10px">我的天梯</div>
    <div class="stat" id="stat"><div>加载中…</div></div>
  </div>

  <div class="hint" style="text-align:center">
    <a href="index.html">← 返回官网首页</a> ·
    <a href="duel.html">直接进对局页</a>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  function msg(t, ok) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (ok ? ' ok' : ''); }
  var mode = 'ladder';

  $('mLadder').onclick = function () { mode = 'ladder'; syncModes(); };
  $('mTour').onclick = function () { if (!$('mTour').disabled) { mode = 'tour'; syncModes(); } };
  function syncModes() {
    $('mLadder').className = 'mode' + (mode === 'ladder' ? ' on' : '');
    $('mTour').className = 'mode' + (mode === 'tour' ? ' on' : '');
    $('btnStart').textContent = mode === 'ladder' ? '开始匹配' : '进入比赛房间';
  }

  // ── 身份 ──
  fetch('/api/duel/whoami?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.loggedIn) {
      $('who').innerHTML = '<a href="duel.html">未登录，点这里登录/注册 →</a>';
      $('btnStart').disabled = true;
      msg('登录后才能开始匹配');
      return;
    }
    $('who').textContent = '已登录：' + (d.name || d.account);
    // 头像：用官网已有的 /api/forum/avatar/<账号>（和论坛/卡组社区同一个头像）
    var av = document.createElement('img');
    av.alt = '头像';
    av.onerror = function () { av.remove(); };            // 没头像就保持 ⚔️ 占位
    av.src = '/api/forum/avatar/' + encodeURIComponent(d.account || d.name) + '?v=' + Date.now();
    $('avatarBox').appendChild(av);
    loadDecks(); loadLadder();
  }).catch(function () { $('who').textContent = '读取登录状态失败'; });

  // ── 卡组库 ──
  function loadDecks() {
    fetch('/api/duel/decks?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var sel = $('deckSel');
      sel.innerHTML = '';
      var names = (j && j.names) || [];
      if (!names.length) {
        var o = document.createElement('option');
        o.value = ''; o.textContent = '（还没有卡组，点右边上传一个）';
        sel.appendChild(o);
        return;
      }
      names.forEach(function (n) {
        var o = document.createElement('option');
        o.value = n; o.textContent = n.replace(/\.ydk$/i, '');
        if (j.active && n === j.active + '.ydk') o.selected = true;
        sel.appendChild(o);
      });
    });
    fetch('/api/duel/deck?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.name) {
        $('deckNow').textContent = j.name + '（主 ' + (j.main || []).length + ' / 额外 ' + (j.extra || []).length +
          ' / 副 ' + (j.side || []).length + '）';
      } else {
        $('deckNow').textContent = '未设置';
      }
    });
  }

  $('deckSel').onchange = function () {
    var v = this.value;
    if (!v) return;
    fetch('/api/duel/decks/active', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: v.replace(/\.ydk$/i, '') }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { msg('已切换当前使用卡组：' + j.active, true); loadDecks(); }
        else msg((j && j.error) || '切换失败');
      });
  };

  // ── 上传 .ydk（打开本地文件夹自选）──
  $('btnUpload').onclick = function () { $('ydkFile').click(); };
  $('ydkFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var def = f.name.replace(/\.ydk$/i, '');
    var name = prompt('给这套卡组起个名字（存到你的账号里）：', def);
    if (!name) { this.value = ''; return; }
    var fr = new FileReader();
    fr.onload = function () {
      msg('上传中…');
      fetch('/api/duel/decks/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, ydk: String(fr.result) }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) { msg('已保存卡组「' + j.name + '」（主 ' + j.main + ' / 额外 ' + j.extra + ' / 副 ' + j.side + '）', true); loadDecks(); }
          else msg((j && j.error) || '上传失败');
        }).catch(function (e) { msg('上传失败：' + e.message); });
    };
    fr.readAsText(f, 'utf-8');
    this.value = '';
  };

  // ── 天梯数据 ──
  function loadLadder() {
    fetch('/api/forum/profile/ladder?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var box = $('stat');
      if (!j || j.error) { box.innerHTML = '<div>暂无天梯数据</div>'; return; }
      var d = (j.data && j.data[0]) || j.data || j;
      function cell(k, v) { return '<div>' + k + '<b>' + (v === undefined || v === null ? '-' : v) + '</b></div>'; }
      box.innerHTML =
        cell('天梯积分', d.rating) + cell('排名', d.rank) + cell('段位', d.tier || d.tierName) +
        cell('战绩', (d.wins === undefined ? '-' : d.wins + ' 胜 ' + (d.losses || 0) + ' 负'));
    }).catch(function () { $('stat').innerHTML = '<div>暂无天梯数据</div>'; });
  }

  // ── 开始匹配 ──
  $('btnStart').onclick = function () {
    if (mode === 'ladder') {
      location.href = 'duel.html?auto=1';
      return;
    }
    location.href = 'duel.html?auto=1&mode=tour';
  };
  // 支持 lobby.html?mode=tour 直接进比赛模式
  try {
    var q = new URLSearchParams(location.search);
    if (q.get('mode') === 'tour') { mode = 'tour'; syncModes(); }
  } catch (e) {}
  syncModes();
})();
</script>
</body>
</html>
