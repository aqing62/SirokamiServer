<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>决斗大厅 · 白神服</title>
<!-- 复用官网「卡组查看器」的卡牌悬停提示（鼠标移上去显示卡名/效果文本），不做点击弹窗 -->
<link rel="stylesheet" href="css/deck-viewer.css?v=20260903a">
<script src="js/deck-viewer.js?v=20260903b" defer></script>
<!-- 大厅页：照 MDPro3 房间面板的排版，但**只有两个模式**（天梯 M# / 比赛 D#）
     选卡组 = 打开本地文件夹挑 .ydk 上传存到账号 → 开始匹配时自动注入给客户端 -->
<style>
/* 配色对齐「新引导」next.css：红为主、金为辅、背景 #0a0a0c */
:root { --gold:#D4AF37; --gold2:#F0E68C; --line:rgba(216,30,68,.32); --panel:rgba(20,17,22,.86);
  --nx-red:#D81E44; --nx-red-soft:rgba(216,30,68,.55); --nx-bg:#0a0a0c; --nx-bg2:#141116;
  --nx-text:#ece9e4; --nx-dim:#9b97a1; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color:var(--nx-text); background:var(--nx-bg); }
/* ── 背景：新引导那套漂浮光球 + 漂移红网格（只动 transform，可合成） ── */
.nx-bg { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.nx-orb { position:absolute; border-radius:50%; opacity:.5; will-change:transform;
  animation:orbFloat 18s ease-in-out infinite; }
.nx-orb-1 { width:46vmax; height:46vmax; left:-14vmax; top:-16vmax; background:radial-gradient(circle, rgba(216,30,68,.55), transparent 68%); }
.nx-orb-2 { width:38vmax; height:38vmax; right:-12vmax; bottom:-14vmax; background:radial-gradient(circle, rgba(212,175,55,.34), transparent 70%); animation-delay:-6s; }
.nx-orb-3 { width:30vmax; height:30vmax; left:42%; top:46%; background:radial-gradient(circle, rgba(216,30,68,.28), transparent 70%); animation-delay:-11s; }
@keyframes orbFloat {
  0%,100% { transform:translate3d(0,0,0) scale(1); }
  33%     { transform:translate3d(4vmax,-3vmax,0) scale(1.08); }
  66%     { transform:translate3d(-3vmax,3vmax,0) scale(.95); }
}
.nx-grid { position:absolute; inset:-64px; opacity:.16; will-change:transform;
  background-image:linear-gradient(rgba(216,30,68,.35) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(216,30,68,.35) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  animation:gridDrift 26s linear infinite; }
@keyframes gridDrift { to { transform:translate3d(64px,64px,0); } }
.wrap { position:relative; z-index:1; }
a { color:#9ec4f0; text-decoration:none; }
.wrap { max-width: 920px; margin: 0 auto; padding: 22px 16px 60px; }
.top { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.top-mid { flex:1 1 auto; min-width:0; }
/* 圆形按钮：红圈 + 透明底 + 黄字；比头像(84px)略大，与头像中心对齐。
   用 .btn.start-top 提权，否则被后面的 .btn（金色实心）覆盖 */
.btn.start-top { flex:0 0 auto; align-self:center;                /* ← 与头像中心对齐 */
  width:92px; height:92px; border-radius:50%;                      /* ← 圆形，比头像略大 */
  padding:0; background:transparent;                               /* ← 透明底 */
  border:2px solid #ff3b3b;                                        /* ← 红线 */
  color:#FFD700; font-weight:800; font-size:.9rem; letter-spacing:1px; line-height:1.15;
  text-align:center; display:flex; align-items:center; justify-content:center;
  box-shadow:none; text-shadow:none; transition:background .15s ease, border-color .15s ease; }
.btn.start-top:hover { background:rgba(255,59,59,.10); border-color:#ff6b6b; }
.btn.start-top:active { background:rgba(255,59,59,.18); }
.btn.start-top:disabled { opacity:.4; }
/* 右上角的天梯战绩小条（积分/段位/胜场/胜率），放在「开始匹配」左边、与头像同一行 */
.mine { flex:0 0 auto; align-self:center; display:grid; grid-template-columns:repeat(2,auto); gap:4px 22px;
  padding-right:6px; }
.mine span { display:flex; align-items:baseline; gap:6px; font-size:.78rem; color:#8d8d96; white-space:nowrap; }
.mine i { font-style:normal; }
.mine b { color:#FFD700; font-weight:800; font-size:.98rem; font-variant-numeric:tabular-nums; }
.avatar { flex:0 0 84px; width:84px; height:84px; border-radius:12px; overflow:hidden; position:relative;
  border:2px solid var(--gold); background:linear-gradient(135deg,#1b2430,#0e141c 60%,#1b2430);
  display:flex; align-items:center; justify-content:center; }
/* 图片绝对定位盖满整个框 —— 否则 flex 会把「占位 ⚔️」和真头像并排摆成左右两半 */
.avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; }
.avatar span { font-size:1.6rem; opacity:.55; }
.title { font-size:1.25rem; font-weight:800; letter-spacing:1px;
  background:linear-gradient(135deg,var(--nx-gold-light, #F0E68C), var(--gold), #fff); -webkit-background-clip:text; background-clip:text; color:transparent; }
.who { font-size:.82rem; color:#9a9aa4; margin-top:4px; }
.card { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:18px 20px; margin-bottom:16px; }
.row { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.row:last-child { margin-bottom:0; }
.row .k { flex:0 0 62px; font-size:.86rem; color:#a9a9b3; }
.modes { display:flex; gap:10px; flex-wrap:wrap; }
.mode { padding:9px 18px; border-radius:8px; border:1px solid rgba(255,255,255,.16); background:transparent;
  color:#cfc8bd; font-size:.92rem; cursor:pointer; font-weight:600; }
.mode.on { background:linear-gradient(135deg,var(--nx-red),#a3122f); color:#fff; border-color:rgba(216,30,68,.9);
  box-shadow:0 0 14px rgba(216,30,68,.45); }
.mode:disabled { opacity:.45; cursor:not-allowed; }
select, input[type=text] { padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.14);
  background:rgba(255,255,255,.05); color:#f2eee6; font-size:.9rem; min-width:180px; }
select:focus, input:focus { outline:none; border-color:rgba(212,175,55,.6); }
.btn { padding:9px 16px; border-radius:8px; border:none; cursor:pointer; font-size:.9rem; font-weight:700;
  background:linear-gradient(135deg,var(--gold),var(--gold2)); color:#1a1a2e; }
.btn.ghost { background:transparent; border:1px solid rgba(255,255,255,.18); color:#cfc8bd; font-weight:500; }
.btn:disabled { opacity:.5; cursor:not-allowed; }
.start { width:100%; margin-top:6px; padding:14px; font-size:1.05rem; letter-spacing:2px; }
.hint { font-size:.78rem; color:#7d7d86; }
/* 当前使用卡组：直接把卡图画在框里（一行 10 张，和官网卡组界面一致） */
.deck-box { border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:12px 14px; margin-top:4px; }
.deck-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }
.deck-head b { color:var(--gold2); font-weight:700; }
.deck-sec { font-size:.78rem; color:#9a9aa4; margin:10px 0 6px; }
.deck-sec:first-child { margin-top:0; }
.deck-cards { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:5px; }
/* ── 卡图容器 + 禁限分数角标 ── 以下数值与老站 css/player-ranking.css 完全一致（老站同款） */
.deck-cards .card-img-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 42/61;
  align-self: start;
  overflow: hidden;
  border-radius: 2px;
}
.deck-cards .card-img-wrapper .deck-card-img {
  width: 100%;
  height: 100%;
  aspect-ratio: auto;
  display: block;
  background: #101720;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.deck-cards .card-score-badge {
  position: absolute;
  bottom: 2px;
  left: 2px;
  min-width: 18px;
  height: 17px;
  line-height: 15px;
  text-align: center;
  background: rgba(0, 0, 0, 0.85);
  color: #FFD700;
  font-size: 0.65rem;
  font-weight: 700;
  border: 1px solid var(--nx-red, #D81E44);
  border-radius: 2px;
  padding: 0 4px;
  pointer-events: none;
  z-index: 2;
}
.deck-cards .card-score-badge.forbidden {
  font-size: 0.55rem;
  min-width: 17px;
  line-height: 15px;
}
.deck-cards .card-diy-badge {
  position: absolute;
  bottom: 2px;
  right: 2px;
  height: 14px;
  line-height: 12px;
  text-align: center;
  background: rgba(0, 0, 0, 0.85);
  color: #FFD700;
  font-size: 0.5rem;
  font-weight: 700;
  border: 1px solid var(--nx-red, #D81E44);
  border-radius: 2px;
  padding: 0 3px;
  pointer-events: none;
  z-index: 2;
}
.deck-cards .card-img-wrapper:hover .deck-card-img {
  box-shadow: 0 12px 20px -6px rgba(0,0,0,.8), 0 0 10px rgba(255,215,0,.25);
  outline: 1px solid var(--gold2); }
.deck-empty { font-size:.8rem; color:#7d7d86; }
.msg { min-height:18px; font-size:.8rem; color:#ff9aa8; margin-top:10px; }
.msg.ok { color:#8ee6a8; }
.stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
.stat div { border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:10px 12px; font-size:.8rem; color:#9a9aa4; }
.stat b { display:block; font-size:1.05rem; color:#ddd6cd; margin-top:4px; font-weight:700; }
/* 紧凑行：模式/卡组横排，去掉大片空白 */
.row-inline { gap:10px; margin-bottom:12px; }
.row-inline .k { flex:0 0 44px; }
.row-inline .k-gap { margin-left:22px; }
.row-inline select { min-width:150px; max-width:230px; flex:0 1 auto; }
.row-inline .mode { padding:8px 16px; font-size:.88rem; }

/* ── 手机竖屏：整体缩到 75%（用户要求）+ 顶部改纵向，避免被挤成"一列竖字" ── */
@media (orientation: portrait), (max-width: 780px) {
  html { zoom: .75; }                     /* 整体 75%（Chrome/Edge/手机浏览器都支持）*/
  .wrap { max-width: none; padding-left: 6px; padding-right: 6px; }
  .top { flex-wrap: wrap; row-gap: 8px; }
  .top-mid { flex: 1 1 100%; min-width: 0; order: 2; }
  .mine { flex: 1 1 100%; order: 3; justify-content: flex-start; }
  .btn.start-top { order: 1; margin-left: auto; }
  .title { font-size: 1.15rem; }
  .who, .hint { white-space: normal; line-height: 1.5; }
  .row-inline { flex-wrap: wrap; row-gap: 8px; }
  .deck-cards { grid-template-columns: repeat(10, minmax(0, 1fr)); }
}

  /* 卡组下拉：深色主题 —— 原生 <select> 默认是白底 ✗ 在深色 UI 上非常扎眼（用户反馈"全发白"）
     原生 option 能生效的属性有限，background/color 是有效的 ✓ 两边都写上 */
  #deckSel {
    background: #171a21 !important;
    color: #ece9e4 !important;
    border: 1px solid rgba(216,30,68,.45) !important;
    border-radius: 8px !important;
    padding: 8px 34px 8px 12px !important;
    font: 600 14px/1.3 "Microsoft YaHei","PingFang SC",system-ui,sans-serif !important;
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #d8a63c 50%),
                      linear-gradient(135deg, #d8a63c 50%, transparent 50%) !important;
    background-position: calc(100% - 18px) 52%, calc(100% - 12px) 52% !important;
    background-size: 6px 6px, 6px 6px !important;
    background-repeat: no-repeat !important;
    cursor: pointer;
    max-width: 240px;
  }
  #deckSel:hover { border-color: rgba(216,30,68,.8) !important; }
  #deckSel:focus { outline: none !important; box-shadow: 0 0 0 2px rgba(212,175,55,.35) !important; }
  #deckSel option {
    background: #171a21 !important;      /* 下拉展开后每一项的底色 ✓ */
    color: #ece9e4 !important;
  }
  #deckSel option:checked, #deckSel option:checked:hover {
    background: #2a3140 !important; color: #FFD700 !important;
  }
</style>
</head>
<body>
<div class="nx-bg">
  <span class="nx-orb nx-orb-1"></span>
  <span class="nx-orb nx-orb-2"></span>
  <span class="nx-orb nx-orb-3"></span>
  <div class="nx-grid"></div>
</div>
<div class="wrap">
  <div class="top">
    <div class="avatar" id="avatarBox"><span>⚔️</span></div>
    <div class="top-mid">
      <div class="title" id="meName">决斗大厅</div>
      <div class="who" id="who">…</div>
      <div class="hint" id="startHint" style="display:none"></div>
    </div>
    <div class="mine" id="mine">
      <span><i>积分</i><b id="mRating">-</b></span>
      <span><i>段位</i><b id="mTier">-</b></span>
      <span><i>胜场</i><b id="mWins">-</b></span>
      <span><i>胜率</i><b id="mRate">-</b></span>
    </div>
    <button class="btn start-top" id="btnStart">开始匹配</button>
  </div>

  <div class="card">
    <!-- 只有天梯一种形态（比赛模式已按用户决定去掉）→ 不再需要模式选择，卡组行独自成行 -->
    <div class="row row-inline">
      <span class="k">卡组</span>
      <select id="deckSel"><option value="">（还没有卡组，点右边新建或上传）</option></select>
      <button class="btn ghost" id="btnUpload" title="从电脑里选一个 .ydk 文件存到账号">上传</button>
      <button class="btn ghost" id="btnEdit" title="在组卡器里打开选中的卡组（改完可直接保存到账号）">编辑</button>
      <button class="btn ghost" id="btnNew" title="打开组卡器新建一套卡组（可保存到账号）">新建</button>
      <input type="file" id="ydkFile" accept=".ydk,text/plain" style="display:none">
    </div>
    <div class="deck-box">
      <div class="deck-head">
        <span class="hint">当前使用卡组</span>
        <b id="deckNow">读取中…</b>
      </div>
      <div id="deckCards"></div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="hint" style="text-align:center">
    <a href="index.html">← 返回官网首页</a> ·
    <a href="duel.html">直接进对局页</a>
  </div>
</div>

<script>
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  function msg(t, ok) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (ok ? ' ok' : ''); }
  var curDeck = null;      // 当前使用卡组（{name, main, extra, side}）


  // 从对局页被"中止匹配"退回来时带的原因（?err=）→ 红字显示出来
  try {
    var errMsg = new URLSearchParams(location.search).get('err');
    if (errMsg) {
      var m0 = $('msg');
      if (m0) { m0.className = 'msg'; m0.textContent = '⚠ ' + errMsg + ' —— 请换一套合规卡组再开始匹配'; }
    }
  } catch (e) {}

  // ── 身份 ──
  fetch('/api/duel/whoami?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.loggedIn) {
      $('who').innerHTML = '<a href="duel.html">未登录，点这里登录/注册 →</a>';
      setStartEnabled(false);
      msg('登录后才能开始匹配');
      return;
    }
    $('who').textContent = '已登录：' + (d.account || d.name);
    if (d.name) $('meName').textContent = d.name;    // 标题换成玩家显示名
    // 头像：用官网已有的 /api/forum/avatar/<账号>（和论坛/卡组社区同一个头像）
    var av = document.createElement('img');
    av.alt = '头像';
    av.onerror = function () { av.remove(); };            // 没头像就保持 ⚔️ 占位
    av.src = '/api/forum/avatar/' + encodeURIComponent(d.account || d.name) + '?v=' + Date.now();
    $('avatarBox').appendChild(av);
    setStartEnabled(false);          // 先禁用，等卡组列表回来再决定
    loadDecks(); loadMine(d);
  })
  .catch(function () { $('who').textContent = '读取登录状态失败'; });

  // ── 卡组库 ──
  function loadDecks() {
    fetch('/api/duel/decks?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var sel = $('deckSel');
      sel.innerHTML = '';
      var names = (j && j.names) || [];
      if (!names.length) {
        var o = document.createElement('option');
        o.value = ''; o.textContent = '（还没有卡组，点右边新建或上传）';
        sel.appendChild(o);
        setStartEnabled(false);            // 没卡组 → 不让开始匹配
        return;
      }
      setStartEnabled(true);
      names.forEach(function (n) {
        var o = document.createElement('option');
        o.value = n; o.textContent = n.replace(/\.ydk$/i, '');
        if (j.active && n === j.active + '.ydk') o.selected = true;
        sel.appendChild(o);
      });
    });
    fetch('/api/duel/deck?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.name) {
        curDeck = j;      // 存起来（画卡图 + 点卡开官网大窗口都用它）
        // 分数表可能还没加载完 → 等它到位再算总分 ✓（否则会算成 0 ✗）
        var _needScores = (scoreMap === null);
        var _paint = function () {
          var sum = 0, miss = 0, ban = 0;
          ['main', 'extra', 'side'].forEach(function (k) {
            (j[k] || []).forEach(function (c) {
              var e = scoreMap ? scoreMap[c] : null;
              var v = (typeof e === 'number') ? e : (e && typeof e.score === 'number' ? e.score : null);
              if (v === null || v === undefined) { miss++; return; }
              sum += v;
              if (e && (e.forbidden || e.ban)) ban++;
            });
          });
          var txt = j.name + '（主 ' + (j.main || []).length + ' / 额外 ' + (j.extra || []).length +
            ' / 副 ' + (j.side || []).length + '）';
          var el = $('deckNow');
          if (!el) return;
          el.innerHTML = '';
          el.appendChild(document.createTextNode(txt + '  ·  总分 '));
          var b = document.createElement('b');
          b.textContent = sum + '/100';
          b.style.color = (sum > 100) ? '#ff6b6b' : '#FFD700';       // 超 100 变红 ✓
          b.style.fontSize = '1.05em';
          el.appendChild(b);
          if (ban > 0) {
            var w = document.createElement('span');
            w.textContent = '  ⚠ 含 ' + ban + ' 张禁用卡';
            w.style.color = '#ff6b6b';
            el.appendChild(w);
          }
          if (miss > 0) {
            var m = document.createElement('span');
            m.textContent = '（' + miss + ' 张无分值数据）';
            m.style.color = '#9b97a1';
            m.style.fontSize = '0.9em';
            el.appendChild(m);
          }
        };
        if (_needScores) loadScores().then(_paint); else _paint();
        renderDeckCards(j);
      } else {
        curDeck = null;
        $('deckNow').textContent = '未设置';
        $('deckCards').innerHTML = '<div class="deck-empty">还没设置卡组 — 点右边的「新建」在组卡器里建一套，或「上传」一个 .ydk</div>';
      }
    });
  }

  // ── 卡图（和官网同一条兜底链：OCG → SuperPre 先行卡 → 白神服 DIY）──
  // 分值表（左下角角标用）：/api/scores → {id: {score, forbidden}}
  var scoreMap = null;
  function loadScores() {
    return fetch('/api/scores?t=' + Date.now()).then(function (r) { return r.json(); })
      .then(function (j) { scoreMap = (j && !j.error) ? j : {}; })
      .catch(function () { scoreMap = {}; });
  }
  var CARD_PIC = [
    'https://cdn.233.momobako.com/ygopro/pics/',
    'https://cdn02.moecube.com:444/ygopro-super-pre/data/pics/',
    'https://api.ygopro3.cn/pics/siro/',
  ];
  // 每张卡：包一层 .card-img-wrapper（老站同款）+ 左下角分值角标 + 右下角 DIY 角标。
  // DIY 角标由「DIY 图加载成功」时打上 —— 这是老站 deck-viewer.js 的做法，原样搬过来。
  function deckCardImg(id) {
    var wrap = document.createElement('div');
    wrap.className = 'card-img-wrapper';
    wrap.setAttribute('data-card-id', String(id));
    var sc = scoreMap && scoreMap[id];
    var badge = '';
    if (sc) badge = sc.forbidden
      ? '<div class="card-score-badge forbidden">🚫</div>'
      : '<div class="card-score-badge">' + sc.score + '</div>';
    wrap.innerHTML =
      '<img class="deck-card-img" alt="' + id + '" loading="lazy" src="' + CARD_PIC[0] + id + '.jpg"'
      + " onerror=\"this.onerror=null;this.src='" + CARD_PIC[1] + id + ".jpg';"
      + "this.onerror=function(){this.onerror=null;this.src='" + CARD_PIC[2] + id + ".jpg';"
      + "this.onload=function(){if(!this.closest('.card-img-wrapper').querySelector('.card-diy-badge')){"
      + "var b=document.createElement('div');b.className='card-diy-badge';b.textContent='DIY';"
      + "this.closest('.card-img-wrapper').appendChild(b);}};"
      + "this.onerror=function(){this.src='cover.jpg';}}\">"
      + badge;
    return wrap;
  }
  function renderDeckCards(deck) {
    if (!scoreMap) { loadScores().then(function () { renderDeckCards(deck); }); return; }
    var box = $('deckCards');
    box.innerHTML = '';
    function section(label, ids) {
      if (!ids || !ids.length) return;
      var t = document.createElement('div');
      t.className = 'deck-sec';
      t.textContent = label + '（' + ids.length + ' 张）';
      box.appendChild(t);
      var grid = document.createElement('div');
      grid.className = 'deck-cards';
      ids.forEach(function (id) { grid.appendChild(deckCardImg(id)); });
      box.appendChild(grid);
    }
    section('主卡组', deck.main || []);
    section('额外卡组', deck.extra || []);
    section('副卡组', deck.side || []);
    if (!box.children.length) box.innerHTML = '<div class="deck-empty">这套卡组是空的</div>';
    // 老站那套悬停提示：鼠标移到卡上显示卡名/效果文本
    if (window.DeckViewer && window.DeckViewer.attachCardHover) {
      window.DeckViewer.attachCardHover(box);
    }
  }


  $('deckSel').onchange = function () {
    var v = this.value;
    if (!v) return;
    fetch('/api/duel/decks/active', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: v.replace(/\.ydk$/i, '') }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { msg('已切换当前使用卡组：' + j.active, true); loadDecks(); }
        else msg((j && j.error) || '切换失败');
      });
  };

  // ── 编辑 / 新建 → 打开组卡器（组卡器里可直接保存/删除到账号 ✓）
  //    ?deck=<名字> 让组卡器载入指定卡组；?new=1 新建空卡组；?from=lobby 保存后能一键回大厅 ✓
  if ($('btnEdit')) {
    $('btnEdit').onclick = function () {
      var n = ($('deckSel') && $('deckSel').value) || '';
      if (!n) { msg('先在左边选一套卡组，再点「编辑」'); return; }
      location.href = 'index.html?builder=1&deck=' + encodeURIComponent(n.replace(/\.ydk$/i, '')) + '&from=lobby&t=' + Date.now();
    };
  }
  if ($('btnNew')) {
    $('btnNew').onclick = function () {
      location.href = 'index.html?builder=1&new=1&from=lobby&t=' + Date.now();
    };
  }

  // ── 上传 .ydk（打开本地文件夹自选）──
  $('btnUpload').onclick = function () { $('ydkFile').click(); };
  $('ydkFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var def = f.name.replace(/\.ydk$/i, '');
    var name = prompt('给这套卡组起个名字（存到你的账号里）：', def);
    if (!name) { this.value = ''; return; }
    var fr = new FileReader();
    fr.onload = function () {
      msg('上传中…');
      fetch('/api/duel/decks/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, ydk: String(fr.result) }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) { msg('已保存卡组「' + j.name + '」（主 ' + j.main + ' / 额外 ' + j.extra + ' / 副 ' + j.side + '）', true); loadDecks(); }
          else msg((j && j.error) || '上传失败');
        }).catch(function (e) { msg('上传失败：' + e.message); });
    };
    fr.readAsText(f, 'utf-8');
    this.value = '';
  };

  // ── 右上角战绩：积分/胜场/胜率来自 whoami（读 player_rating），段位来自社区资料接口 ──
  function loadMine(me) {
    var L = (me && me.ladder) || {};
    function set(id, v) { var e = $(id); if (e) e.textContent = (v === undefined || v === null || v === '') ? '-' : v; }
    set('mRating', L.rating);
    set('mWins', L.wins);
    set('mRate', L.winRate === undefined || L.winRate === null ? null : L.winRate + '%');
    fetch('/api/forum/profile/ladder?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var d = (j && j.data) || j || {};
      // 段位：用当前赛季(S3)按排名百分位算的值 ✓（库里 ladderTitle 是上季结算头衔 ✗）
      // 见 vote_server.py 的 ladder_tier_of()：S3 巅峰/大师/钻石/黄金/白银/参战者
      var lt = (d && d.ladder) || {};
      // ★ whoami 的 ladder.tier（当前赛季 S3 按排名百分位算 ✓）**优先** ✗
      //   社区资料接口返回的 d.tierName 是库里 ladderTitle = 上季(S2)结算头衔 ✗
      //   原来写的是 lt.tier || d.tier || d.tierName → 两个来源都不对时显示 '-'，
      //   而且这个 then 在 whoami 之后执行 → 会把正确的 S3 段位覆盖成 S2 ✗（用户实测"还是S2" ✗）
      var who = (me && me.ladder) || {};
      var tierText = who.tier
        ? (who.tier + (who.rank && who.total ? ('（第' + who.rank + '/' + who.total + '名）') : ''))
        : (lt.tier || d.tier || d.tierName || '-');
      if (lt.tier && lt.rank && lt.total) tierText += '（第' + lt.rank + '/' + lt.total + '名）';
      set('mTier', tierText);
      if (L.rating === undefined) set('mRating', d.rating);
    }).catch(function () {});
  }

  // ── 开始匹配 ──
  // 没卡组不让开始匹配（④ 的 UI 侧；客户端那边也有兜底拦截）
  function setStartEnabled(hasDeck) {
    var b = $('btnStart');
    if (!b) return;
    b.disabled = !hasDeck;
    b.title = hasDeck ? '开始匹配' : '先在右边选好卡组(.ydk)再开始匹配';
  }
  // 大厅 → 匹配 的转场动画：先铺一层红黑扫光，再跳转
  function playTransition(then) {
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;'
      + 'background:radial-gradient(closest-side at 50% 50%, rgba(216,30,68,.55), rgba(10,10,12,.97) 70%);'
      + 'transition:opacity .34s ease;';
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.style.opacity = '1'; });
    setTimeout(then, 380);
  }
  $('btnStart').onclick = function () {
    if (this.disabled) return;
    // 先把公网 IP 报给站点（异步但不等它 —— 失败也照样能匹配 ✓）
    try {
      fetchPublicIp().then(function (ip) {
        if (!ip) return;
        fetch('/api/duel/enter', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ realIp: ip }) }).catch(function () {});
      });
    } catch (e) {}
    playTransition(function () { location.href = 'duel.html?auto=1'; });
  };
})();
</script>
