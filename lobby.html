<style>
/* 配色对齐「新引导」next.css：红为主、金为辅、背景 #0a0a0c */
:root { --gold:#D4AF37; --gold2:#F0E68C; --line:rgba(216,30,68,.32); --panel:rgba(20,17,22,.86);
  --nx-red:#D81E44; --nx-red-soft:rgba(216,30,68,.55); --nx-bg:#0a0a0c; --nx-bg2:#141116;
  --nx-text:#ece9e4; --nx-dim:#9b97a1; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  color:var(--nx-text); background:var(--nx-bg); }
/* ── 背景：新引导那套漂浮光球 + 漂移红网格（只动 transform，可合成） ── */
.nx-bg { position:fixed; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
.nx-orb { position:absolute; border-radius:50%; opacity:.5; will-change:transform;
  animation:orbFloat 18s ease-in-out infinite; }
.nx-orb-1 { width:46vmax; height:46vmax; left:-14vmax; top:-16vmax; background:radial-gradient(circle, rgba(216,30,68,.55), transparent 68%); }
.nx-orb-2 { width:38vmax; height:38vmax; right:-12vmax; bottom:-14vmax; background:radial-gradient(circle, rgba(212,175,55,.34), transparent 70%); animation-delay:-6s; }
.nx-orb-3 { width:30vmax; height:30vmax; left:42%; top:46%; background:radial-gradient(circle, rgba(216,30,68,.28), transparent 70%); animation-delay:-11s; }
@keyframes orbFloat {
  0%,100% { transform:translate3d(0,0,0) scale(1); }
  33%     { transform:translate3d(4vmax,-3vmax,0) scale(1.08); }
  66%     { transform:translate3d(-3vmax,3vmax,0) scale(.95); }
}
.nx-grid { position:absolute; inset:-64px; opacity:.16; will-change:transform;
  background-image:linear-gradient(rgba(216,30,68,.35) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(216,30,68,.35) 1px, transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 0%, transparent 78%);
  animation:gridDrift 26s linear infinite; }
@keyframes gridDrift { to { transform:translate3d(64px,64px,0); } }
.wrap { position:relative; z-index:1; }
a { color:#9ec4f0; text-decoration:none; }
.wrap { max-width: 920px; margin: 0 auto; padding: 22px 16px 60px; }
.top { display:flex; align-items:center; gap:14px; margin-bottom:16px; }
.top-mid { flex:1 1 auto; min-width:0; }
/* 圆形按钮：红圈 + 透明底 + 黄字；比头像(84px)略大，与头像中心对齐。

.btn.start-top { flex:0 0 auto; align-self:center;                /* ← 与头像中心对齐 */
  width:92px; height:92px; border-radius:50%;                      /* ← 圆形，比头像略大 */
  padding:0; background:transparent;                               /* ← 透明底 */
  border:2px solid #ff3b3b;                                        /* ← 红线 */

  box-shadow:none; text-shadow:none; transition:background .15s ease, border-color .15s ease; }
.btn.start-top:hover { background:rgba(255,59,59,.10); border-color:#ff6b6b; }

/* 右上角的天梯战绩小条（积分/段位/胜场/胜率），放在「开始匹配」左边、与头像同一行 */
.mine { flex:0 0 auto; align-self:center; display:grid; grid-template-columns:repeat(2,auto); gap:4px 22px;

.mine span { display:flex; align-items:baseline; gap:6px; font-size:.78rem; color:#8d8d96; white-space:nowrap; }

.avatar { flex:0 0 84px; width:84px; height:84px; border-radius:12px; overflow:hidden; position:relative;
  border:2px solid var(--gold); background:linear-gradient(135deg,#1b2430,#0e141c 60%,#1b2430);
  display:flex; align-items:center; justify-content:center; }
/* 图片绝对定位盖满整个框 —— 否则 flex 会把「占位 ⚔️」和真头像并排摆成左右两半 */

.avatar span { font-size:1.6rem; opacity:.55; }
.title { font-size:1.25rem; font-weight:800; letter-spacing:1px;

.who { font-size:.82rem; color:#9a9aa4; margin-top:4px; }
.card { border:1px solid var(--line); border-radius:12px; background:var(--panel); padding:18px 20px; margin-bottom:16px; }
.row { display:flex; align-items:center; gap:10px; margin-bottom:14px; flex-wrap:wrap; }
.row:last-child { margin-bottom:0; }
.row .k { flex:0 0 62px; font-size:.86rem; color:#a9a9b3; }
.modes { display:flex; gap:10px; flex-wrap:wrap; }
.mode { padding:9px 18px; border-radius:8px; border:1px solid rgba(255,255,255,.16); background:transparent;
  color:#cfc8bd; font-size:.92rem; cursor:pointer; font-weight:600; }
.mode.on { background:linear-gradient(135deg,var(--nx-red),#a3122f); color:#fff; border-color:rgba(216,30,68,.9);

select, input[type=text] { padding:9px 12px; border-radius:8px; border:1px solid rgba(255,255,255,.14);

select:focus, input:focus { outline:none; border-color:rgba(212,175,55,.6); }
.btn { padding:9px 16px; border-radius:8px; border:none; cursor:pointer; font-size:.9rem; font-weight:700;

.btn.ghost { background:transparent; border:1px solid rgba(255,255,255,.18); color:#cfc8bd; font-weight:500; }

.start { width:100%; margin-top:6px; padding:14px; font-size:1.05rem; letter-spacing:2px; }
.hint { font-size:.78rem; color:#7d7d86; }
/* 当前使用卡组：直接把卡图画在框里（一行 10 张，和官网卡组界面一致） */
.deck-box { border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:12px 14px; margin-top:4px; }
.deck-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin-bottom:10px; }

.deck-cards { display:grid; grid-template-columns:repeat(10,minmax(0,1fr)); gap:5px; }
/* ── 卡图容器 + 禁限分数角标 ── 以下数值与老站 css/player-ranking.css 完全一致（老站同款） */
.deck-cards .card-img-wrapper {

  width: 100%;
  aspect-ratio: 42/61;
  align-self: start;
  overflow: hidden;
  border-radius: 2px;
}
.deck-cards .card-img-wrapper .deck-card-img {
  width: 100%;
  height: 100%;

  display: block;
  background: #101720;
  transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
}
.deck-cards .card-score-badge {
  position: absolute;
  bottom: 2px;
  left: 2px;
  min-width: 18px;
  height: 17px;
  line-height: 15px;
  text-align: center;
  background: rgba(0, 0, 0, 0.85);
  color: #FFD700;
  font-size: 0.65rem;
  font-weight: 700;
  border: 1px solid var(--nx-red, #D81E44);
  border-radius: 2px;
  padding: 0 4px;
  pointer-events: none;
  z-index: 2;
}
.deck-cards .card-score-badge.forbidden {
  font-size: 0.55rem;
  min-width: 17px;
  line-height: 15px;
}
.deck-cards .card-diy-badge {
  position: absolute;
  bottom: 2px;
  right: 2px;
  height: 14px;
  line-height: 12px;
  text-align: center;
  background: rgba(0, 0, 0, 0.85);
  color: #FFD700;
  font-size: 0.5rem;
  font-weight: 700;
  border: 1px solid var(--nx-red, #D81E44);
  border-radius: 2px;
  padding: 0 3px;
  pointer-events: none;
  z-index: 2;
}
.deck-cards .card-img-wrapper:hover .deck-card-img {
  box-shadow: 0 12px 20px -6px rgba(0,0,0,.8), 0 0 10px rgba(255,215,0,.25);
  outline: 1px solid var(--gold2); }
.deck-empty { font-size:.8rem; color:#7d7d86; }
.msg { min-height:18px; font-size:.8rem; color:#ff9aa8; margin-top:10px; }
.msg.ok { color:#8ee6a8; }
.stat { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; }
.stat div { border:1px solid rgba(255,255,255,.08); border-radius:8px; padding:10px 12px; font-size:.8rem; color:#9a9aa4; }
.stat b { display:block; font-size:1.05rem; color:#ddd6cd; margin-top:4px; font-weight:700; }
/* 紧凑行：模式/卡组横排，去掉大片空白 */
.row-inline { gap:10px; margin-bottom:12px; }
.row-inline .k { flex:0 0 44px; }
.row-inline .k-gap { margin-left:22px; }
.row-inline select { min-width:150px; max-width:230px; flex:0 1 auto; }
.row-inline .mode { padding:8px 16px; font-size:.88rem; }

/* ── 手机竖屏：整体缩到 75%（用户要求）+ 顶部改纵向，避免被挤成"一列竖字" ── */
@media (orientation: portrait), (max-width: 780px) {
  html { zoom: .75; }                     /* 整体 75%（Chrome/Edge/手机浏览器都支持）*/
  .wrap { max-width: none; padding-left: 6px; padding-right: 6px; }
  .top { flex-wrap: wrap; row-gap: 8px; }
  .top-mid { flex: 1 1 100%; min-width: 0; order: 2; }
  .mine { flex: 1 1 100%; order: 3; justify-content: flex-start; }
  .btn.start-top { order: 1; margin-left: auto; }
  .title { font-size: 1.15rem; }
  .who, .hint { white-space: normal; line-height: 1.5; }
  .row-inline { flex-wrap: wrap; row-gap: 8px; }
  .deck-cards { grid-template-columns: repeat(10, minmax(0, 1fr)); }
}

  /* 卡组下拉：深色主题 —— 原生 <select> 默认是白底 ✗ 在深色 UI 上非常扎眼（用户反馈"全发白"）
     原生 option 能生效的属性有限，background/color 是有效的 ✓ 两边都写上 */
  #deckSel {
    background: #171a21 !important;
    color: #ece9e4 !important;
    border: 1px solid rgba(216,30,68,.45) !important;
    border-radius: 8px !important;
    padding: 8px 34px 8px 12px !important;
    font: 600 14px/1.3 "Microsoft YaHei","PingFang SC",system-ui,sans-serif !important;
    appearance: none; -webkit-appearance: none; -moz-appearance: none;
    background-image: linear-gradient(45deg, transparent 50%, #d8a63c 50%),
                      linear-gradient(135deg, #d8a63c 50%, transparent 50%) !important;
    background-position: calc(100% - 18px) 52%, calc(100% - 12px) 52% !important;
    background-size: 6px 6px, 6px 6px !important;
    background-repeat: no-repeat !important;
    cursor: pointer;
    max-width: 240px;
  }
  #deckSel:hover { border-color: rgba(216,30,68,.8) !important; }
  #deckSel:focus { outline: none !important; box-shadow: 0 0 0 2px rgba(212,175,55,.35) !important; }
  #deckSel option {
    background: #171a21 !important;      /* 下拉展开后每一项的底色 ✓ */
    color: #ece9e4 !important;
  }
  #deckSel option:checked, #deckSel option:checked:hover {
    background: #2a3140 !important; color: #FFD700 !important;
  }
  /* 返回主页按钮：照官网其它分块的 .back-btn（左上角固定、红色渐变、金色字 ✓）
     官网各分块都是各自定义一份 ✓ 这里给决斗大厅也来一份（用字面色值，不依赖首页的 CSS 变量 ✓） */
  .back-btn {
    position: fixed;
    top: 20px;
    left: 20px;
    background: linear-gradient(135deg, #d81e44, #8b1228);
    color: #f5e6a8;
    border: none;
    padding: 10px 20px;
    border-radius: 10px;
    font-weight: bold;
    font-size: 14px;
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    cursor: pointer;
    transition: 0.3s;
    z-index: 999;
  }
  .back-btn:hover {
    transform: scale(1.05);
    box-shadow: 0 0 10px rgba(216, 30, 68, 0.5);
  }
  @media (orientation: portrait), (max-width: 780px) {
    .back-btn { top: 10px; left: 10px; padding: 8px 14px; font-size: 13px; }
  }
.pie-item-other { cursor:pointer; }
.pie-item-other:hover { background: rgba(212,175,55,.12); }
</style>

<style>

/* PATCH(白神服) 2026-11-08: 按钮文字/位置**不动**，改成「外圈光晕一波波散开」+ 光晕强弱点跳 */

  /* 把手最终样式（覆盖前面旧的白边定义）：同款红边 + 圆角朝外 */
  body .spec-toggle, body .stat-toggle {
    border: 1px solid rgba(216, 30, 68, .32) !important;
    border-radius: 12px !important;
    background: #0d1014 !important;
    box-shadow: none !important;
    color: #cfe6ff !important;
  }
  body .spec-toggle { right: 0; border-left: none !important; border-radius: 0 12px 12px 0 !important; }
  body .stat-toggle { left: 0; border-right: none !important; border-radius: 12px 0 0 12px !important; }
  /* 占位沿用原卡片的分值角标结构，占位里没有角标 */
}
</style>
<style>
/* siro-lobby-landscape-fix 2026-11-19 */
@media (orientation: landscape) and (max-height: 800px) {
  .stats-col { gap: 5px !important; }
  .stats-col .stat-card { padding: 7px 9px !important; }
  .stats-col .pie-wrap { gap: 7px !important; flex-wrap: nowrap !important; }
  /* 饼图缩小，给下面的玩家排名留高度 */
  .stats-col .pie-svg { flex: 0 0 62px !important; width: 62px !important; height: 62px !important; }
  .stats-col .pie-legend { max-height: 72px !important; }
  .stats-col .pie-item { font-size: .62rem !important; line-height: 1.3 !important; }
  .stats-col .stat-card:nth-child(2) { flex: 0 0 auto !important; }
  /* 玩家排名卡必须吃掉剩余高度，内部列表自己滚 */
  .stats-col .stat-card:last-child {
    flex: 1 1 auto !important; min-height: 0 !important;
    display: flex !important; flex-direction: column !important; overflow: hidden !important;
  }
  .stats-col .stat-card:last-child .rank-list {
    flex: 1 1 auto !important; min-height: 0 !important;
    max-height: none !important; overflow-y: auto !important;
  }
  .stats-col .stat-card:last-child h3 { flex: 0 0 auto !important; }
}
#deckCards .deck-pane-label {
  display: flex; align-items: center; justify-content: center;
  text-align: center; box-sizing: border-box;
  color: #FFD700; font-weight: 800; font-size: 9px; line-height: 1.3;
  white-space: pre-line;
  background: rgba(212,175,55,.08);
  border: 1px solid rgba(212,175,55,.45); border-radius: 3px;
  overflow: hidden;
}
#deckCards .deck-pane-extra .deck-pane-label { font-size: 9px; }
#deckCards .deck-pane-side .deck-pane-label { font-size: 11px; letter-spacing: .5px; line-height: 1.25; }
/* 额外/SIDE 与主卡组共用同一行高变量，卡图高度严格一致 */
#deckCards .deck-panes .deck-grid { grid-auto-rows: var(--siro-deck-row-h, auto); }
#deckCards .deck-panes .deck-grid > * { min-height: var(--siro-deck-row-h, 0); }
body .deck-panes-right { gap: 3px !important; }
</style>
</head>
<body>
<div class="nx-bg">
  <span class="nx-orb nx-orb-1"></span>
  <span class="nx-orb nx-orb-2"></span>
  <span class="nx-orb nx-orb-3"></span>
  <div class="nx-grid"></div>
</div>
<div class="wrap">
  <div class="top">
    <div class="avatar" id="avatarBox"><span>⚔️</span></div>
    <div class="top-mid">
      <div class="title" id="meName">决斗大厅</div>
      <div class="who" id="who">…</div>
      <div class="hint" id="startHint" style="display:none"></div>
    </div>
    <!-- 手机端：统计卡（头像与开始匹配之间；桌面端隐藏，用右栏那份） -->
    <div class="stats-mobile">
      <div class="card stat-card" data-drawer="pie" title="点开查看完整牌系占比">
        <h3>🥧 天梯主牌系占比 <small class="arch-sub">加载中…</small></h3>
        <div class="pie-wrap">
          <svg class="pie-svg arch-pie" viewBox="0 0 42 42" role="img" aria-label="天梯主牌系占比"></svg>
          <div class="pie-legend arch-legend"></div>
        </div>
      </div>
      <div class="card stat-card" data-drawer="rank" title="点开查看玩家排名">
        <h3>🎲 当赛季先后手胜率 <small class="fs-sub">加载中…</small></h3>
        <div class="fs-body"></div>
      </div>
    </div>

    <div class="mine" id="mine">
      <span><i>积分</i><b id="mRating">-</b></span>
      <span><i>段位</i><b id="mTier">-</b></span>
      <span><i>胜场</i><b id="mWins">-</b></span>
      <span><i>胜率</i><b id="mRate">-</b></span>
    </div>
    <button class="btn ghost spec-toggle" id="specToggle" title="在线观战列表">观战</button>
    <button class="btn ghost stat-toggle" id="statToggle" title="天梯统计 / 排名">统计</button>
    <button class="btn start-top" id="btnStart" disabled title="正在验证登录状态…">开始匹配</button>
  </div>

  <!-- 手机端：统计抽屉（点上面的迷你卡展开） -->
  <div class="stat-drawer" id="statDrawer">
    <div class="stat-drawer-head"><b id="drawerTitle">天梯主牌系占比</b><button id="drawerClose" type="button">收起 ✕</button></div>
    <div class="stat-drawer-body" id="drawerBody"></div>
  </div>

  <div class="lobby-grid">
    <!-- 左：在线观战（只列随机匹配 M 房且已开局） -->
    <div class="card spec-card">
      <div class="spec-handle" id="specHandle">
        <span>⚔ 在线观战</span><span class="cnt" id="specCount">加载中…</span><span class="arrow">▲</span>
      </div>
      <div class="spec-head">
        <span class="spec-title">⚔ 对局 · 在线观战</span>
        <span class="spec-sub" id="specMeta">加载中…</span>
      </div>
      <div class="spec-list" id="specList"></div>
    </div>

    <!-- 右：当前卡组（自适应大小，不出滚动条） -->
    <div class="card deck-col">
    <!-- 只有天梯一种形态（比赛模式已按用户决定去掉）→ 不再需要模式选择，卡组行独自成行 -->
    <div class="row row-inline">
      <span class="k">卡组</span>
      <select id="deckSel"><option value="">（还没有卡组，点右边新建或上传）</option></select>
      <button class="btn ghost" id="btnUpload" title="从电脑里选一个 .ydk 文件存到账号">上传</button>
      <button class="btn ghost" id="btnEdit" title="在组卡器里打开选中的卡组（改完可直接保存到账号）">编辑</button>
      <button class="btn ghost" id="btnNew" title="打开组卡器新建一套卡组（可保存到账号）">新建</button>
      <input type="file" id="ydkFile" accept=".ydk,text/plain" style="display:none">
    </div>
    <div class="deck-box">
      <div class="deck-head">
        <span class="hint">当前使用卡组</span>
        <b id="deckNow">读取中…</b>
      </div>
      <div id="deckCards"></div>
    </div>
    <div class="msg" id="msg"></div>
  </div>

    <!-- 右：统计（上：天梯主牌系饼图 / 下：当赛季先后手胜率） -->
    <aside class="stats-col">
      <div class="card stat-card">
        <h3>🥧 天梯主牌系占比 <small id="archSub" class="arch-sub">加载中…</small></h3>
        <div class="pie-wrap">
          <svg class="pie-svg arch-pie" id="archPie" viewBox="0 0 42 42" role="img" aria-label="天梯主牌系占比"></svg>
          <div class="pie-legend arch-legend" id="archLegend"></div>
        </div>
      </div>
      <div class="card stat-card">
        <h3>🎲 当赛季先后手胜率 <small id="fsSub" class="fs-sub">加载中…</small></h3>
        <div id="fsBody" class="fs-body"></div>
      </div>
      <div class="card stat-card" style="flex:1 1 auto; min-height:0;">
        <h3>🏆 玩家排名 <small id="rankSub">TOP 10</small></h3>
        <div class="rank-list" id="rankList"><div class="pie-empty">加载中…</div></div>
      </div>
    </aside>
  </div><!-- /lobby-grid -->
  <div id="specBackdrop"></div>
  <div id="statBackdrop"></div>

  <!-- 返回主页：和官网其它分块（卡组查看器 / 排行榜 / 论坛…）保持一致 —— 左上角 back-btn ✓ -->
  <button class="back-btn" id="backHomeBtn">← 返回主页</button>
</div>

<script>
/* PATCH(白神服) 2026-11-14: 决斗大厅的「返回主页」按来源分流 ——
   从新版(next.html)进来就回新版大厅，从老版(index.html)进来就回老版 */
(function () {
  var btn = document.getElementById('backHomeBtn');
  if (!btn) return;
  var from = '';
  try { from = new URLSearchParams(location.search).get('from') || ''; } catch (e) {}
  btn.setAttribute('data-from', from);
  btn.onclick = function () {
    location.href = (from === 'next') ? 'next.html' : 'index.html';
  };
})();
(function () {
  'use strict';
  var $ = function (i) { return document.getElementById(i); };
  function msg(t, ok) { var m = $('msg'); m.textContent = t || ''; m.className = 'msg' + (ok ? ' ok' : ''); }
  var curDeck = null;      // 当前使用卡组（{name, main, extra, side}）


  // 从对局页被"中止匹配"退回来时带的原因（?err=）→ 红字显示出来
  try {
    var errMsg = new URLSearchParams(location.search).get('err');
    if (errMsg) {
      var m0 = $('msg');
      if (m0) { m0.className = 'msg'; m0.textContent = '⚠ ' + errMsg + ' —— 请换一套合规卡组再开始匹配'; }
    }
  } catch (e) {}

  // ── 身份 ──
  fetch('/api/duel/whoami?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || !d.loggedIn) {
      window.__lobbyLoggedIn = false;
      var avBox = document.getElementById('avatarBox');
      if (avBox) {
        avBox.style.cursor = 'pointer';
        avBox.title = '点击登录 / 注册';
        avBox.onclick = function () {
          if (window.__lobbyLoggedIn) return;
          location.href = 'duel.html?from=lobby';
        };
      }
      $('who').innerHTML = '<a href="duel.html?from=lobby">未登录，点这里登录/注册 →</a>';
      setStartEnabled(false);
      msg('登录后才能开始匹配');
      return;
    }
    window.__lobbyAuthOk = true;
    window.__lobbyLoggedIn = true;
    (function () {
      var av2 = document.getElementById('avatarBox');
      if (av2) { av2.style.cursor = ''; av2.title = ''; av2.onclick = null; }
    })();
    window.__myName = (d && (d.name || d.account)) || '';   // 观战时用这个名字
    $('who').textContent = '已登录：' + (d.account || d.name);
    if (d.name) $('meName').textContent = d.name;    // 标题换成玩家显示名
    // 头像：用官网已有的 /api/forum/avatar/<账号>（和论坛/卡组社区同一个头像）
    var av = document.createElement('img');
    av.alt = '头像';
    av.onerror = function () { av.remove(); };            // 没头像就保持 ⚔️ 占位
    av.src = '/api/forum/avatar/' + encodeURIComponent(d.account || d.name) + '?v=' + Date.now();
    $('avatarBox').appendChild(av);
    setStartEnabled(false);          // 先禁用，等卡组列表回来再决定
    loadDecks(); loadMine(d);
  })
  .catch(function () { $('who').textContent = '读取登录状态失败'; });

  // ── 卡组库 ──
  function loadDecks() {
    fetch('/api/duel/decks?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var sel = $('deckSel');
      sel.innerHTML = '';
      var names = (j && j.names) || [];
      if (!names.length) {
        var o = document.createElement('option');
        o.value = ''; o.textContent = '（还没有卡组，点右边新建或上传）';
        sel.appendChild(o);
        setStartEnabled(false);            // 没卡组 → 不让开始匹配
        return;
      }
      setStartEnabled(true);
      names.forEach(function (n) {
        var o = document.createElement('option');
        o.value = n; o.textContent = n.replace(/\.ydk$/i, '');
        if (j.active && n === j.active + '.ydk') o.selected = true;
        sel.appendChild(o);
      });
    });
    fetch('/api/duel/deck?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.name) {
        curDeck = j;      // 存起来（画卡图 + 点卡开官网大窗口都用它）
        // 分数表可能还没加载完 → 等它到位再算总分 ✓（否则会算成 0 ✗）
        var _needScores = (scoreMap === null);
        var _paint = function () {
          var sum = 0, miss = 0, ban = 0;
          ['main', 'extra', 'side'].forEach(function (k) {
            (j[k] || []).forEach(function (c) {
              var e = scoreMap ? scoreMap[c] : null;
              var v = (typeof e === 'number') ? e : (e && typeof e.score === 'number' ? e.score : null);
              if (v === null || v === undefined) { miss++; return; }
              sum += v;
              if (e && (e.forbidden || e.ban)) ban++;
            });
          });
          var txt = j.name + '（主 ' + (j.main || []).length + ' / 额外 ' + (j.extra || []).length +
            ' / 副 ' + (j.side || []).length + '）';
          var el = $('deckNow');
          if (!el) return;
          el.innerHTML = '';
          el.appendChild(document.createTextNode(txt + '  ·  总分 '));
          var b = document.createElement('b');
          b.textContent = sum + '/100';
          b.style.color = (sum > 100) ? '#ff6b6b' : '#FFD700';       // 超 100 变红 ✓
          b.style.fontSize = '1.05em';
          el.appendChild(b);
          if (ban > 0) {
            var w = document.createElement('span');
            w.textContent = '  ⚠ 含 ' + ban + ' 张禁用卡';
            w.style.color = '#ff6b6b';
            el.appendChild(w);
          }
          if (miss > 0) {
            var m = document.createElement('span');
            m.textContent = '（' + miss + ' 张无分值数据）';
            m.style.color = '#9b97a1';
            m.style.fontSize = '0.9em';
            el.appendChild(m);
          }
        };
        if (_needScores) loadScores().then(_paint); else _paint();
        renderDeckCards(j);
      } else {
        curDeck = null;
        $('deckNow').textContent = '未设置';
        $('deckCards').innerHTML = '<div class="deck-empty">还没设置卡组 — 点右边的「新建」在组卡器里建一套，或「上传」一个 .ydk</div>';
      }
    });
  }

  // ── 卡图（和官网同一条兜底链：OCG → SuperPre 先行卡 → 白神服 DIY）──
  // 分值表（左下角角标用）：/api/scores → {id: {score, forbidden}}
  var scoreMap = null;
  function loadScores() {
    return fetch('/api/scores?t=' + Date.now()).then(function (r) { return r.json(); })
      .then(function (j) { scoreMap = (j && !j.error) ? j : {}; })
      .catch(function () { scoreMap = {}; });
  }
  var CARD_PIC = [
    'https://cdn.233.momobako.com/ygopro/pics/',
    'https://cdn02.moecube.com:444/ygopro-super-pre/data/pics/',
    'https://api.ygopro3.cn/pics/siro/',
  ];
  // 每张卡：包一层 .card-img-wrapper（老站同款）+ 左下角分值角标 + 右下角 DIY 角标。
  // DIY 角标由「DIY 图加载成功」时打上 —— 这是老站 deck-viewer.js 的做法，原样搬过来。
  function deckCardImg(id) {
    var wrap = document.createElement('div');
    wrap.className = 'card-img-wrapper';
    wrap.setAttribute('data-card-id', String(id));
    var sc = scoreMap && scoreMap[id];
    var badge = '';
    if (sc) badge = sc.forbidden
      ? '<div class="card-score-badge forbidden">🚫</div>'
      : '<div class="card-score-badge">' + sc.score + '</div>';
    wrap.innerHTML =
      '<img class="deck-card-img" alt="' + id + '" loading="lazy" src="' + CARD_PIC[0] + id + '.jpg"'
      + " onerror=\"this.onerror=null;this.src='" + CARD_PIC[1] + id + ".jpg';"
      + "this.onerror=function(){this.onerror=null;this.src='" + CARD_PIC[2] + id + ".jpg';"
      + "this.onload=function(){if(!this.closest('.card-img-wrapper').querySelector('.card-diy-badge')){"
      + "var b=document.createElement('div');b.className='card-diy-badge';b.textContent='DIY';"
      + "this.closest('.card-img-wrapper').appendChild(b);}};"
      + "this.onerror=function(){this.src='cover.jpg';}}\">"
      + badge;
    return wrap;
  }
  function renderDeckCardsLegacy(deck) {
    if (!scoreMap) { loadScores().then(function () { renderDeckCards(deck); }); return; }
    var box = $('deckCards');
    box.innerHTML = '';
    function section(label, ids) {
      if (!ids || !ids.length) return;
      var t = document.createElement('div');
      t.className = 'deck-sec';
      t.textContent = label + '（' + ids.length + ' 张）';
      box.appendChild(t);
      var grid = document.createElement('div');
      grid.className = 'deck-cards';
      ids.forEach(function (id) { grid.appendChild(deckCardImg(id)); });
      box.appendChild(grid);
    }
    section('主卡组', deck.main || []);
    section('额外卡组', deck.extra || []);
    section('副卡组', deck.side || []);
    if (!box.children.length) box.innerHTML = '<div class="deck-empty">这套卡组是空的</div>';
    // 老站那套悬停提示：鼠标移到卡上显示卡名/效果文本
    if (window.DeckViewer && window.DeckViewer.attachCardHover) {
      window.DeckViewer.attachCardHover(box);
    }
  }

  // PATCH(白神服) 2026-11-17: 只有「手机横屏」用新版式（主卡组 10/11/12 列、额外/副 8 列、
  // 空白占位、卡图等大），其它情况（PC / 手机竖屏）保持原来的三段式渲染，不受影响。
  var COMPACT_MQ = '(orientation: landscape) and (max-height: 640px) and (max-width: 1000px)';
  function isCompactLobby() {
    try { return window.matchMedia(COMPACT_MQ).matches; } catch (e) { return false; }
  }
  function renderDeckCards(deck) {
    if (isCompactLobby()) return renderDeckCardsCompact(deck);
    return renderDeckCardsLegacy(deck);
  }
  try { window.renderDeckCards = renderDeckCards; } catch (e) {}   // 调试/外部调用
  function renderDeckCardsCompact(deck) {
    if (!scoreMap) { loadScores().then(function () { renderDeckCardsCompact(deck); }); return; }
    var box = $('deckCards');
    box.innerHTML = '';
    var main = deck.main || [], extra = deck.extra || [], side = deck.side || [];
    var mainCols = Math.max(10, Math.ceil(Math.max(main.length, 1) / 4));
    if (!main.length && !extra.length && !side.length) {
      box.innerHTML = '<div class="deck-empty">这套卡组是空的</div>';
      return;
    }

    var panes = document.createElement('div');
    panes.className = 'deck-panes';
    var mainPane = mkPane('deck-pane-main', '主卡组', main, mainCols, 4, false);
    var extraPane = mkPane('deck-pane-extra', '额外卡组', extra, 8, 2, true);
    var sidePane = mkPane('deck-pane-side', '副卡组', side, 8, 2, true);
    var right = document.createElement('div');
    right.className = 'deck-panes-right';
    right.appendChild(extraPane.pane);
    right.appendChild(sidePane.pane);
    panes.appendChild(mainPane.pane);
    panes.appendChild(right);
    box.appendChild(panes);

    function mkPane(cls, label, ids, cols, minRows, labelTile) {
      var pane = document.createElement('div');
      pane.className = 'deck-pane ' + cls;
      var head = document.createElement('div');
      head.className = 'deck-pane-head';
      head.textContent = label + '（' + ids.length + ' 张）';
      if (labelTile) {
        // 额外卡组：保留与主卡组标题同高，只隐藏文字；副卡组在上面一排的下一格，
        // 不能再留标题高度，否则会比主卡组第三排低一截。
        if (cls.indexOf('side') >= 0) head.style.display = 'none';
        else {
          head.style.visibility = 'hidden';
          head.setAttribute('aria-hidden', 'true');
        }
      }
      pane.appendChild(head);
      var grid = document.createElement('div');
      grid.className = 'deck-cards deck-grid';
      var needCells = Math.max(cols * minRows, Math.ceil(ids.length / cols) * cols || cols);
      if (labelTile) needCells = Math.max(16, cols * minRows);   // 1 个标题格 + 15 个卡位
      var rows = Math.ceil(needCells / cols);
      var i;
      if (labelTile) {
        var lab = document.createElement('div');
        lab.className = 'deck-pane-label';
        lab.textContent = (label === '额外卡组') ? '额外\n卡组' : 'SI\nDE';
        grid.appendChild(lab);
      }
      for (i = 0; i < ids.length; i++) grid.appendChild(deckCardImg(ids[i]));
      var cardSlots = labelTile ? Math.max(15, ids.length) : ids.length;
      for (i = ids.length; i < cardSlots; i++) {
        var ph = document.createElement('div');
        ph.className = 'card-img-wrapper is-placeholder';
        grid.appendChild(ph);
      }
      pane.appendChild(grid);
      return { pane: pane, grid: grid, cols: cols, rows: rows };
    }

    // 关键：用像素写死列宽/行高 → 主卡组(10列×4行) 与 额外/副(8列×2行) 的卡图
    //       宽高完全一致，也不会撑出容器（上面标题不会被压、下面不会裁掉）
    function layout() {
      var h = box.clientHeight;
      if (!h || h < 60) return;
      var headH = 14;                       // 三个区块标题 + 间距
      var rowH = Math.floor((h - headH * 3 - 16) / 4);
      if (rowH < 24) rowH = 24;
      var cardW = Math.floor((rowH - 3) * 59 / 86);
      if (cardW < 14) cardW = 14;
      try { box.style.setProperty('--siro-deck-row-h', rowH + 'px'); } catch (e) {}
      function apply(q) {
        q.grid.style.gridTemplateColumns = 'repeat(' + q.cols + ', ' + cardW + 'px)';
        q.grid.style.gridTemplateRows = 'repeat(' + q.rows + ', ' + rowH + 'px)';
        q.grid.style.width = (q.cols * cardW + (q.cols - 1) * 3) + 'px';
        // 每个格子也写死宽高（浏览器对 aspect-ratio:auto + 绝对定位子元素不一定会 stretch）
        for (var ci = 0; ci < q.grid.children.length; ci++) {
          var c = q.grid.children[ci];
          c.style.width = cardW + 'px';
          c.style.height = rowH + 'px';
        }
      }
      apply(mainPane);
      apply(extraPane);
      apply(sidePane);
    }
    layout();
    requestAnimationFrame(layout);
    window.addEventListener('resize', layout);
    if (window.DeckViewer && window.DeckViewer.attachCardHover) {
      window.DeckViewer.attachCardHover(box);
    }
  }


  $('deckSel').onchange = function () {
    var v = this.value;
    if (!v) return;
    fetch('/api/duel/decks/active', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: v.replace(/\.ydk$/i, '') }) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { msg('已切换当前使用卡组：' + j.active, true); loadDecks(); }
        else msg((j && j.error) || '切换失败');
      });
  };

  // ── 编辑 / 新建 → 打开组卡器（组卡器里可直接保存/删除到账号 ✓）
  //    ?deck=<名字> 让组卡器载入指定卡组；?new=1 新建空卡组；?from=lobby 保存后能一键回大厅 ✓
  if ($('btnEdit')) {
    $('btnEdit').onclick = function () {
      var n = ($('deckSel') && $('deckSel').value) || '';
      if (!n) { msg('先在左边选一套卡组，再点「编辑」'); return; }
      location.href = 'index.html?builder=1&deck=' + encodeURIComponent(n.replace(/\.ydk$/i, '')) + '&from=lobby&t=' + Date.now();
    };
  }
  if ($('btnNew')) {
    $('btnNew').onclick = function () {
      location.href = 'index.html?builder=1&new=1&from=lobby&t=' + Date.now();
    };
  }

  // ── 上传 .ydk（打开本地文件夹自选）──
  $('btnUpload').onclick = function () { $('ydkFile').click(); };
  $('ydkFile').onchange = function () {
    var f = this.files && this.files[0];
    if (!f) return;
    var def = f.name.replace(/\.ydk$/i, '');
    var name = prompt('给这套卡组起个名字（存到你的账号里）：', def);
    if (!name) { this.value = ''; return; }
    var fr = new FileReader();
    fr.onload = function () {
      msg('上传中…');
      fetch('/api/duel/decks/upload', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name, ydk: String(fr.result) }) })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j && j.ok) { msg('已保存卡组「' + j.name + '」（主 ' + j.main + ' / 额外 ' + j.extra + ' / 副 ' + j.side + '）', true); loadDecks(); }
          else msg((j && j.error) || '上传失败');
        }).catch(function (e) { msg('上传失败：' + e.message); });
    };
    fr.readAsText(f, 'utf-8');
    this.value = '';
  };

  // ── 右上角战绩：积分/胜场/胜率来自 whoami（读 player_rating），段位来自社区资料接口 ──
  function loadMine(me) {
    var L = (me && me.ladder) || {};
    function set(id, v) { var e = $(id); if (e) e.textContent = (v === undefined || v === null || v === '') ? '-' : v; }
    set('mRating', L.rating);
    set('mWins', L.wins);
    set('mRate', L.winRate === undefined || L.winRate === null ? null : L.winRate + '%');
    fetch('/api/forum/profile/ladder?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (j) {
      var d = (j && j.data) || j || {};
      // 段位：用当前赛季(S3)按排名百分位算的值 ✓（库里 ladderTitle 是上季结算头衔 ✗）
      // 见 vote_server.py 的 ladder_tier_of()：S3 巅峰/大师/钻石/黄金/白银/参战者
      var lt = (d && d.ladder) || {};
      // ★ whoami 的 ladder.tier（当前赛季 S3 按排名百分位算 ✓）**优先** ✗
      //   社区资料接口返回的 d.tierName 是库里 ladderTitle = 上季(S2)结算头衔 ✗
      //   原来写的是 lt.tier || d.tier || d.tierName → 两个来源都不对时显示 '-'，
      //   而且这个 then 在 whoami 之后执行 → 会把正确的 S3 段位覆盖成 S2 ✗（用户实测"还是S2" ✗）
      var who = (me && me.ladder) || {};
      var tierText = who.tier
        ? (who.tier + (who.rank && who.total ? ('（第' + who.rank + '/' + who.total + '名）') : ''))
        : (lt.tier || d.tier || d.tierName || '-');
      if (lt.tier && lt.rank && lt.total) tierText += '（第' + lt.rank + '/' + lt.total + '名）';
      set('mTier', tierText);
      if (L.rating === undefined) set('mRating', d.rating);
    }).catch(function () {});
  }

  // ── 开始匹配 ──
  // 没卡组不让开始匹配（④ 的 UI 侧；客户端那边也有兜底拦截）
  function setStartEnabled(hasDeck) {
    var b = $('btnStart');
    if (!b) return;
    b.disabled = !hasDeck;
    b.title = hasDeck ? '开始匹配' : '先在右边选好卡组(.ydk)再开始匹配';
  }
  // 大厅 → 匹配 的转场动画：先铺一层红黑扫光，再跳转
  function playTransition(then) {
    var ov = document.createElement('div');
    ov.style.cssText = 'position:fixed;inset:0;z-index:9999;pointer-events:none;opacity:0;'
      + 'background:radial-gradient(closest-side at 50% 50%, rgba(216,30,68,.55), rgba(10,10,12,.97) 70%);'
      + 'transition:opacity .34s ease;';
    document.body.appendChild(ov);
    requestAnimationFrame(function () { ov.style.opacity = '1'; });
    setTimeout(then, 380);
  }
  $('btnStart').onclick = function () {
    if (this.disabled) return;
    // 防止「登录态还没验证完就点开始匹配」（会进房后准备失败）
    if (!window.__lobbyAuthOk) {
      msg('正在验证登录状态，请稍候 1 秒再点…');
      setTimeout(function () { if (window.__lobbyAuthOk) $('btnStart').disabled = false; }, 800);
      return;
    }
    // 先把公网 IP 报给站点（异步但不等它 —— 失败也照样能匹配 ✓）
    try {
      fetchPublicIp().then(function (ip) {
        if (!ip) return;
        fetch('/api/duel/enter', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ realIp: ip }) }).catch(function () {});
      });
    } catch (e) {}
    playTransition(function () { location.href = 'duel.html?auto=1'; });
  };
})();
</script>

<script>
/* PATCH(白神服) 2026-11-03: 观战列表（随机 M 房 · 已开局）+ 卡组自适应 */
(function () {
  'use strict';
  var PIC_OCG = 'https://cdn.233.momobako.com/ygopro/pics/';
  var PIC_PRE = 'https://cdn02.moecube.com:444/ygopro-super-pre/data/pics/';
  var PIC_DIY = 'https://api.ygopro3.cn/pics/siro/';
  var listEl = document.getElementById('specList');
  var metaEl = document.getElementById('specMeta');
  if (!listEl) return;

  // ── 手机端：在线观战底部抽屉 ──
  (function () {
    var card = document.querySelector('.spec-card');
    var handle = document.getElementById('specHandle');
    var bd = document.getElementById('specBackdrop');
    if (!card || !handle) return;
    function setOpen(open) {
      card.classList.toggle('open', open);
      if (bd) bd.classList.toggle('on', !!open);
    }
    handle.addEventListener('click', function () { setOpen(!card.classList.contains('open')); });
    if (bd) bd.addEventListener('click', function () { setOpen(false); });
    // 抽屉里点「在线观战」跳转前先收起（返回时不会是展开状态）
    card.addEventListener('click', function (ev) {
      var t = ev.target;
      if (t && t.classList && t.classList.contains('spec-watch')) setOpen(false);
    });
  })();

  // ── 右栏统计：天梯主牌系饼图 + 当赛季先后手胜率 ──
  var $ = function (i) { return document.getElementById(i); };   // 本 IIFE 内的局部 $（原来没有）
  var LAST_ARCH = null;
  var ARCH_COLORS = ['#46d8a1', '#4aa8ff', '#e6ad3f', '#ff7b72', '#b98cff', '#37c8d8',
                     '#f0d264', '#8fd94a', '#ff9ecb', '#7f8cff', '#d98c5f', '#5fd0a0',
                     '#c0c8d8'];
  function donutSvg(items) {
    var total = items.reduce(function (a, b) { return a + (b.pct || 0); }, 0) || 1;
    var out = '<circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="rgba(255,255,255,.07)" stroke-width="7"></circle>';
    var off = 25;
    items.forEach(function (it, i) {
      var pct = (it.pct || 0) / total * 100;
      var col = it.name === '其它' ? 'rgba(160,160,172,.55)' : ARCH_COLORS[i % ARCH_COLORS.length];
      out += '<circle cx="21" cy="21" r="15.9155" fill="transparent" stroke="' + col + '" stroke-width="7"'
        + ' stroke-dasharray="' + pct.toFixed(2) + ' ' + (100 - pct).toFixed(2) + '"'
        + ' stroke-dashoffset="' + off.toFixed(2) + '"></circle>';
      off -= pct;
    });
    return out;
  }
  function each(sel, fn) {
    [].forEach.call(document.querySelectorAll(sel), fn);
  }
  // 「其它」明细：长尾牌系列表（点饼图图例里的「其它」触发）
  function showArchTail(d) {
    var old = document.getElementById('archTailMask');
    if (old) old.parentNode.removeChild(old);
    var tail = (d && d.tail) || [];
    var mask = document.createElement('div');
    mask.id = 'archTailMask';
    mask.style.cssText = 'position:fixed;inset:0;z-index:100060;background:rgba(4,3,8,.72);'
      + 'display:flex;align-items:center;justify-content:center;padding:18px;'
      + 'font-family:"Microsoft YaHei",system-ui,sans-serif';
    var box = document.createElement('div');
    box.style.cssText = 'width:min(560px,94vw);max-height:78vh;display:flex;flex-direction:column;'
      + 'background:linear-gradient(180deg,#1a1720,#14121a);border:1px solid rgba(212,175,55,.42);'
      + 'border-radius:14px;color:#ece6da;overflow:hidden';
    var sub = '占 ' + (d.total ? ((d.tailTotal || 0) * 100 / d.total).toFixed(1) : '0') + '%'
      + ' · ' + (d.tailCount || tail.length) + ' 个牌系 · ' + (d.tailTotal || 0) + ' 副卡组';
    if (d.unclassified) sub += '（另有 ' + d.unclassified + ' 副无法归类）';
    box.innerHTML = '<div style="display:flex;align-items:center;gap:10px;padding:14px 16px;'
      + 'border-bottom:1px solid rgba(255,255,255,.07)">'
      + '<b style="color:#e9c96a">「其它」明细</b>'
      + '<span style="font-size:12px;color:#8d8798">' + sub + '</span>'
      + '<button id="archTailClose" style="margin-left:auto;width:30px;height:30px;border-radius:8px;'
      + 'border:1px solid rgba(255,255,255,.14);background:transparent;color:#b9b3c4;cursor:pointer">✕</button></div>'
      + '<div style="overflow:auto;padding:8px 14px 14px;scrollbar-width:thin">' + (tail.length ? tail.map(function (it) {
          return '<div style="display:flex;align-items:center;gap:8px;padding:6px 4px;'
            + 'border-bottom:1px dashed rgba(255,255,255,.06)">'
            + '<span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'
            + esc(it.name) + '</span>'
            + '<span style="font-size:12px;color:#9b95a6">' + it.count + ' 副</span>'
            + '<span style="font-size:12px;color:#ffe08a;width:52px;text-align:right">' + it.pct + '%</span>'
            + '</div>';
        }).join('') : '<div style="padding:20px;text-align:center;color:#8d8798">没有长尾数据</div>')
      + '</div>';
    mask.appendChild(box);
    document.body.appendChild(mask);
    function close() { if (mask.parentNode) mask.parentNode.removeChild(mask); }
    box.querySelector('#archTailClose').onclick = close;
    mask.addEventListener('click', function (e) { if (e.target === mask) close(); });
    document.addEventListener('keydown', function esc2(e) {
      if (e.key === 'Escape') { close(); document.removeEventListener('keydown', esc2, true); }
    }, true);
  }

  function loadArch() {
    fetch('/api/ladder/archetypes?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      var ok = !!(d && d.ok && (d.items || []).length);
      // PATCH: 「其它」必须保留 —— 之前 slice(0,13) 会把它截掉，
      //   于是 <2% 的牌系在饼图上就完全看不到（用户要求：没到 2% 的也显示，归到其它）
      var items = [];
      if (ok) {
        var others = null;
        d.items.forEach(function (it) {
          if (it.name === '其它' || it.name === '其他' || it.name === 'Other') others = it;
        });
        items = d.items.filter(function (it) { return it !== others; }).slice(0, 12);
        if (others) items = items.concat([others]);
      }
      each('.arch-pie', function (pie) { pie.innerHTML = ok ? donutSvg(items) : ''; });
      each('.arch-legend', function (legend) {
        legend.innerHTML = ok ? items.map(function (it, i) {
          var col = it.name === '其它' ? 'rgba(160,160,172,.55)' : ARCH_COLORS[i % ARCH_COLORS.length];
          var isOther = (it.name === '其它' || it.name === '其他');
          return '<div class="pie-item' + (isOther ? ' pie-item-other' : '') + '"'
            + (isOther ? ' title="点击查看「其它」里都有哪些卡组"' : '')
            + '><span class="pie-dot" style="background:' + col + '"></span>'
            + '<span class="pie-name" title="' + esc(it.name) + '">' + esc(it.name)
            + (isOther ? ' ▸' : '') + '</span>'
            + '<span class="pie-pct">' + it.pct + '%</span></div>';
        }).join('') : '<div class="pie-empty">暂无天梯对局数据</div>';
      });
      LAST_ARCH = ok ? d : null;
      // PATCH(白神服) 2026-11-16: 点「其它」看长尾明细（用户好奇其它都是什么卡组）
      each('.arch-legend', function (legend) {
        [].forEach.call(legend.querySelectorAll('.pie-item-other'), function (el) {
          el.onclick = function () { showArchTail(d); };
        });
      });
      each('.arch-sub', function (sub) {
        sub.textContent = ok ? ((d.season ? d.season.name : '') + ' · 胜者 ' + d.total + ' 副 · ≥' + d.minPct + '%') : '';
      });
    }).catch(function () {});
  }
  function loadFS() {
    fetch('/api/stats/first-second?t=' + Date.now()).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      var se = d && d.season;
      if (!se || !se.games) {
        each('.fs-body', function (x) { x.innerHTML = '<div class="pie-empty">暂无本赛季数据</div>'; });
        each('.fs-sub', function (x) { x.textContent = ''; });
        return;
      }
      var fw = se.firstWinRate || 0, sw = se.secondWinRate || 0;
      var html =
        '<div class="fs-row"><span class="fs-label">先手</span>'
        + '<span class="fs-bar"><span class="fs-fill first" style="width:' + fw + '%"></span></span>'
        + '<span class="fs-val">' + fw.toFixed(1) + '%</span></div>'
        + '<div class="fs-row"><span class="fs-label">后手</span>'
        + '<span class="fs-bar"><span class="fs-fill second" style="width:' + sw + '%"></span></span>'
        + '<span class="fs-val">' + sw.toFixed(1) + '%</span></div>'
        + '<div class="fs-note">仅统计天梯随机匹配（M,RANDOM#）与 M# 房，赛季 ' + se.start + ' ~ ' + se.end
        + '。</div>';
      each('.fs-body', function (x) { x.innerHTML = html; });
      each('.fs-sub', function (x) { x.textContent = se.name; });
    }).catch(function () {});
  }
  // ── 玩家排名（PC 右栏 + 手机抽屉共用；TOP 10）──
  var LAST_RANK = [];
  function renderRankList(limit) {
    if (!LAST_RANK.length) return '<div class="pie-empty">暂无排名数据</div>';
    return LAST_RANK.slice(0, limit || 10).map(function (p, i) {
      var cls = i === 0 ? ' top1' : i === 1 ? ' top2' : i === 2 ? ' top3' : '';
      return '<div class="rank-row' + cls + '">'
        + '<span class="rank-no">' + (i + 1) + '</span>'
        + '<span class="rank-name" title="' + esc(p.name) + '">' + esc(p.name) + '</span>'
        + '<span class="rank-tier">' + esc((p.tier || '').replace(/^S\d+\s*/, '')) + '</span>'
        + '<span class="rank-pt">' + (p.rating == null ? '-' : p.rating) + '</span>'
        + '</div>';
    }).join('');
  }
  function loadRank() {
    fetch('https://api.ygopro3.cn/api/ladder?t=' + Date.now())
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        LAST_RANK = (j && j.players) || [];
        var pc = document.getElementById('rankList');
        if (pc) pc.innerHTML = renderRankList(10);
        var sub = document.getElementById('rankSub');
        if (sub) sub.textContent = 'TOP ' + Math.min(10, LAST_RANK.length);
        if (drawerKind === 'rank') renderDrawer();
      }).catch(function () {});
  }

  // ── 手机端统计抽屉 ──
  var drawerKind = '';
  var drawerEl = document.getElementById('statDrawer');
  var drawerTitle = document.getElementById('drawerTitle');
  var drawerBody = document.getElementById('drawerBody');
  function closeDrawer() {
    drawerKind = '';
    if (drawerEl) drawerEl.classList.remove('open');
    Array.prototype.forEach.call(document.querySelectorAll('.stats-mobile .stat-card'), function (c) {
      c.classList.remove('active');
    });
  }
  function renderDrawer() {
    if (!drawerBody) return;
    if (drawerKind === 'pie') {
      drawerTitle.textContent = '🥧 天梯主牌系占比（完整）';
      var items = (LAST_ARCH && LAST_ARCH.items) || [];
      if (!items.length) { drawerBody.innerHTML = '<div class="pie-empty">暂无数据</div>'; return; }
      drawerBody.innerHTML = '<div class="pie-wrap">'
        + '<svg class="pie-svg" viewBox="0 0 42 42">' + donutSvg(items) + '</svg>'
        + '<div class="pie-legend">' + items.map(function (it, i) {
            var col = it.name === '其它' ? 'rgba(160,160,172,.55)' : ARCH_COLORS[i % ARCH_COLORS.length];
            return '<div class="pie-item"><span class="pie-dot" style="background:' + col + '"></span>'
              + '<span class="pie-name" title="' + esc(it.name) + '">' + esc(it.name) + '</span>'
              + '<span class="pie-pct">' + it.pct + '%</span></div>';
          }).join('') + '</div></div>';
    } else if (drawerKind === 'rank') {
      drawerTitle.textContent = '🏆 玩家排名（TOP 10）';
      drawerBody.innerHTML = '<div class="rank-list">' + renderRankList(10) + '</div>';
    }
  }
  function openDrawer(kind) {
    if (drawerKind === kind) { closeDrawer(); return; }
    drawerKind = kind;
    if (drawerEl) drawerEl.classList.add('open');
    Array.prototype.forEach.call(document.querySelectorAll('.stats-mobile .stat-card'), function (c) {
      c.classList.toggle('active', c.getAttribute('data-drawer') === kind);
    });
    renderDrawer();
  }
  Array.prototype.forEach.call(document.querySelectorAll('.stats-mobile .stat-card[data-drawer]'), function (c) {
    c.addEventListener('click', function () { openDrawer(c.getAttribute('data-drawer')); });
  });
  var dc = document.getElementById('drawerClose');
  if (dc) dc.addEventListener('click', function (e) { e.stopPropagation(); closeDrawer(); });


  // PATCH(白神服) 2026-11-17: 手机横屏 —— 观战（左）/ 统计（右）抽屉
  (function () {
    function bind(btnId, panelSel, backId, cls) {
      var btn = document.getElementById(btnId);
      var panel = document.querySelector(panelSel);
      var back = document.getElementById(backId);
      if (!btn || !panel) return;
      function close() { panel.classList.remove(cls); if (back) back.classList.remove(back.dataset.cls || 'on'); }
      btn.addEventListener('click', function (e) {
        e.stopPropagation();
        var on = panel.classList.toggle(cls);
        if (back) back.classList.toggle(back.dataset.cls || 'on', on);
      });
      if (back) { back.dataset.cls = back.dataset.cls || 'on'; back.addEventListener('click', close); }
      document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
    }
    // 把按钮搬进抽屉内部 → 抽屉滑动时把手跟着一起动
    (function () {
      var sp = document.querySelector('.spec-card');
      var sb = document.getElementById('specToggle');
      if (sp && sb && sb.parentNode !== sp) sp.appendChild(sb);
      var st = document.querySelector('.stats-col');
      var stb = document.getElementById('statToggle');
      if (st && stb && stb.parentNode !== st) st.appendChild(stb);
    })();
    bind('specToggle', '.spec-card', 'specBackdrop', 'open');
    bind('statToggle', '.stats-col', 'statBackdrop', 'open');
    var sb = document.getElementById('statBackdrop'); if (sb) sb.dataset.cls = 'show';
  })();

  loadArch();
  loadFS();
  loadRank();
  setInterval(loadArch, 30000);
  setInterval(loadFS, 60000);
  setInterval(loadRank, 120000);

  function esc(s) { var d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

  // PATCH(白神服) 头像防闪：原来每次 render 都拼 ?v=Date.now() → 每 5 秒轮询都换新 URL，
  //   浏览器重新请求 → 头像闪一下。改成「每个账号的缓存戳只在本次页面加载时取一次」。
  var AV_VER = {};
  function avatarSrc(account) {
    var k = account || '';
    if (!k) return '';
    if (!AV_VER[k]) AV_VER[k] = String(Date.now());
    return '/api/forum/avatar/' + encodeURIComponent(k) + '?v=' + AV_VER[k];
  }

  function firstCardImg(id) {
    if (!id) return '<span class="spec-first"></span>';
    // PATCH(白神服): 首卡图先 OCG → 先行 → DIY → 最后回退到站内默认卡背 cover2.jpg，
    //   否则新卡/DIY 卡三个图床都没有时会显示破图 + 卡号文字（用户实测「64500127」那串）。
    return '<img class="spec-first" alt="" loading="lazy" src="' + PIC_OCG + id + '.jpg"' +
      ' onerror="if(!this.dataset.s1){this.dataset.s1=1;this.src=\'' + PIC_PRE + id + '.jpg\';}' +
      ' else if(!this.dataset.s2){this.dataset.s2=1;this.src=\'' + PIC_DIY + id + '.jpg\';}' +
      ' else if(!this.dataset.s3){this.dataset.s3=1;this.src=\'cover2.jpg\';} else {this.style.display=\'none\';}">';
  }

  function halfHtml(p, idx) {
    // 天梯身份：优先用账号（avatar 接口按账号取），名字用天梯显示名
    var av = avatarSrc(p.account || '');
    return '<div class="spec-half p' + idx + '">' +
      '<span class="spec-avatar spec-avatar-ph">' + esc((p.name || '?').slice(0, 1)) + '</span>' +
      (av ? '<img class="spec-avatar" alt="" loading="lazy" src="' + av + '" onload="this.previousElementSibling&&this.previousElementSibling.remove()" onerror="this.remove()">' : '') +
      firstCardImg(p.card) +
      '<span class="spec-who"><span class="spec-name">' + esc(p.name) + '</span>' +
      (p.ladderTitle ? '<span class="spec-title">' + esc(p.ladderTitle) + '</span>' : '') +
      '</span>' +
      '</div>';
  }

  function render(rooms) {
    // PATCH(白神服) 内容没变就不要重建 DOM —— 否则每 5 秒轮询都会重插一次 img（头像闪）
    var _sig = JSON.stringify(rooms.map(function (r) {
      return [r.roomName, (r.players || []).map(function (p) {
        return [p.name, p.account, p.card, p.ladderTitle].join('|');
      }).join('~')];
    }));
    if (listEl._renderSig === _sig) return;
    listEl._renderSig = _sig;
    metaEl.textContent = rooms.length ? (rooms.length + ' 场进行中') : '';
    var _sc = document.getElementById('specCount');
    if (_sc) _sc.textContent = rooms.length ? (rooms.length + ' 场进行中') : '暂无对局';
    if (!rooms.length) {
      listEl.innerHTML = '<div class="spec-empty">暂时没有正在进行的随机匹配对局<br>（对局高峰期在中午后）</div>';
      return;
    }
    listEl.innerHTML = rooms.map(function (r) {
      var p0 = r.players[0], p1 = r.players[1];
      return '<div class="spec-row" data-room="' + esc(r.roomName) + '">' +
        '<div class="spec-band">' +
          halfHtml(p0, 1) + '<div class="spec-vs"><b>VS</b></div>' + halfHtml(p1, 2) +
        '</div>' +
        '<div class="spec-actions">' +
        '<button class="spec-btn spec-watch" data-room="' + esc(r.roomName) +
          '" data-p0="' + esc(p0.name) + '" data-p1="' + esc(p1.name) +
          '" data-m0="' + (p0.mainc || '') + '" data-x0="' + (p0.extrac || '') + '" data-h0="' + (p0.handc == null ? '' : p0.handc) +
          '" data-m1="' + (p1.mainc || '') + '" data-x1="' + (p1.extrac || '') + '" data-h1="' + (p1.handc == null ? '' : p1.handc) + '">在线观战</button>' +
        '<button class="spec-btn spec-copy" data-room="' + esc(r.roomName) + '">复制房间号</button>' +
        '</div></div>';
    }).join('');

    Array.prototype.forEach.call(listEl.querySelectorAll('.spec-watch'), function (b) {
      b.onclick = function () {
        // PATCH(白神服) 2026-11-05: 观战必须登录（用登录账号的身份进观战）——
        //   未登录不允许观战，避免出现"观战观众"这种不属于任何账号的匿名席位。
        if (!window.__lobbyAuthOk) {
          msg('请先登录账号再观战（右上角「未登录」→ 登录）');
          return;
        }
        var room = b.getAttribute('data-room');
        // 昵称用登录账号的显示名（服务端会按账号自动登录游戏服，观战者也是登录状态）
        var nick = window.__myName || ('观战' + Math.floor(Math.random() * 9000 + 1000));
        var p0 = b.getAttribute('data-p0') || '', p1 = b.getAttribute('data-p1') || '';
        var nums = ['m0:mainc', 'x0:extrac', 'h0:handc', 'm1:mainc', 'x1:extrac', 'h1:handc'];
        var extra = '';
        extra = '&m0=' + (b.getAttribute('data-m0') || '') + '&x0=' + (b.getAttribute('data-x0') || '') +
                '&h0=' + (b.getAttribute('data-h0') || '') + '&m1=' + (b.getAttribute('data-m1') || '') +
                '&x1=' + (b.getAttribute('data-x1') || '') + '&h1=' + (b.getAttribute('data-h1') || '');
        location.href = 'duel.html?watch=1&room=' + encodeURIComponent(room) +
          '&name=' + encodeURIComponent(nick) +
          '&p0=' + encodeURIComponent(p0) + '&p1=' + encodeURIComponent(p1) + extra;
      };
    });
    Array.prototype.forEach.call(listEl.querySelectorAll('.spec-copy'), function (b) {
      b.onclick = function () {
        var room = b.getAttribute('data-room');
        var done = function () { b.textContent = '已复制'; setTimeout(function () { b.textContent = '复制房间号'; }, 1200); };
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(room).then(done, done);
        } else {
          var ta = document.createElement('textarea');
          ta.value = room; document.body.appendChild(ta); ta.select();
          try { document.execCommand('copy'); } catch (e) {}
          document.body.removeChild(ta); done();
        }
      };
    });
  }

  var busy = false;
  function load() {
    if (busy) return;
    busy = true;
    fetch('/api/lobby/spectate?t=' + Date.now()).then(function (r) { return r.json(); }).then(function (d) {
      render((d && d.rooms) || []);
      busy = false;
    }).catch(function () {
      if (metaEl) metaEl.textContent = '观战列表加载失败';
      busy = false;
    });
  }
  load();
  setInterval(load, 5000);

  // PATCH(白神服) 2026-11-08: 有玩家正在等对手 → 「开始匹配」高亮，告诉玩家现在点就能配上
  function loadQueueHint() {
    fetch('/api/liverooms?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        var rooms = (j && j.rooms) || [];
        var waiting = 0;
        rooms.forEach(function (rm) {
          var us = (rm.users || []).filter(function (u) { return u.pos !== 7; });
          // PATCH(白神服) 2026-11-08: 只有「已经准备了（上传了卡组）」的等待者才算 ——
          //   光坐在房间里没准备的人，点「直接开始」也配不上（用户要求）。
          if (us.length === 1 && us[0].ready === true) waiting++;
        });
        var b = $('btnStart');
        if (!b) return;
        if (waiting > 0 && !b.disabled) {
          b.classList.add('hot');
          // PATCH(白神服) 2026-11-08: 有人在等时按钮文案改成「直接开始」（用户要求）
          if (b.textContent.trim() !== '直接开始') b.textContent = '直接开始';
          b.title = '有 ' + waiting + ' 人正在等你匹配，现在点就能配到';
        } else {
          b.classList.remove('hot');
          if (b.textContent.trim() !== '开始匹配') b.textContent = '开始匹配';
          if (!b.disabled) b.title = '开始匹配';
        }
      })
      .catch(function () {});
  }
  setInterval(loadQueueHint, 8000);
  setTimeout(loadQueueHint, 1200);


  // ── 卡组自适应：算每张卡宽度，保证 10 张/行且整屏不用滚动 ──
  var box = document.getElementById('deckCards');
  function fitDeck() {
    if (!box) return;
    var groups = box.querySelectorAll('.deck-cards');
    if (!groups.length) return;
    var rows = 0;
    Array.prototype.forEach.call(groups, function (g) { rows += Math.ceil(g.children.length / 10); });
    if (!rows) return;
    var secs = box.querySelectorAll('.deck-sec').length;
    var availH = box.clientHeight;
    var availW = box.clientWidth;
    if (availH < 40 || availW < 100) return;      // 布局还没稳定 → 等下一次
    var byW = (availW - 45) / 10;                 // 10 列 + 9×5px 间距
    var byH = (availH - rows * 6 - secs * 20 - 6) / rows / (61 / 42);
    var w = Math.floor(Math.max(38, Math.min(byW, byH)));
    var prev = parseInt(box.style.getPropertyValue('--lobby-card-w'), 10);
    if (!prev || Math.abs(prev - w) > 1) box.style.setProperty('--lobby-card-w', w + 'px');
    if (w < 46) box.classList.add('compact'); else box.classList.remove('compact');
  }

  // 多拍重算：首次渲染 / 字体加载 / 宽度变化都可能让尺寸晚一步稳定
  [0, 120, 400, 900, 1800, 3000].forEach(function (t) { setTimeout(fitDeck, t); });
  if (window.ResizeObserver) {
    new ResizeObserver(function () { fitDeck(); }).observe(box);
    if (box.parentElement) new ResizeObserver(function () { fitDeck(); }).observe(box.parentElement);
  }
  if (window.MutationObserver) {
    new MutationObserver(function () { fitDeck(); }).observe(box, { childList: true, subtree: true });
  }
  window.addEventListener('resize', fitDeck);
  window.addEventListener('load', fitDeck);
})();
</script>
</body>
