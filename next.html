<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白神服 · 新版引导（原型）</title>
<link rel="stylesheet" href="css/next.css?v=20261002z">
</head>
<body class="nx-boot">

<!-- 背景光晕（纯 CSS，GPU 友好） -->
<div class="nx-bg">
    <span class="nx-orb nx-orb-1"></span>
    <span class="nx-orb nx-orb-2"></span>
    <span class="nx-orb nx-orb-3"></span>
    <span class="nx-grid"></span>
</div>

<!-- 顶栏：品牌 + 新旧版切换滑块 -->
<header class="nx-top">
    <div class="nx-brand">
        <span class="nx-brand-dot"></span>
        <span class="nx-brand-name">白神服</span>
        <span class="nx-brand-sub">Sirokami</span>
    </div>
    <div class="nx-version" id="nxVersion" role="tablist" aria-label="界面版本">
        <span class="nx-version-thumb" id="nxVersionThumb"></span>
        <button class="nx-version-btn is-active" data-v="new" role="tab">新版</button>
        <button class="nx-version-btn" data-v="classic" role="tab">经典版</button>
    </div>
</header>

<!-- 问答舞台 -->
<!-- 开场：黑屏中的欢迎大字（缓入缓出，播完自动隐藏） -->
<div class="nx-welcome" id="nxWelcome" aria-hidden="true">
    <span class="nx-w-greet">欢迎来到</span>
    <span class="nx-w-name" aria-label="Sirokami"><i class="nx-w-ch" aria-hidden="true" style="--li:0">S</i><i class="nx-w-ch" aria-hidden="true" style="--li:1">i</i><i class="nx-w-ch" aria-hidden="true" style="--li:2">r</i><i class="nx-w-ch" aria-hidden="true" style="--li:3">o</i><i class="nx-w-ch" aria-hidden="true" style="--li:4">k</i><i class="nx-w-ch" aria-hidden="true" style="--li:5">a</i><i class="nx-w-ch" aria-hidden="true" style="--li:6">m</i><i class="nx-w-ch" aria-hidden="true" style="--li:7">i</i></span>
</div>

<main class="nx-stage" id="nxStage">
    <h1 class="nx-question" id="nxQuestion"></h1>
    <div class="nx-options" id="nxOptions"></div>

    <div class="nx-result" id="nxResult" hidden>
        <div class="nx-result-steps" id="nxSteps"></div>
        <div class="nx-result-cta" id="nxCta"></div>
    </div>

    <button class="nx-back" id="nxBack" hidden title="返回上一步">←</button>
</main>

<footer class="nx-foot">
    <span>原型演示 · 点任意圆形按钮试试，所有功能都会跳到经典版对应页面</span>
</footer>


<!-- 临时调试面板：可分别关闭三个效果，用于定位手感问题（定位完可整段删除） -->
<div class="nx-debug" id="nxDebug">
    <span class="nx-debug-title">调试</span>
    <button class="nx-dbg-btn is-on" data-fx="magnet" type="button">磁吸</button>
    <button class="nx-dbg-btn is-on" data-fx="drag" type="button">拉拽</button>
    <button class="nx-dbg-btn is-on" data-fx="wobble" type="button">扭曲</button>
</div>
<script src="js/next.js?v=20261002z"></script>
</body>
</html>
