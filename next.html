<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>白神服 · 新版引导</title>
<link rel="stylesheet" href="css/next.css?v=20261009d">
<!-- 老组卡器样式（media=not all，进入组卡屏时才启用） -->
<link rel="stylesheet" href="css/card-pool-info.css?v=20261008u" id="nxClassicCssBuilder" media="not all">
<link rel="stylesheet" href="css/card-list.css?v=20261007r" id="nxClassicCssList" media="not all">
<link rel="stylesheet" href="css/deck-viewer.css?v=20261007r" id="nxClassicCssDeckView" media="not all">
<link rel="stylesheet" href="css/replay-viewer.css?v=20261007z7" id="nxCssReplay">

</head>
<body class="nx-boot">

<!-- 背景光晕（纯 CSS，GPU 友好） -->
<div class="nx-bg">
    <span class="nx-orb nx-orb-1"></span>
    <span class="nx-orb nx-orb-2"></span>
    <span class="nx-orb nx-orb-3"></span>
    <span class="nx-grid"></span>
    <!-- 蓝黑主题叠层：body 加 .nx-blue 时整体交叉淡入（历届八强屏用） -->
    <div class="nx-bg-blue">
        <span class="nx-orb nx-orb-b1"></span>
        <span class="nx-orb nx-orb-b2"></span>
        <span class="nx-orb nx-orb-b3"></span>
        <span class="nx-grid nx-grid-blue"></span>
    </div>
</div>

<!-- 顶栏：品牌 + 新旧版切换滑块 -->
<header class="nx-top">
    <div class="nx-brand">
        <span class="nx-brand-dot"></span>
        <div class="nx-brand-texts">
            <div class="nx-brand-line">
                <span class="nx-brand-name">白神服</span>
                <span class="nx-brand-sub">Sirokami</span>
            </div>
            <button class="nx-brand-addr" id="nxBrandAddr" type="button" title="点击复制服务器地址">ygopro3.cn:50010</button>
        </div>
    </div>
    <div class="nx-version" id="nxVersion" role="tablist" aria-label="界面版本">
        <span class="nx-version-thumb" id="nxVersionThumb"></span>
        <button class="nx-version-btn is-active" data-v="new" role="tab">新版</button>
        <button class="nx-version-btn" data-v="classic" role="tab">经典版</button>
    </div>
</header>

<!-- 问答舞台 -->
<!-- 开场：黑屏中的欢迎大字（缓入缓出，播完自动隐藏） -->
<div class="nx-welcome" id="nxWelcome" aria-hidden="true">
    <span class="nx-w-greet">欢迎来到</span>
    <span class="nx-w-name" aria-label="Sirokami"><i class="nx-w-ch" aria-hidden="true" style="--li:0">S</i><i class="nx-w-ch" aria-hidden="true" style="--li:1">i</i><i class="nx-w-ch" aria-hidden="true" style="--li:2">r</i><i class="nx-w-ch" aria-hidden="true" style="--li:3">o</i><i class="nx-w-ch" aria-hidden="true" style="--li:4">k</i><i class="nx-w-ch" aria-hidden="true" style="--li:5">a</i><i class="nx-w-ch" aria-hidden="true" style="--li:6">m</i><i class="nx-w-ch" aria-hidden="true" style="--li:7">i</i></span>
</div>

<main class="nx-stage" id="nxStage">
    <h1 class="nx-question" id="nxQuestion"></h1>
    <div class="nx-options" id="nxOptions"></div>

    <div class="nx-result" id="nxResult" hidden>
        <div class="nx-result-steps" id="nxSteps"></div>
        <div class="nx-result-cta" id="nxCta"></div>
    </div>

    <section class="nx-screen" id="nxScreen" hidden></section>
</main>

<footer class="nx-foot">
    <span>点空白处 / 按 Esc 返回上一步</span>
</footer>


<!-- 回放播放器弹窗（经典版原样移植，页面常驻，openReplay 时弹出） -->
<div class="rp-modal" id="replayModal" style="display:none;">
        <div class="rp-modal-box">
            <div class="rp-modal-head">
                <div class="replay-title">回放播放器</div>
                <button class="rp-modal-close" id="replayClose" title="关闭 (Esc)">✕</button>
            </div>

            <!-- 输入区 -->
            <div class="replay-input-bar">
                <input type="text" id="replayInput" placeholder="输入回放码，如 R#3333" autocomplete="off">
                <button id="replayLoadBtn">▶ 加载回放</button>
                <span class="replay-meta" id="replayMeta"></span>
            </div>

            <!-- 播放控制条 -->
            <div class="replay-controls" id="replayControls" style="display:none;">
                <button id="rpPlayPause" title="播放/暂停">⏸ 暂停</button>
                <button id="rpStepBack" title="上一步">⏮</button>
                <button id="rpStep" title="下一步">⏭</button>
                <span class="rp-speed-label">速度</span>
                <button class="rp-speed" data-s="0.5">0.5x</button>
                <button class="rp-speed active" data-s="1">1x</button>
                <button class="rp-speed" data-s="2">2x</button>
                <button class="rp-speed" data-s="4">4x</button>
                <input type="range" id="rpProgress" min="0" max="100" value="0" style="flex:1;">
                <span class="rp-progress-text" id="rpProgressText">0 / 0</span>
            </div>

            <!-- 主体：左场地 70% / 右日志 30% -->
            <div class="replay-main" id="replayMain" style="display:none;">
                <div class="replay-field" id="replayField">
                    <div class="rp-loading-tip" id="rpFieldTip">回放加载中...</div>
                </div>
                <div class="replay-log" id="replayLog">
                    <div class="replay-log-title">对局日志</div>
                    <div class="replay-log-body" id="replayLogBody"></div>
                </div>
            </div>
        </div>
    </div>


<!-- 老组卡器（经典版原样移植）：整块从 index.html 搬来，进组卡屏时搬进内容区 -->
<div id="nxBuilderHome">
<div id="nxBuilderHost" hidden>
    <div class="deck-builder-top">
            <button class="deck-builder-toggle" id="deckBuilderToggle">🛠 组卡模式</button>
        </div>
<div class="db-layout" id="dbLayout" style="display:none;">
            <!-- 左栏：点卡详情 + 加入按钮 -->
            <div class="db-col db-col-left">
                <div class="db-panel db-detail-panel">
                    <div class="db-panel-title">📖 卡片详情</div>
                    <div class="db-detail-body" id="dbDetailBody">
                        <div class="db-detail-empty">点击右侧卡片查看详情<br><br>点击下方按钮加入卡组</div>
                    </div>
                </div>
            </div>

            <!-- 中栏：卡组编辑（复用 deckBuilderPanel） -->
            <div class="db-col db-col-mid">
                <div class="deck-builder-panel" id="deckBuilderPanel">
                    <div class="db-header">
                        <div class="db-title">🛠 我的卡组</div>
                        <div class="db-actions">
                            <span class="db-score" id="dbScore">总分：0/100</span>
                            <button class="db-btn db-btn-gold" id="dbHighScore" title="高亮卡组中 8 分及以上的卡">查询高分卡</button>
                            <button class="db-btn" id="dbSort">排序</button>
                            <button class="db-btn" id="dbImport">导入</button>
                            <button class="db-btn" id="dbCopy">复制</button>
                            <button class="db-btn" id="dbDownload">下载 ydk</button>
                            <button class="db-btn db-danger" id="dbClear" title="清空卡组">清空</button>
                        </div>
                    </div>
                    <div class="db-section" id="dbMain">
                        <div class="db-section-title">主卡组 <span class="db-count" id="dbMainCount">0</span>/60</div>
                        <div class="db-cards" id="dbMainCards"></div>
                    </div>
                    <div class="db-section" id="dbExtra">
                        <div class="db-section-title">额外卡组 <span class="db-count" id="dbExtraCount">0</span>/15</div>
                        <div class="db-cards" id="dbExtraCards"></div>
                    </div>
                    <div class="db-section" id="dbSide">
                        <div class="db-section-title">副卡组 <span class="db-count" id="dbSideCount">0</span>/15</div>
                        <div class="db-cards" id="dbSideCards"></div>
                    </div>
                </div>
            </div>

            <!-- 右栏：搜卡（搜索 + 卡图网格，一行5张滚动） -->
            <div class="db-col db-col-right">
                <div class="db-panel db-search-panel">
                    <div class="db-panel-title">🔎 搜卡</div>
                    <div class="db-search-box">
                        <input type="text" class="db-search-input" id="dbSearchInput"
                            placeholder="搜索卡名 / ID / 效果..." autocomplete="off">
                        <div class="db-filter-toggle-row">
                            <button class="db-filter-toggle" id="dbFilterToggle">⚙ 筛选 <span class="db-filter-count" id="dbFilterCount"></span></button>
                            <button class="db-common-btn" id="dbCommonBtn" type="button" title="只看常用卡（手坑/泛用魔法陷阱等）">★ 常用卡</button>
                            <button class="db-filter-clear" id="dbFilterClear" title="清空全部筛选与「相关卡片」">清空</button>
                        </div>
                        <div class="db-adv-filters" id="dbAdvFilters">
                            <div class="db-af-group db-af-wide">
                                <div class="db-af-label">类型</div>
                                <div class="db-af-chips" id="dbFilterTypes"></div>
                            </div>
                            <div class="db-af-group db-af-wide">
                                <div class="db-af-label">怪兽</div>
                                <div class="db-af-chips" id="dbFilterMonsterSub"></div>
                            </div>
                            <div class="db-af-group db-af-wide">
                                <div class="db-af-label">魔法</div>
                                <div class="db-af-chips" id="dbFilterSpellSub"></div>
                            </div>
                            <div class="db-af-group db-af-wide">
                                <div class="db-af-label">陷阱</div>
                                <div class="db-af-chips" id="dbFilterTrapSub"></div>
                            </div>
                            <div class="db-af-group">
                                <div class="db-af-label">星级</div>
                                <input type="number" class="db-af-input" id="dbFLevelMin" placeholder="最小" min="0" max="13">
                                <span class="db-af-sep">~</span>
                                <input type="number" class="db-af-input" id="dbFLevelMax" placeholder="最大" min="0" max="13">
                            </div>
                            <div class="db-af-group">
                                <div class="db-af-label">攻击力</div>
                                <input type="number" class="db-af-input" id="dbFAtkMin" placeholder="最小">
                                <span class="db-af-sep">~</span>
                                <input type="number" class="db-af-input" id="dbFAtkMax" placeholder="最大">
                            </div>
                            <div class="db-af-group">
                                <div class="db-af-label">守备力</div>
                                <input type="number" class="db-af-input" id="dbFDefMin" placeholder="最小">
                                <span class="db-af-sep">~</span>
                                <input type="number" class="db-af-input" id="dbFDefMax" placeholder="最大">
                            </div>
                            <div class="db-af-group">
                                <div class="db-af-label">分值</div>
                                <input type="number" class="db-af-input" id="dbFScoreMin" placeholder="最小">
                                <span class="db-af-sep">~</span>
                                <input type="number" class="db-af-input" id="dbFScoreMax" placeholder="最大">
                                <span class="db-af-hint">-1 = 禁卡</span>
                            </div>
                            <div class="db-af-group db-af-wide">
                                <div class="db-af-label">属性</div>
                                <div class="db-af-chips" id="dbFilterAttr"></div>
                            </div>
                            <div class="db-af-group db-af-wide">
                                <div class="db-af-label">种族</div>
                                <div class="db-af-chips" id="dbFilterRace"></div>
                            </div>
                        </div>
                    </div>
                    <div class="db-grid-wrap">
                        <div class="db-grid" id="dbGrid"></div>
                        <div class="db-grid-tip" id="dbGridTip"></div>
                    </div>
                </div>
            </div>
        </div>
</div>
</div>
<script src="js/deck-viewer.js?v=20261007r"></script>
<script src="js/replay-viewer.js?v=20261007z7"></script>
<script src="js/deck-builder.js?v=20261008x"></script>
<script src="js/next.js?v=20261009e"></script>
</body>
</html>
