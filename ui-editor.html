<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>手机端组卡器 · 布局参数原型 v2</title>
<!--
  ══════════════════════════════════════════════════════════════════════
  白神服 — 手机端组卡器「布局参数」原型 v2
  ──────────────────────────────────────────────────────────────────────
  这一版不靠拖动，而是把规格写成**参数**，你在手机上直接调数字看效果：
    每行张数（固定 10） / 主·额外·副 各占几行 / 三段之间的间隔（单位=一行卡）
    右侧滑块宽度 / 右侧按键宽度 / 顶部按钮排几行
  右上角实时显示「整块需要多高 / 屏幕多高 / 差多少」，
  调好之后点「复制参数」把 JSON 发我，我按这份参数把真组卡器实现出来。

  地址：/ui-editor.html?edit=1  （不带 edit=1 是纯预览：可点按键、点卡片看浮层）
  ══════════════════════════════════════════════════════════════════════
-->
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; overflow: hidden; background: #000; color: #eee;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    -webkit-user-select: none; user-select: none;
  }
  #stage {
    position: fixed; inset: 0; overflow: hidden;
    background: radial-gradient(120% 80% at 50% 0%, #171226, #060509 70%);
    --rail-w: 18px;      /* 右侧按键宽度（px） */
    --drawer-w: 78;      /* 右侧滑块宽度（%） */
  }

  /* ① 顶部：我的卡组 + 按钮（两行） */
  #head {
    position: absolute; left: 0; right: 0; top: 0;
    background: linear-gradient(180deg, #2b1a33, #150f1d);
    border-bottom: 1px solid rgba(212,175,55,.35);
    padding: 4px 6px 6px;
    z-index: 6;
  }
  #head .h-row1 {
    display: flex; align-items: baseline; justify-content: space-between;
    font-size: 12px; color: var(--gold, #f0e68c); font-weight: 700; margin-bottom: 4px;
  }
  #head .h-row1 .sub { font-size: 10.5px; color: #b9b2a4; font-weight: 400; }
  #head .h-btns { display: flex; flex-wrap: wrap; gap: 4px; }
  #head .h-btns button {
    flex: 1 1 auto; min-width: 74px; padding: 6px 6px; border-radius: 7px;
    border: 1px solid rgba(212,175,55,.45); background: rgba(255,255,255,.05);
    color: #e9e4d8; font-size: 10.5px; font-weight: 700; white-space: nowrap;
  }
  #head .h-btns button.gold { background: linear-gradient(135deg,#d4af37,#ffd700); color: #26200a; border: none; }
  #head .h-btns button.danger { border-color: rgba(216,30,68,.6); color: #ffc9d4; }

  /* ② 卡组区（不滚动，整块可见） */
  #deck {
    position: absolute; left: 0; bottom: 0;
    overflow: hidden; padding: 3px 3px 0;
  }
  .sec-title { font-size: 10.5px; font-weight: 800; color: #f0e68c; margin: 2px 0 2px; display: flex; justify-content: space-between; }
  .sec-title b { color: #fff; font-weight: 700; }
  .row10 { display: grid; grid-template-columns: repeat(10, 1fr); gap: var(--gap, 2px); }
  .slot { aspect-ratio: 59 / 86; border-radius: 2px; background: rgba(255,255,255,.10); border: 1px solid rgba(212,175,55,.40); }
  .slot.filled { background: linear-gradient(160deg,#6a4f8f,#2c2040); border-color: rgba(212,175,55,.85); }
  .slot.filled::after { content: ''; display: block; width: 100%; height: 100%; border-radius: 2px; background: radial-gradient(60% 40% at 50% 30%, rgba(255,215,120,.35), transparent 70%); }
  .gaprows { display: grid; grid-template-columns: repeat(10, 1fr); gap: var(--gap, 2px); }
  .gaprows > i { aspect-ratio: 59 / 86; }

  /* ③ 右侧按键（单一竖条，抽屉打开时跟着左移） */
  #railBtn {
    position: absolute; right: 0; z-index: 20;
    width: var(--rail-w); display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #d81e44, #7d1230);
    border-radius: 8px 0 0 8px; border: 1px solid rgba(255,255,255,.25); border-right: none;
    color: #fff; font-size: 11px; font-weight: 800;
    writing-mode: vertical-rl; letter-spacing: 2px;
    transition: right .25s ease;
  }
  body.drawer-open #railBtn { right: calc(var(--drawer-w) * 1%); }

  /* ④ 右侧滑块（搜卡） */
  #drawer {
    position: absolute; right: 0; z-index: 15;
    width: calc(var(--drawer-w) * 1%);
    background: rgba(10,8,14,.985);
    border-left: 1px solid rgba(212,175,55,.55);
    border-radius: 10px 0 0 10px;
    box-shadow: -10px 0 26px rgba(0,0,0,.6);
    transform: translateX(103%);
    transition: transform .25s ease;
    display: flex; flex-direction: column;
    padding: 6px;
  }
  body.drawer-open #drawer { transform: translateX(0); }
  #drawer .d-top { display: flex; gap: 5px; margin-bottom: 6px; }
  #drawer input {
    flex: 1; min-width: 0; padding: 7px 9px; border-radius: 7px;
    border: 1px solid #333; background: #0b0a0f; color: #eee; font-size: 12px;
  }
  #drawer .d-grid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; align-content: start; }
  #drawer .d-card { aspect-ratio: 59/86; border-radius: 3px; background: linear-gradient(160deg,#332a3f,#181322); border: 1px solid rgba(212,175,55,.4); }

  /* ⑤ 卡片信息浮层 */
  #info {
    position: absolute; left: 6%; top: 22%; width: 88%; height: 52%; z-index: 40;
    display: none; gap: 8px; padding: 9px;
    background: rgba(10,8,13,.985); border: 1px solid rgba(212,175,55,.6); border-radius: 12px;
    box-shadow: 0 18px 48px rgba(0,0,0,.8);
  }
  #info.on { display: flex; }
  #info .i-img { width: 36%; max-width: 118px; aspect-ratio: 59/86; border-radius: 6px; background: linear-gradient(160deg,#332a3f,#181322); border: 1px solid rgba(212,175,55,.4); flex: 0 0 auto; }
  #info .i-main { flex: 1; min-width: 0; overflow-y: auto; }
  #info .i-name { font-size: 13px; font-weight: 800; color: #f0e68c; margin-bottom: 3px; }
  #info .i-type { font-size: 10.5px; color: #9ec4f0; margin-bottom: 5px; }
  #info .i-text { font-size: 11px; color: #d8d3ca; line-height: 1.6; }
  #info .i-x { position: absolute; right: 6px; top: 6px; width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.5); color: #fff; font-size: 13px; }

  /* ⑥ 参数面板（仅 ?edit=1） */
  #panel { position: fixed; inset: 0; z-index: 90; display: none; background: rgba(0,0,0,.92); padding: 10px; overflow-y: auto; }
  body.editing #panel { display: block; }
  #panel h3 { margin: 2px 0 8px; font-size: 13px; color: #ffd700; }
  .prow { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; font-size: 11.5px; color: #cfc8d6; }
  .prow label { flex: 1 1 auto; min-width: 0; }
  .prow input[type=range] { flex: 0 0 44%; }
  .prow input[type=number] {
    width: 62px; padding: 4px 6px; border-radius: 6px; border: 1px solid #444;
    background: #0b0a0f; color: #eee; font-size: 12px; text-align: center;
  }
  .prow .v { color: #ffd700; font-weight: 700; min-width: 34px; text-align: right; }
  #fit { padding: 8px; border-radius: 8px; font-size: 11.5px; line-height: 1.6; margin: 8px 0; }
  #fit.ok { background: rgba(40,180,90,.16); border: 1px solid rgba(40,180,90,.5); color: #a8f0c0; }
  #fit.bad { background: rgba(216,30,68,.16); border: 1px solid rgba(216,30,68,.55); color: #ffc0cc; }
  #panel .pbtn { display: flex; gap: 6px; flex-wrap: wrap; }
  #panel .pbtn button { flex: 1 1 30%; padding: 9px 6px; border-radius: 8px; border: 1px solid #444; background: #1a1820; color: #eee; font-size: 12px; font-weight: 700; }
  #panel .pbtn button.pri { background: #d81e44; border-color: #d81e44; }
  #out { margin-top: 8px; display: none; }
  #out.on { display: block; }
  #out textarea { width: 100%; height: 26vh; background: #07060a; color: #9fe0a8; border: 1px solid #333; border-radius: 6px; font-size: 10.5px; font-family: ui-monospace, Consolas, monospace; }
  #openPanel {
    position: fixed; right: 6px; bottom: 6px; z-index: 95; display: none;
    padding: 8px 12px; border-radius: 18px; border: 1px solid rgba(212,175,55,.6);
    background: rgba(20,16,24,.92); color: #ffd700; font-size: 11.5px; font-weight: 700;
  }
  body.editing #openPanel { display: block; }
</style>
</head>
<body>

<div id="stage">
  <!-- ① 顶部：我的卡组 + 两行按钮 -->
  <div id="head">
    <div class="h-row1">
      <span>我的卡组</span>
      <span class="sub">总分 <b id="score">0</b>/100 · 主 <b id="cMain">0</b>/60 · 额外 <b id="cExtra">0</b>/15 · 副 <b id="cSide">0</b>/15</span>
    </div>
    <div class="h-btns">
      <button class="gold" data-act="save">保存到账号</button>
      <button data-act="load">读取账号卡组</button>
      <button data-act="import">导入</button>
      <button data-act="export">导出 ydk</button>
      <button data-act="sort">排序</button>
      <button data-act="high">查询高分卡</button>
      <button data-act="copy">复制</button>
      <button data-act="del" class="danger">删除</button>
      <button data-act="clear" class="danger">清空</button>
    </div>
  </div>

  <!-- ② 卡组区 -->
  <div id="deck"></div>

  <!-- ③ 右侧按键（单一竖条） -->
  <div id="railBtn">搜卡</div>

  <!-- ④ 右侧滑块 -->
  <div id="drawer">
    <div class="d-top">
      <input id="dInput" placeholder="搜索卡名 / ID / 效果…">
    </div>
    <div class="d-grid" id="dGrid"></div>
  </div>

  <!-- ⑤ 卡片信息浮层 -->
  <div id="info">
    <button class="i-x" id="iClose">✕</button>
    <div class="i-img"></div>
    <div class="i-main">
      <div class="i-name">卡片名（示例）</div>
      <div class="i-type">怪兽 · 效果 · 暗 · 龙族 · ★8 · ATK 3000 / DEF 2500</div>
      <div class="i-text">①：效果文本占位，用来确认浮层高度和滚动是否合适。<br><br>②：点右上角 ✕ 关闭。</div>
    </div>
  </div>
</div>

<button id="openPanel">参数</button>

<!-- ⑥ 参数面板 -->
<div id="panel">
  <h3>布局参数（单位：行 = 一张卡的高度）</h3>
  <div id="fit"></div>

  <div class="prow">
    <label>取尺寸方式</label>
    <button id="mWidth" style="padding:6px 8px;border-radius:7px;border:1px solid #444;background:#1a1820;color:#eee;font-size:11px">卡占满宽度</button>
    <button id="mHeight" style="padding:6px 8px;border-radius:7px;border:1px solid #444;background:#1a1820;color:#eee;font-size:11px">按高度适配</button>
  </div>
  <div class="prow"><label>每行张数</label><input type="range" min="8" max="12" step="1" id="pPerRow"><span class="v" id="vPerRow"></span></div>
  <div class="prow"><label>主卡组占几行</label><input type="range" min="1" max="8" step="1" id="pMain"><span class="v" id="vMain"></span></div>
  <div class="prow"><label>额外卡组占几行</label><input type="range" min="1" max="4" step="1" id="pExtra"><span class="v" id="vExtra"></span></div>
  <div class="prow"><label>副卡组占几行</label><input type="range" min="1" max="4" step="1" id="pSide"><span class="v" id="vSide"></span></div>
  <div class="prow"><label>主 ↔ 额外 间隔（行）</label><input type="range" min="0" max="6" step="0.5" id="pGap1"><span class="v" id="vGap1"></span></div>
  <div class="prow"><label>额外 ↔ 副 间隔（行）</label><input type="range" min="0" max="4" step="0.5" id="pGap2"><span class="v" id="vGap2"></span></div>
  <div class="prow"><label>副卡组 ↔ 底部（行）</label><input type="range" min="0" max="4" step="0.5" id="pGap3"><span class="v" id="vGap3"></span></div>
  <div class="prow"><label>右侧按键宽（px）</label><input type="range" min="14" max="34" step="1" id="pRail"><span class="v" id="vRail"></span></div>
  <div class="prow"><label>右侧滑块宽（%）</label><input type="range" min="50" max="92" step="1" id="pDrawer"><span class="v" id="vDrawer"></span></div>
  <div class="prow"><label>滑块圆角/阴影</label><span class="v" style="color:#8b8496;font-weight:400">固定</span></div>

  <div class="pbtn">
    <button id="btnSave" class="pri">保存参数</button>
    <button id="btnCopy">复制参数</button>
    <button id="btnReset">重置</button>
    <button id="btnPreview">预览</button>
    <button id="btnClose">收起面板</button>
  </div>
  <div id="out"><textarea id="outText" spellcheck="false"></textarea></div>
</div>

<script>
(function () {
  'use strict';
  var KEY = 'siro.builderMobile.params.v2';
  var editing = /[?&]edit=1/.test(location.search);

  /* ── 默认参数 ── */
  var DEFAULTS = {
    perRow: 10,
    rowsMain: 6, rowsExtra: 2, rowsSide: 2,
    gap1: 6, gap2: 2, gap3: 3,     // 单位：一行卡的高度（用户给的 6 / 2 / 3）
    railW: 20,                      // 右侧按键宽度 px
    drawerW: 78,                    // 右侧滑块宽度 %
    padX: 3, padTop: 3, gapPx: 2,   // 卡组区内边距 / 卡间距
    fitMode: 'width'                // width = 卡占满宽度（10 张填满一行）；height = 按高度适配（卡会变小，间隔 6/2/3 才放得下）
  };
  var P = load();

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var o = JSON.parse(raw); if (o && o.perRow) return Object.assign({}, DEFAULTS, o); }
    } catch (e) {}
    return Object.assign({}, DEFAULTS);
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} }

  var stage = document.getElementById('stage');
  var deck = document.getElementById('deck');
  var head = document.getElementById('head');
  var railBtn = document.getElementById('railBtn');
  var drawer = document.getElementById('drawer');

  /* ── 渲染卡组区（10 张一行，三段固定位置，不滚动） ── */
  function buildDeck() {
    var stW = stage.clientWidth, stH = stage.clientHeight;
    var headH = head.getBoundingClientRect().height;
    var deckW = stW - 0;                        // 卡组区占满宽度（右侧按键浮在上面）
    var innerW = deckW - P.padX * 2;
    var secTitleH = 14;                         // 「主卡组 / 额外卡组 / 副卡组」标题行高
    var avail = stH - headH - P.padTop;
    var totalRows = (P.rowsMain + P.rowsExtra + P.rowsSide) + (P.gap1 + P.gap2 + P.gap3);

    var cardW, rowH, rowStep, need;
    if (P.fitMode === 'height') {
      // 按高度适配：所有行都塞进可用高度 → 卡变小，左右留白
      rowStep = Math.max(6, (avail - secTitleH * 3) / Math.max(1, totalRows));
      rowH = Math.max(4, rowStep - P.gapPx);
      cardW = rowH * 59 / 86;
      need = avail;   // 正好铺满
    } else {
      // 卡占满宽度：10 张填满一行，行高由卡宽决定 → 可能装不下
      cardW = (innerW - P.gapPx * (P.perRow - 1)) / P.perRow;
      rowH = cardW * 86 / 59;
      rowStep = rowH + P.gapPx;
      need = totalRows * rowStep + secTitleH * 3;
    }

    if (P.fitMode === 'height') {
      var usedW = cardW * P.perRow + P.gapPx * (P.perRow - 1) + P.padX * 2;
      deck.style.width = Math.min(deckW, Math.ceil(usedW)) + 'px';
      deck.style.left = Math.max(0, Math.round((deckW - usedW) / 2)) + 'px';
    } else {
      deck.style.width = deckW + 'px';
      deck.style.left = '0px';
    }
    deck.style.top = headH + 'px';
    deck.style.height = avail + 'px';
    deck.style.setProperty('--gap', P.gapPx + 'px');
    stage.style.setProperty('--rail-w', P.railW + 'px');
    stage.style.setProperty('--drawer-w', P.drawerW);

    function rowHtml(list, filledN) {
      return '<div class="row10">' + list.map(function (_, i) {
        return '<div class="slot' + (i < filledN ? ' filled' : '') + '"></div>';
      }).join('') + '</div>';
    }
    function gapHtml(rows) {
      var one = '<i></i>'.repeat(P.perRow);
      return '<div class="gaprows" style="height:' + (rows * rowStep) + 'px">' + (rows > 0 ? one : '') + '</div>';
    }
    var mainSlots = P.rowsMain * P.perRow;
    var extraSlots = P.rowsExtra * P.perRow;
    var sideSlots = P.rowsSide * P.perRow;

    deck.innerHTML =
      '<div class="sec-title">主卡组 <b>' + Math.min(mainSlots, 40) + ' / 60</b></div>' +
      rowHtml(new Array(mainSlots), 40) +
      gapHtml(P.gap1) +
      '<div class="sec-title">额外卡组 <b>15 / 15</b></div>' +
      rowHtml(new Array(extraSlots), 15) +
      gapHtml(P.gap2) +
      '<div class="sec-title">副卡组 <b>15 / 15</b></div>' +
      rowHtml(new Array(sideSlots), 15) +
      gapHtml(P.gap3);

    // 实时计算：需要多高 / 屏幕多高
    var fit = document.getElementById('fit');
    if (fit) {
      var ok = need <= avail + 0.5;
      fit.className = ok ? 'ok' : 'bad';
      var side = Math.max(0, Math.round((deckW - (cardW * P.perRow + P.gapPx * (P.perRow - 1) + P.padX * 2)) / 2));
      fit.innerHTML =
        '模式 <b>' + (P.fitMode === 'height' ? '按高度适配' : '卡占满宽度') + '</b> · 卡宽 <b>' + cardW.toFixed(1) + 'px</b> · 行高 <b>' + rowH.toFixed(1) + 'px</b>' +
        (P.fitMode === 'height' ? ' · 左右各留 <b>' + side + 'px</b>' : '') + '<br>' +
        '整块需要 <b>' + Math.round(need) + 'px</b> / 可用 <b>' + Math.round(avail) + 'px</b>' +
        (ok ? ' → 放得下 ✓（余 ' + Math.round(avail - need) + 'px）'
            : ' → <b>放不下 ✗（超 ' + Math.round(need - avail) + 'px）</b>');
    }
    return { cardW: cardW, rowH: rowH, need: need, avail: avail, headH: headH };
  }

  /* ── 预览交互 ── */
  function toggleDrawer(on) {
    var open = (on === undefined) ? !document.body.classList.contains('drawer-open') : on;
    document.body.classList.toggle('drawer-open', open);
  }
  function toggleInfo(on) { document.getElementById('info').classList.toggle('on', !!on); }

  railBtn.onclick = function () { toggleDrawer(); };
  document.getElementById('iClose').onclick = function () { toggleInfo(false); };
  deck.addEventListener('click', function (e) { if (!editing && e.target.closest('.slot')) toggleInfo(true); });
  document.getElementById('dGrid').addEventListener('click', function (e) {
    if (!editing && e.target.closest('.d-card')) toggleInfo(true);
  });
  (function fillDrawer() {
    var h = '';
    for (var i = 0; i < 40; i++) h += '<div class="d-card"></div>';
    document.getElementById('dGrid').innerHTML = h;
  })();

  /* ── 参数面板 ── */
  var BINDS = [
    ['pPerRow', 'perRow', 'vPerRow', function (v) { return v; }],
    ['pMain', 'rowsMain', 'vMain', function (v) { return v; }],
    ['pExtra', 'rowsExtra', 'vExtra', function (v) { return v; }],
    ['pSide', 'rowsSide', 'vSide', function (v) { return v; }],
    ['pGap1', 'gap1', 'vGap1', function (v) { return v; }],
    ['pGap2', 'gap2', 'vGap2', function (v) { return v; }],
    ['pGap3', 'gap3', 'vGap3', function (v) { return v; }],
    ['pRail', 'railW', 'vRail', function (v) { return v + 'px'; }],
    ['pDrawer', 'drawerW', 'vDrawer', function (v) { return v + '%'; }]
  ];

  function syncInputs() {
    BINDS.forEach(function (b) {
      var el = document.getElementById(b[0]), lab = document.getElementById(b[2]);
      if (el) el.value = P[b[1]];
      if (lab) lab.textContent = b[3](P[b[1]]);
    });
  }

  if (editing) {
    document.body.classList.add('editing');
    syncInputs();
    buildDeck();
    if (typeof syncMode === 'function') syncMode();
    BINDS.forEach(function (b) {
      var el = document.getElementById(b[0]);
      if (!el) return;
      el.addEventListener('input', function () {
        P[b[1]] = parseFloat(el.value);
        var lab = document.getElementById(b[2]);
        if (lab) lab.textContent = b[3](P[b[1]]);
        buildDeck();
      });
    });
    function syncMode() {
      ['mWidth', 'mHeight'].forEach(function (id) {
        var b = document.getElementById(id);
        if (!b) return;
        var on = (id === 'mWidth') === (P.fitMode === 'width');
        b.style.background = on ? '#d81e44' : '#1a1820';
        b.style.borderColor = on ? '#d81e44' : '#444';
      });
    }
    document.getElementById('mWidth').onclick = function () { P.fitMode = 'width'; syncMode(); save(); buildDeck(); };
    document.getElementById('mHeight').onclick = function () { P.fitMode = 'height'; syncMode(); save(); buildDeck(); };
    document.getElementById('btnSave').onclick = function () { save(); buildDeck(); };
    document.getElementById('btnReset').onclick = function () {
      P = Object.assign({}, DEFAULTS); syncInputs(); save(); buildDeck();
    };
    document.getElementById('btnPreview').onclick = function () { location.href = location.pathname; };
    document.getElementById('btnClose').onclick = function () { document.getElementById('panel').style.display = 'none'; };
    document.getElementById('openPanel').onclick = function () { document.getElementById('panel').style.display = 'block'; };
    document.getElementById('btnCopy').onclick = function () {
      var txt = '/* 白神服 · 手机端组卡器布局参数（行 = 一张卡的高度） */\nvar MOBILE_KIT = ' +
        JSON.stringify(P, null, 2) + ';';
      var out = document.getElementById('out');
      document.getElementById('outText').value = txt;
      out.classList.add('on');
      try { navigator.clipboard.writeText(txt); } catch (e) {}
    };
  } else {
    buildDeck();
  }
  window.addEventListener('resize', buildDeck);
  window.addEventListener('orientationchange', function () { setTimeout(buildDeck, 150); });
})();
</script>
</body>
</html>
